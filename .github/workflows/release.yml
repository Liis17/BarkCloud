name: "🚀 BarkCloud Release"

# Релизная точка: push в master публикует один релиз со сборками
# всех приложений. Релиз создаётся только после успешного полного
# прогона всех тестов (tests.yml с force-all).

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: barkcloud-release
  cancel-in-progress: false

jobs:
  tests:
    name: "Полный прогон всех тестов"
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/tests.yml
    with:
      force-all: true
    secrets: inherit

  version:
    name: "Версия релиза"
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: "Вычисление следующей версии v1.x.y"
        id: version
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest="$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | sort -V | tail -n 1 || true)"
          python3 - "$latest" >> "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys

          latest = sys.argv[1]
          if latest:
              match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", latest)
              if not match:
                  raise SystemExit(f"Некорректный предыдущий тег: {latest}")
              major, minor, patch = map(int, match.groups())
              patch += 1
          else:
              major, minor, patch = 1, 0, 0

          if minor > 999 or patch > 999:
              raise SystemExit("Minor и patch версии не могут превышать 999.")
          version = f"v{major}.{minor}.{patch}"
          version_code = major * 1_000_000 + minor * 1_000 + patch
          if version_code <= 0 or version_code > 2_147_483_647:
              raise SystemExit("versionCode выходит за допустимый диапазон Android.")
          print(f"version={version}")
          print(f"version_code={version_code}")
          PY

          version="$(sed -n 's/^version=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          version_code="$(sed -n 's/^version_code=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          if [ -n "$latest" ]; then
            previous_assets="$(gh release view "$latest" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$previous_assets" | grep -Fxq 'android-update.json'; then
              previous_dir="$RUNNER_TEMP/previous-android-release"
              mkdir -p "$previous_dir"
              gh release download "$latest" --pattern android-update.json --dir "$previous_dir"
              python3 - "$previous_dir/android-update.json" "$version_code" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as manifest_file:
              manifest = json.load(manifest_file)
          if manifest.get("schemaVersion") != 1:
              raise SystemExit("Манифест предыдущего Android-релиза имеет неизвестную схему.")
          previous_code = manifest.get("versionCode")
          if not isinstance(previous_code, int) or isinstance(previous_code, bool):
              raise SystemExit("Манифест предыдущего Android-релиза содержит неверный versionCode.")
          if int(sys.argv[2]) <= previous_code:
              raise SystemExit("Новый Android versionCode должен быть больше кода предыдущего манифеста.")
          PY
            else
              echo "Предыдущий релиз $latest не содержит android-update.json; он будет обновляться вручную."
            fi
          fi
          echo "Коммит: ${SHA}, релиз: ${version}, Android versionCode: ${version_code}"

  android:
    name: "Android APK"
    needs: [tests, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: "Setup JDK 17"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v5

      - name: "Сборка release APK"
        working-directory: Android/BarkCloud.Android
        env:
          ANDROID_RELEASE_VERSION_NAME: ${{ needs.version.outputs.version }}
          ANDROID_RELEASE_VERSION_CODE: ${{ needs.version.outputs.version_code }}
          BARKCLOUD_ANDROID_KEYSTORE_BASE64: ${{ secrets.BARKCLOUD_ANDROID_KEYSTORE_BASE64 }}
          BARKCLOUD_ANDROID_KEYSTORE_PASSWORD_BASE64: ${{ secrets.BARKCLOUD_ANDROID_KEYSTORE_PASSWORD_BASE64 }}
          BARKCLOUD_ANDROID_KEY_ALIAS_BASE64: ${{ secrets.BARKCLOUD_ANDROID_KEY_ALIAS_BASE64 }}
          BARKCLOUD_ANDROID_KEY_PASSWORD_BASE64: ${{ secrets.BARKCLOUD_ANDROID_KEY_PASSWORD_BASE64 }}
        run: |
          ./gradlew :app:printReleaseCertificateFingerprint --stacktrace
          version_name="${ANDROID_RELEASE_VERSION_NAME#v}"
          ./gradlew :app:assembleRelease \
            -PandroidReleaseVersionName="$version_name" \
            -PandroidReleaseVersionCode="$ANDROID_RELEASE_VERSION_CODE" \
            --stacktrace
          apk="app/build/outputs/apk/release/app-release.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$build_tools"
          aapt2="$ANDROID_HOME/build-tools/$build_tools/aapt2"
          apksigner="$ANDROID_HOME/build-tools/$build_tools/apksigner"
          badging="$("$aapt2" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='com.barkfluff.BarkCloud' versionCode='$ANDROID_RELEASE_VERSION_CODE' versionName='$version_name'"
          "$apksigner" verify --verbose --print-certs "$apk"
          apk_size="$(stat -c '%s' "$apk")"
          apk_sha256="$(sha256sum "$apk" | cut -d' ' -f1)"
          cat > android-update.json <<JSON
          {
            "schemaVersion": 1,
            "tag": "$ANDROID_RELEASE_VERSION_NAME",
            "versionName": "$version_name",
            "versionCode": $ANDROID_RELEASE_VERSION_CODE,
            "apk": {
              "fileName": "BarkCloud.Android-$ANDROID_RELEASE_VERSION_NAME.apk",
              "size": $apk_size,
              "sha256": "$apk_sha256"
            }
          }
          JSON
          python3 -m json.tool android-update.json >/dev/null
          mkdir -p android-apk
          cp "$apk" android-apk/
          cp android-update.json android-apk/

      - name: "Артефакт: APK"
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: Android/BarkCloud.Android/android-apk/*

  ios:
    name: "iOS IPA"
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: "Архив Xcode"
        run: |
          xcodebuild \
            -project Ios/BarkCloud/BarkCloud.xcodeproj \
            -scheme BarkCloud \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BarkCloud.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      - name: "Упаковка IPA"
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/BarkCloud.xcarchive/Products/Applications/BarkCloud.app" Payload/
          zip -qry BarkCloud.iOS.ipa Payload

      - name: "Артефакт: IPA"
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: BarkCloud.iOS.ipa

  macos:
    name: "macOS DMG"
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: "Архив Xcode"
        run: |
          xcodebuild \
            -project Mac/BarkCloudDrive/BarkCloudDrive.xcodeproj \
            -scheme BarkCloudDrive \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/BarkCloudDrive.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      - name: "Сборка DMG"
        run: |
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "$RUNNER_TEMP/BarkCloudDrive.xcarchive/Products/Applications/BarkCloud Drive.app" "$RUNNER_TEMP/dmg/"
          hdiutil create -volname BarkCloud -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO BarkCloud.Mac.dmg

      - name: "Артефакт: DMG"
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: BarkCloud.Mac.dmg

  drive:
    name: "Windows Drive"
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Прод-раскладка: App и Engine кладутся в одну папку (side-by-side),
      # см. Drive/BarkCloud.Drive.App/EngineLauncher.cs
      - name: "Publish App и Engine"
        run: |
          dotnet publish Drive/BarkCloud.Drive.App/BarkCloud.Drive.App.csproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP/Drive"
          dotnet publish Drive/BarkCloud.Drive.Engine/BarkCloud.Drive.Engine.csproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP/Drive"

      - name: "Проверка сборки"
        run: |
          foreach ($exe in @("$env:RUNNER_TEMP/Drive/BarkCloud.Drive.App.exe", "$env:RUNNER_TEMP/Drive/BarkCloud.Drive.Engine.exe")) {
            if (-not (Test-Path -LiteralPath $exe)) { throw "Not published: $exe" }
          }

      - name: "Артефакт: ZIP"
        run: Compress-Archive -Path "$env:RUNNER_TEMP/Drive/*" -DestinationPath "$env:RUNNER_TEMP/BarkCloud.Drive-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: drive-zip
          path: ${{ runner.temp }}/BarkCloud.Drive-windows-x64.zip

  builder:
    name: "Windows Builder"
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: "Publish Builder (self-contained)"
        run: dotnet publish Tools/BarkCloud.Builder/BarkCloud.Builder.csproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP/Builder"

      - name: "Проверка сборки"
        run: |
          if (-not (Test-Path -LiteralPath "$env:RUNNER_TEMP/Builder/BarkCloud.Builder.exe")) {
            throw "BarkCloud.Builder.exe was not published."
          }

      - name: "Артефакт: ZIP"
        run: Compress-Archive -Path "$env:RUNNER_TEMP/Builder/*" -DestinationPath "$env:RUNNER_TEMP/BarkCloud.Builder-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: builder-zip
          path: ${{ runner.temp }}/BarkCloud.Builder-windows-x64.zip

  publish:
    name: "Публикация релиза"
    needs: [tests, version, android, ios, macos, drive, builder]
    if: ${{ !cancelled() && success('tests', 'android', 'ios', 'macos', 'drive', 'builder') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Скачивание артефактов"
        uses: actions/download-artifact@v7
        with:
          path: Artifacts

      - name: "Именование артефактов"
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mv Artifacts/android-apk/*.apk        "Artifacts/BarkCloud.Android-${VERSION}.apk"
          mv Artifacts/android-apk/android-update.json "Artifacts/android-update.json"
          mv Artifacts/ios-ipa/*.ipa            "Artifacts/BarkCloud.iOS-${VERSION}.ipa"
          mv Artifacts/macos-dmg/*.dmg          "Artifacts/BarkCloud.Mac-${VERSION}.dmg"
          mv Artifacts/drive-zip/*.zip          "Artifacts/BarkCloud.Drive-Windows-${VERSION}.zip"
          mv Artifacts/builder-zip/*.zip        "Artifacts/BarkCloud.Builder-Windows-${VERSION}.zip"
          find Artifacts -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          ls -lh Artifacts

      - name: "Создание релиза"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            "Artifacts/BarkCloud.Android-${VERSION}.apk" \
            "Artifacts/android-update.json" \
            "Artifacts/BarkCloud.iOS-${VERSION}.ipa" \
            "Artifacts/BarkCloud.Mac-${VERSION}.dmg" \
            "Artifacts/BarkCloud.Drive-Windows-${VERSION}.zip" \
            "Artifacts/BarkCloud.Builder-Windows-${VERSION}.zip" \
            --target "$SHA" \
            --title "BarkCloud $VERSION" \
            --generate-notes
