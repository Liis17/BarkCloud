<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarkCloud — Настройки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600;8..144,700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css"/>
  <script>
    /* Тема применяется до рендера, чтобы не было мигания. Источник — localStorage (bark_theme: light|dark|auto). */
    (function(){try{var t=localStorage.getItem('bark_theme')||'auto';var d=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <style>
    .settings-shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 32px;
      max-width: 1100px;
    }

    .set-nav {
      display: flex; flex-direction: column; gap: 4px;
      position: sticky; top: 0;
    }
    .set-nav-label {
      font-size: 11px;
      letter-spacing: .5px;
      color: var(--md-on-surface-variant);
      text-transform: uppercase;
      font-weight: 500;
      padding: 8px 16px 6px;
    }
    .set-nav button {
      display:flex; align-items:center; gap: 12px;
      padding: 0 16px;
      height: 48px;
      border-radius: var(--r-full);
      background: transparent;
      border: none;
      color: var(--md-on-surface-variant);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background var(--d-short), color var(--d-short);
    }
    .set-nav button:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); color: var(--md-on-surface); }
    .set-nav button.on {
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
    }

    /* M3 cards */
    .set-content { display: flex; flex-direction: column; gap: 16px; }
    .set-card {
      background: var(--md-surface-container-low);
      border-radius: var(--r-xl);
      overflow: hidden;
    }
    .set-card-head {
      padding: 24px 28px 16px;
    }
    .set-card-head h3 {
      font-size: 22px;
      line-height: 28px;
      font-weight: 500;
      color: var(--md-on-surface);
    }
    .set-card-head .sub {
      font-size: 14px;
      color: var(--md-on-surface-variant);
      margin-top: 4px;
    }
    .set-card-body { padding: 8px 28px 28px; display: flex; flex-direction: column; gap: 16px; }

    .field-row {
      display: grid;
      grid-template-columns: 220px 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 10px 0;
    }
    .field-row .lbl {
      font-size: 14px;
      color: var(--md-on-surface);
      font-weight: 500;
    }
    .field-row .lbl .help {
      display: block; font-size: 13px;
      color: var(--md-on-surface-variant);
      margin-top: 4px;
      font-weight: 400;
    }

    /* M3 text fields — filled style */
    .field-row input[type="text"], .field-row input[type="email"], .field-row select {
      width: 100%;
      background: var(--md-surface-container);
      border: none;
      border-bottom: 1px solid var(--md-outline);
      border-radius: var(--r-xs) var(--r-xs) 0 0;
      color: var(--md-on-surface);
      font-family: inherit;
      font-size: 15px;
      padding: 14px 16px;
      outline: none;
      transition: background var(--d-short), border-color var(--d-short);
    }
    .field-row input:hover { background: var(--md-surface-container-high); }
    .field-row input:focus {
      border-bottom: 2px solid var(--md-primary);
      padding-bottom: 13px;
    }
    .field-row .right-end { display: flex; justify-content: flex-end; }

    /* M3 switch */
    .toggle {
      width: 52px; height: 32px;
      border-radius: var(--r-full);
      background: var(--md-surface-container-highest);
      border: 2px solid var(--md-outline);
      position: relative;
      cursor: pointer;
      transition: background var(--d-med) var(--m-emph), border-color var(--d-med) var(--m-emph);
      flex-shrink: 0;
    }
    .toggle::after {
      content: '';
      position: absolute; top: 50%; left: 6px;
      transform: translateY(-50%);
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--md-outline);
      transition: transform var(--d-med) var(--m-emph), width var(--d-med) var(--m-emph), height var(--d-med) var(--m-emph), background var(--d-med);
    }
    .toggle.on {
      background: var(--md-primary);
      border-color: var(--md-primary);
    }
    .toggle.on::after {
      transform: translateY(-50%) translateX(20px);
      background: var(--md-on-primary);
      width: 24px; height: 24px;
      left: 2px;
    }

    /* Storage breakdown */
    .stor-bar {
      height: 16px; border-radius: var(--r-full);
      background: var(--md-surface-container-high);
      overflow: hidden;
      display: flex;
      gap: 2px;
    }
    .stor-bar > span { height: 100%; }
    .stor-legend { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 16px; }
    .stor-legend .item { display:flex; align-items:center; gap: 10px; font-size: 13px; }
    .stor-legend .sw { width: 12px; height: 12px; border-radius: var(--r-xs); }
    .stor-legend .k { color: var(--md-on-surface); }
    .stor-legend .v { color: var(--md-on-surface-variant); margin-left: 4px; }

    /* Sessions */
    .session-row {
      display: grid;
      grid-template-columns: 48px 1fr auto auto;
      gap: 16px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .session-row:last-child { border: none; padding-bottom: 0; }
    .session-row .si {
      width: 44px; height: 44px; border-radius: var(--r-md);
      background: var(--md-surface-container-high);
      display:flex; align-items:center; justify-content:center;
      color: var(--md-on-surface-variant);
    }
    .session-row.curr .si { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    .session-row .who { font-size: 14px; color: var(--md-on-surface); font-weight: 500; }
    .session-row .meta { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 4px; }
    .badge-curr {
      font-size: 12px;
      font-weight: 500;
      background: var(--md-success-container);
      color: var(--md-on-success-container);
      padding: 6px 12px; border-radius: var(--r-full);
    }
    .session-row button.disc {
      height: 36px;
      padding: 0 16px;
      background: transparent;
      border: 1px solid var(--md-outline);
      color: var(--md-on-surface);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--r-full);
      cursor: pointer;
      transition: background var(--d-short), color var(--d-short), border-color var(--d-short);
    }
    .session-row button.disc:hover { background: var(--md-error-container); border-color: var(--md-error-container); color: var(--md-on-error-container); }

    /* Danger zone */
    .danger {
      background: var(--md-error-container);
    }
    .danger h3 { color: var(--md-on-error-container); }
    .danger .sub { color: var(--md-on-error-container); opacity: .8; }
    .danger-row {
      display: flex; align-items: center; gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--md-on-error-container) 15%, transparent);
    }
    .danger-row:last-child { border: none; padding-bottom: 0; }
    .danger-row:first-child { padding-top: 0; }
    .danger-row .info .t { font-size: 14px; color: var(--md-on-error-container); font-weight: 500; }
    .danger-row .info .d { font-size: 13px; color: var(--md-on-error-container); opacity: .85; margin-top: 4px; }
    .danger-btn {
      margin-left: auto;
      height: 40px;
      background: var(--md-error);
      border: none;
      color: var(--md-on-error);
      padding: 0 24px;
      border-radius: var(--r-full);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: filter var(--d-short);
    }
    .danger-btn:hover { filter: brightness(1.1); }
    .danger-btn.outlined {
      background: transparent;
      border: 1px solid var(--md-on-error-container);
      color: var(--md-on-error-container);
    }

    /* Avatar */
    .avatar-big {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: var(--md-tertiary-container);
      color: var(--md-on-tertiary-container);
      display:flex; align-items:center; justify-content:center;
      font-weight: 500; font-size: 32px;
      flex-shrink: 0;
    }

    /* Theme picker */
    .theme-row { display: flex; gap: 12px; }
    .theme-swatch {
      width: 80px; height: 56px;
      border-radius: var(--r-md);
      cursor: pointer;
      position: relative;
      border: 2px solid var(--md-outline-variant);
      transition: border-color var(--d-short) var(--m-emph), transform var(--d-short);
      overflow: hidden;
    }
    .theme-swatch:hover { transform: translateY(-2px); }
    .theme-swatch.on { border-color: var(--md-primary); border-width: 3px; }
    .theme-swatch.dark { background: linear-gradient(135deg, #2a2a2f 0%, #15151a 100%); }
    .theme-swatch.dark::after { content:''; position: absolute; top: 10px; left: 10px; width: 22px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.3); }
    .theme-swatch.light { background: linear-gradient(135deg, #fafaf8 0%, #ebe7df 100%); }
    .theme-swatch.light::after { content:''; position: absolute; top: 10px; left: 10px; width: 22px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.2); }
    .theme-swatch.auto { background: linear-gradient(135deg, #2a2a2f 50%, #ebe7df 50%); }

    .accent-row { display: flex; gap: 10px; }
    .accent-sw {
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
      transition: transform var(--d-short);
    }
    .accent-sw:hover { transform: scale(1.08); }
    .accent-sw.on::after {
      content: '';
      position: absolute; inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--md-primary);
    }

    .pill-info {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px;
      border-radius: var(--r-full);
      font-size: 12px;
      font-weight: 500;
    }
    .pill-info.ok { background: var(--md-success-container); color: var(--md-on-success-container); }
    .pill-info.warn { background: var(--md-warning-container); color: var(--md-on-surface); }

    /* ─── Обслуживание (обновление бэкенда) ─── */
    .svc-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px; align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .svc-row:last-child { border: none; padding-bottom: 0; }
    .svc-row:first-child { padding-top: 0; }
    .svc-main { display:flex; align-items:center; gap:12px; min-width:0; }
    .svc-ic { width:40px; height:40px; border-radius:var(--r-md); background:var(--md-surface-container-high); color:var(--md-on-surface-variant); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .svc-info { min-width:0; }
    .svc-name { font-size:14px; font-weight:500; color:var(--md-on-surface); display:flex; align-items:center; gap:8px; }
    .svc-img { font-size:12px; color:var(--md-on-surface-variant); font-family:'Roboto Mono',monospace; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:340px; }
    .svc-actions { display:flex; gap:2px; align-items:center; }
    .svc-actions .iconb { width:40px; height:40px; border-radius:var(--r-full); background:transparent; border:none; color:var(--md-on-surface-variant); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background var(--d-short), color var(--d-short); }
    .svc-actions .iconb:hover:not(:disabled) { background:color-mix(in srgb, var(--md-on-surface) 8%, transparent); color:var(--md-on-surface); }
    .svc-actions .iconb:disabled { opacity:.35; cursor:default; }

    .spin { width:18px; height:18px; border-radius:50%; border:2px solid color-mix(in srgb, var(--md-primary) 30%, transparent); border-top-color:var(--md-primary); animation:sysspin .8s linear infinite; flex-shrink:0; }
    @keyframes sysspin { to { transform:rotate(360deg); } }

    .unlock-row { display:flex; gap:12px; align-items:center; max-width:440px; }
    .unlock-row input { flex:1; background:var(--md-surface-container); border:none; border-bottom:1px solid var(--md-outline); border-radius:var(--r-xs) var(--r-xs) 0 0; color:var(--md-on-surface); font-family:inherit; font-size:15px; padding:14px 16px; outline:none; transition:border-color var(--d-short); }
    .unlock-row input:focus { border-bottom:2px solid var(--md-primary); padding-bottom:13px; }
    .unlock-err { color:var(--md-error); font-size:13px; margin-top:10px; }

    .sys-scrim { position:fixed; inset:0; background:color-mix(in srgb, var(--md-scrim, #000) 40%, transparent); display:flex; align-items:center; justify-content:center; z-index:1000; padding:24px; }
    .sys-dialog { background:var(--md-surface-container-high); border-radius:var(--r-xl); padding:28px; max-width:460px; width:100%; }
    .sys-dialog h3 { font-size:20px; font-weight:500; color:var(--md-on-surface); }
    .sys-dialog .sub { font-size:13px; color:var(--md-on-surface-variant); margin-top:4px; }
    .prog-bar { height:6px; border-radius:var(--r-full); background:var(--md-surface-container-highest); overflow:hidden; margin:18px 0; }
    .prog-bar > span { display:block; height:100%; background:var(--md-primary); transition:width var(--d-med) var(--m-emph); }
    .prog-list { display:flex; flex-direction:column; gap:10px; max-height:260px; overflow:auto; }
    .prog-item { display:flex; align-items:center; gap:10px; font-size:14px; color:var(--md-on-surface-variant); }
    .prog-item.current, .prog-item.done { color:var(--md-on-surface); }
    .prog-item .pi { width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .prog-item.done .pi { color:var(--md-success); }
    .prog-item.error .pi { color:var(--md-error); }
    .dlg-actions { display:flex; justify-content:flex-end; margin-top:20px; }

    .upd-overlay { position:fixed; inset:0; background:var(--md-surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:1100; text-align:center; padding:24px; }
    .upd-overlay .big-spin { width:56px; height:56px; border-radius:50%; border:4px solid var(--md-primary-container); border-top-color:var(--md-primary); animation:sysspin 1s linear infinite; }
    .upd-overlay h2 { font-size:24px; font-weight:500; color:var(--md-on-surface); }
    .upd-overlay p { color:var(--md-on-surface-variant); max-width:420px; }
    .upd-overlay .timer { display:inline-flex; align-items:center; gap:8px; background:var(--md-success-container); color:var(--md-on-success-container); padding:8px 16px; border-radius:var(--r-full); font-size:14px; font-weight:500; }

    .sys-toast { position:fixed; left:50%; bottom:32px; transform:translateX(-50%); display:flex; align-items:center; gap:10px; padding:14px 20px; border-radius:var(--r-md); font-size:14px; font-weight:500; z-index:1200; box-shadow:0 4px 16px rgba(0,0,0,.2); max-width:520px; }
    .sys-toast.ok { background:var(--md-success-container); color:var(--md-on-success-container); }
    .sys-toast.err { background:var(--md-error-container); color:var(--md-on-error-container); }

    .sys-banner { display:flex; align-items:flex-start; gap:10px; padding:12px 16px; border-radius:var(--r-md); font-size:13px; margin-bottom:16px; }
    .sys-banner.err { background:var(--md-error-container); color:var(--md-on-error-container); }
    .sys-section-label { font-size:11px; letter-spacing:.5px; text-transform:uppercase; font-weight:600; color:var(--md-on-surface-variant); margin:4px 0 8px; }
    .sys-note { font-size:13px; color:var(--md-on-surface-variant); margin:6px 0 12px; line-height:1.5; }

    /* ─── Доп. элементы рабочих настроек ─── */
    .avatar-big { overflow: hidden; }
    .avatar-big img { width:100%; height:100%; object-fit:cover; display:block; }

    .field-row textarea, .form-stack textarea {
      width:100%; background:var(--md-surface-container); border:none; border-bottom:1px solid var(--md-outline);
      border-radius:var(--r-xs) var(--r-xs) 0 0; color:var(--md-on-surface); font-family:inherit; font-size:15px;
      padding:14px 16px; outline:none; resize:vertical; min-height:84px; transition:border-color var(--d-short);
    }
    .field-row textarea:focus, .form-stack textarea:focus { border-bottom:2px solid var(--md-primary); padding-bottom:13px; }
    .char-counter { font-size:12px; color:var(--md-on-surface-variant); text-align:right; margin-top:4px; }

    .pill-info.err { background:var(--md-error-container); color:var(--md-on-error-container); }

    .form-stack { display:flex; flex-direction:column; gap:14px; max-width:460px; }
    .form-stack label { font-size:13px; color:var(--md-on-surface-variant); margin-bottom:-8px; }
    .form-stack input {
      background:var(--md-surface-container); border:none; border-bottom:1px solid var(--md-outline);
      border-radius:var(--r-xs) var(--r-xs) 0 0; color:var(--md-on-surface); font-family:inherit; font-size:15px;
      padding:14px 16px; outline:none; transition:border-color var(--d-short);
    }
    .form-stack input:focus { border-bottom:2px solid var(--md-primary); padding-bottom:13px; }

    .uname-wrap { display:flex; flex-direction:column; gap:8px; }
    .uname-wrap .row { display:flex; gap:10px; align-items:center; }
    .uname-wrap input { flex:1; }

    .qr-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; margin:18px 0; }
    .qr-wrap img { width:200px; height:200px; border-radius:var(--r-md); background:#fff; padding:8px; }
    .qr-code { font-family:'Roboto Mono',monospace; font-size:13px; color:var(--md-on-surface-variant); word-break:break-all; text-align:center; max-width:320px; }
    .dlg-input { width:100%; background:var(--md-surface-container); border:none; border-bottom:1px solid var(--md-outline); border-radius:var(--r-xs) var(--r-xs) 0 0; color:var(--md-on-surface); font-family:inherit; font-size:15px; padding:14px 16px; outline:none; margin-top:8px; }
    .dlg-input:focus { border-bottom:2px solid var(--md-primary); padding-bottom:13px; }
    .dlg-actions.two { justify-content:space-between; }
  </style>
</head>
<body>
<div id="root"></div>

<!--
  SERVER PAYLOAD (Settings.html) — формируется в PageDataBuilder.BuildSettingsJsonAsync:
  {
    "profile":  { initials, firstName, lastName, name, email(ro), username, bio, avatarUrl, avatarPreviewUrl },
    "security": { twoFa, authenticator, emailOtp },
    "privacy":  { profileVisibility, emailVisibility, lastSeenVisibility, searchableByUsername },  // 0=Всем,1=Контактам,2=Никому
    "storage":  { used, total, unit, percent, breakdown:[{k,v,color,pct}], freeLabel },
    "sessions": [{ deviceId, device, os, location, when, current? }],
    "sessionsHeader": "...",
    "admin":    { enabled, unlocked },
    "system":   { version, edition }
  }
  Действия идут через REST /api/settings/* (см. SettingsEndpoints.cs).
-->
<script type="application/json" id="server-data">
{{{ page_data_json }}}
</script>

<script type="text/babel">
const { AppShell, Icon } = window;

function loadServerData() {
  try {
    const raw = document.getElementById('server-data')?.textContent?.trim();
    if (!raw || raw.startsWith('{{')) return null;
    return JSON.parse(raw);
  } catch (e) { console.warn('server-data parse failed', e); return null; }
}
const SERVER_DATA = loadServerData();

// ─── Данные с сервера (схема — в комментарии выше) ───
const PROFILE = SERVER_DATA?.profile ?? {
  initials: '?', firstName: '', lastName: '', name: '', email: '', username: '', bio: '', avatarUrl: '', avatarPreviewUrl: '',
};
const SECURITY = SERVER_DATA?.security ?? { twoFa: false, authenticator: false, emailOtp: false };
const PRIVACY = SERVER_DATA?.privacy ?? { profileVisibility: 0, emailVisibility: 0, lastSeenVisibility: 0, searchableByUsername: true };
const STORAGE = SERVER_DATA?.storage ?? { used: '0', total: '0', unit: 'ГБ', percent: 0, breakdown: [], freeLabel: '0 Б' };
const SESSIONS_INIT = SERVER_DATA?.sessions ?? [];

// ─── HTTP к /api/settings/* ───
async function apiJson(method, path, body) {
  const r = await fetch(path, {
    method, credentials: 'same-origin',
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null; try { data = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, data };
}
const apiGet = (p) => apiJson('GET', p);
const apiPost = (p, b) => apiJson('POST', p, b);
const errMsg = (res, fallback) => (res.data && res.data.message) || fallback || 'Ошибка';

// ─── Тема (light/dark/auto) — хранится локально ───
function applyTheme(t) {
  const dark = t === 'dark' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
}
function currentTheme() {
  try { return localStorage.getItem('bark_theme') || 'auto'; } catch (e) { return 'auto'; }
}

const SYSTEM = SERVER_DATA?.system ?? { version: 'v1.0.0', edition: 'self-host' };
const SVC_LABELS = {

const NAV = [
  {key:'account', label:'Аккаунт', icon:'user'},
  {key:'security', label:'Безопасность', icon:'lock'},
  {key:'privacy', label:'Приватность', icon:'eye'},

  {key:'sessions', label:'Устройства и сессии', icon:'device'},

  ...(ADMIN.enabled ? [{key:'system', label:'Обслуживание', icon:'server'}] : []),
];
const NAV_KEYS = NAV.map(n => n.key);

function Toggle({ on, onChange, disabled }) {

function Field({ label, help, children, end }) {

// ─────────── Обслуживание: обновление бэкенда ───────────

async function sysPost(path, body) {
  const r = await fetch(path, {
    method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null; try { data = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, data };
}

function SvcStatus({ state }) {
  const running = state === 'running';
  const label = running ? 'Запущен'
    : state === 'not_found' ? 'Не найден'
    : (state === 'exited' || state === 'dead') ? 'Остановлен'
    : state === 'restarting' ? 'Перезапуск'
    : (state || '—');
  return (
    <span className={"pill-info " + (running ? 'ok' : 'warn')}>
      {running ? <Icon.check size={12}/> : <Icon.x size={12}/>} {label}
    </span>
  );
}

function SystemSection() {
  const [unlocked, setUnlocked] = React.useState(ADMIN.unlocked);
  const [password, setPassword] = React.useState('');
  const [unlockErr, setUnlockErr] = React.useState('');
  const [unlocking, setUnlocking] = React.useState(false);
  const [services, setServices] = React.useState(null); // null = идёт загрузка
  const [dockerErr, setDockerErr] = React.useState(null);
  const [busy, setBusy] = React.useState({});
  const [toast, setToast] = React.useState(null);
  const [progress, setProgress] = React.useState(null);
  const [overlay, setOverlay] = React.useState(null);

  const flash = (kind, msg) => { setToast({ kind, msg }); setTimeout(() => setToast(null), 4200); };

  const loadServices = React.useCallback(async () => {
    try {
      const r = await fetch('/api/system/services', { credentials: 'same-origin', cache: 'no-cache' });
      if (r.ok) {
        const snap = await r.json();
        setServices(snap.services || []);
        setDockerErr(snap.dockerOk ? null : (snap.error || 'Docker недоступен'));
      } else if (r.status === 403) {
        setUnlocked(false);
      } else {
        setServices([]); setDockerErr(`Сервер ответил ${r.status}`);
      }
    } catch (e) { setServices([]); setDockerErr(String(e)); }
  }, []);

  React.useEffect(() => { if (unlocked) { setServices(null); loadServices(); } }, [unlocked, loadServices]);

  async function doUnlock() {
    if (!password) return;
    setUnlocking(true); setUnlockErr('');
    const { ok, data } = await sysPost('/api/system/unlock', { password });
    setUnlocking(false);
    if (ok) { setPassword(''); setUnlocked(true); }
    else setUnlockErr(data?.message || 'Не удалось разблокировать');
  }
  async function doLock() { await sysPost('/api/system/lock'); setUnlocked(false); setServices(null); }

  async function svcAction(svc, kind) {
    setBusy(b => ({ ...b, [svc]: true }));
    const { ok, data } = await sysPost(`/api/system/services/${svc}/${kind}`);
    flash(ok ? 'ok' : 'err', data?.message || (ok ? 'Готово' : 'Ошибка'));
    setBusy(b => ({ ...b, [svc]: false }));
    setTimeout(loadServices, 1500);
  }

  async function updateAll() {
    const targets = (services || []).filter(s => !s.isWeb).map(s => s.service);
    if (!targets.length) return;
    if (!window.confirm('Обновить все сервисы приложения (кроме веб-клиента)?')) return;
    setProgress({ items: targets.map(s => ({ svc: s, state: 'pending' })), done: 0, total: targets.length, finished: false });
    for (const svc of targets) {
      setProgress(p => ({ ...p, items: p.items.map(it => it.svc === svc ? { ...it, state: 'current' } : it) }));
      const { ok } = await sysPost(`/api/system/services/${svc}/update`);
      setProgress(p => ({ ...p, done: p.done + 1, items: p.items.map(it => it.svc === svc ? { ...it, state: ok ? 'done' : 'error' } : it) }));
    }
    setProgress(p => ({ ...p, finished: true }));
    loadServices();
  }

  function webSelf(kind) {
    const title = kind === 'update' ? 'Обновление веб-клиента' : 'Перезапуск веб-клиента';
    if (!window.confirm(`${title}? Страница ненадолго станет недоступна и перезагрузится автоматически.`)) return;
    const path = kind === 'update' ? '/api/system/web/update-self' : '/api/system/web/restart-self';
    sysPost(path).then(({ ok, data }) => ok ? startOverlay(title) : flash('err', data?.message || 'Ошибка'));
  }

  function startOverlay(title) {
    setOverlay({ title, seconds: 0 });
    let success = 0;
    const t0 = Date.now();
    const tick = setInterval(() => setOverlay(o => o ? { ...o, seconds: Math.floor((Date.now() - t0) / 1000) } : o), 1000);
    const poll = setInterval(async () => {
      try {
        const r = await fetch('/healthz', { cache: 'no-cache' });
        if (r.ok) { if (++success >= 2) { clearInterval(poll); clearInterval(tick); setTimeout(() => window.location.reload(), 1500); } }
        else success = 0;
      } catch (e) { success = 0; }
    }, 3000);
  }

  let body;
  if (!ADMIN.enabled) {
    body = <div style={{ color: 'var(--md-on-surface-variant)', fontSize: 14 }}>
      Админ-доступ не настроен. Задайте <code>WEB_ADMIN_PASSWORD</code> в окружении веб-контейнера и перезапустите его.
    </div>;
  } else if (!unlocked) {
    body = <div>
      <div style={{ color: 'var(--md-on-surface-variant)', fontSize: 14, marginBottom: 16 }}>
        Введите админ-пароль, чтобы управлять обновлением бэкенда.
      </div>
      <div className="unlock-row">
        <input type="password" placeholder="Админ-пароль" value={password}
          onChange={e => setPassword(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') doUnlock(); }} autoFocus/>
        <button className="btn primary" onClick={doUnlock} disabled={unlocking || !password}>
          {unlocking ? <span className="spin"/> : <Icon.lock size={16}/>} Разблокировать
        </button>
      </div>
      {unlockErr && <div className="unlock-err">{unlockErr}</div>}
    </div>;
  } else if (services === null) {
    body = <div style={{ display: 'flex', alignItems: 'center', gap: 12, color: 'var(--md-on-surface-variant)', fontSize: 14 }}>
      <span className="spin"/> Загрузка состояния сервисов…
    </div>;
  } else {
    const micros = services.filter(s => !s.isWeb);
    const web = services.find(s => s.isWeb);

    const renderRow = (s, actions) => (
      <div key={s.service} className="svc-row">
        <div className="svc-main">
          <div className="svc-ic"><Icon.server size={20}/></div>
          <div className="svc-info">
            <div className="svc-name">{SVC_LABELS[s.service] || s.service} <SvcStatus state={s.state}/></div>
            {s.image && <div className="svc-img" title={s.image}>{s.image}</div>}
          </div>
        </div>
        <div className="svc-actions">
          {busy[s.service] ? <span className="spin" style={{ margin: '0 11px' }}/> : actions(s.state === 'running')}
        </div>
      </div>
    );

    body = <>
      {dockerErr && (
        <div className="sys-banner err">
          <Icon.x size={18}/>
          <span>Docker недоступен: {dockerErr}</span>
        </div>
      )}

      {/* Микросервисы приложения */}
      <div className="sys-section-label">Микросервисы</div>
      <div className="svc-list">
        {micros.map(s => renderRow(s, (running) => <>
          <button className="iconb" title="Обновить" onClick={() => svcAction(s.service, 'update')}><Icon.download size={20}/></button>
          <button className="iconb" title="Перезапустить" onClick={() => svcAction(s.service, 'restart')}><Icon.refresh size={20}/></button>
          {running
            ? <button className="iconb" title="Остановить" onClick={() => svcAction(s.service, 'stop')}><Icon.power size={20}/></button>
            : <button className="iconb" title="Запустить" onClick={() => svcAction(s.service, 'start')}><Icon.play size={20}/></button>}
        </>))}
      </div>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center', marginTop: 6 }}>
        <button className="btn primary" onClick={updateAll} disabled={!micros.length}><Icon.download size={16}/> Обновить микросервисы</button>
        <button className="btn" onClick={() => { setServices(null); loadServices(); }}><Icon.refresh size={16}/> Обновить статус</button>
      </div>

      <hr className="divider"/>

      {/* Веб-клиент — отдельно: его обновление перезапускает страницу */}
      <div className="sys-section-label">Веб-клиент</div>
      {web && <div className="svc-list">{renderRow(web, () => <span style={{ fontSize: 12, color: 'var(--md-on-surface-variant)' }}>ниже ↓</span>)}</div>}
      <div className="sys-note">
        Перезапуск веб-клиента работает: страница ненадолго станет недоступна и перезагрузится сама.
        Обновление веб-клиента из панели <b>временно недоступно</b> на Windows-хосте — обновите образ на хосте вручную
        (<code>docker compose pull web</code>, затем <code>up -d web</code>).
      </div>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
        <button className="btn primary" disabled title="Временно недоступно на Windows-хосте"><Icon.download size={16}/> Обновить веб-клиент</button>
        <button className="btn" onClick={() => webSelf('restart')}><Icon.refresh size={16}/> Перезапустить веб-клиент</button>
        <button className="btn text" onClick={doLock} style={{ marginLeft: 'auto' }}><Icon.lock size={16}/> Заблокировать</button>
      </div>
    </>;
  }

  return (
    <>
      <div className="set-card" id="sec-system">
        <div className="set-card-head">
          <h3>Обслуживание</h3>
          <div className="sub" style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
            <span>Обновление и перезапуск сервисов бэкенда</span>
            <span className="pill-info ok">{SYSTEM.version} · {SYSTEM.edition}</span>
          </div>
        </div>
        <div className="set-card-body">{body}</div>
      </div>

      {progress && (
        <div className="sys-scrim">
          <div className="sys-dialog">
            <h3>Обновление сервисов</h3>
            <div className="sub">{progress.finished ? 'Готово' : 'Выполняется последовательно…'}</div>
            <div className="prog-bar"><span style={{ width: `${Math.round(progress.done / progress.total * 100)}%` }}/></div>
            <div className="prog-list">
              {progress.items.map(it => (
                <div key={it.svc} className={"prog-item " + it.state}>
                  <span className="pi">
                    {it.state === 'current' ? <span className="spin"/>
                      : it.state === 'done' ? <Icon.check size={18}/>
                      : it.state === 'error' ? <Icon.x size={18}/>
                      : <Icon.clock size={16}/>}
                  </span>
                  <span>{SVC_LABELS[it.svc] || it.svc}</span>
                </div>
              ))}
            </div>
            {progress.finished && <div className="dlg-actions"><button className="btn" onClick={() => setProgress(null)}>Закрыть</button></div>}
          </div>
        </div>
      )}

      {overlay && (
        <div className="upd-overlay">
          <div className="big-spin"/>
          <h2>{overlay.title}</h2>
          <p>Загрузка нового образа и пересоздание контейнера. Проверяем доступность каждые 3 секунды — страница перезагрузится сама.</p>
          <div className="timer"><Icon.clock size={16}/> {overlay.seconds} сек</div>
        </div>
      )}

      {toast && (
        <div className={"sys-toast " + toast.kind}>
          {toast.kind === 'ok' ? <Icon.check size={18}/> : <Icon.x size={18}/>}
          <span>{toast.msg}</span>
        </div>
      )}
    </>
  );
}

// ─────────── Общие мелкие компоненты ───────────

function pluralRu(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function Toast({ toast }) {
  if (!toast) return null;
  return (
    <div className={"sys-toast " + toast.kind}>
      {toast.kind === 'ok' ? <Icon.check size={18}/> : <Icon.x size={18}/>}
      <span>{toast.msg}</span>
    </div>
  );
}

function SaveBtn({ saving, onClick, disabled, children, icon }) {
  return (
    <button className="btn primary" onClick={onClick} disabled={saving || disabled}>
      {saving ? <span className="spin"/> : (icon || null)} {children}
    </button>
  );
}

// ─────────── Аккаунт ───────────

function AccountTab({ flash }) {
  const [firstName, setFirstName] = React.useState(PROFILE.firstName || '');
  const [lastName, setLastName] = React.useState(PROFILE.lastName || '');
  const [savingName, setSavingName] = React.useState(false);

  const [bio, setBio] = React.useState(PROFILE.bio || '');
  const [savingBio, setSavingBio] = React.useState(false);

  const [username, setUsername] = React.useState(PROFILE.username || '');
  const [baseUsername, setBaseUsername] = React.useState(PROFILE.username || '');
  const [uStatus, setUStatus] = React.useState('idle'); // idle|checking|ok|taken|invalid
  const [savingUser, setSavingUser] = React.useState(false);

  const [avatarUrl, setAvatarUrl] = React.useState(PROFILE.avatarPreviewUrl || PROFILE.avatarUrl || '');
  const [avatarBusy, setAvatarBusy] = React.useState(false);
  const fileRef = React.useRef(null);

  const [delOpen, setDelOpen] = React.useState(false);
  const [delText, setDelText] = React.useState('');
  const [deleting, setDeleting] = React.useState(false);

  React.useEffect(() => {
    const u = username.trim();
    if (u === baseUsername) { setUStatus('idle'); return; }
    if (u.length < 3) { setUStatus('invalid'); return; }
    setUStatus('checking');
    const id = setTimeout(async () => {
      const res = await apiGet('/api/settings/profile/username-available?u=' + encodeURIComponent(u));
      if (res.ok && res.data) setUStatus(res.data.available ? 'ok' : 'taken');
      else setUStatus('idle');
    }, 400);
    return () => clearTimeout(id);
  }, [username, baseUsername]);

  async function saveName() {
    setSavingName(true);
    const res = await apiPost('/api/settings/profile/name', { firstName: firstName.trim(), lastName: lastName.trim() });
    setSavingName(false);
    flash(res.ok ? 'ok' : 'err', res.ok ? 'Имя сохранено' : errMsg(res));
  }
  async function saveBio() {
    setSavingBio(true);
    const res = await apiPost('/api/settings/profile/bio', { bio });
    setSavingBio(false);
    flash(res.ok ? 'ok' : 'err', res.ok ? 'Описание сохранено' : errMsg(res));
  }
  async function saveUsername() {
    setSavingUser(true);
    const res = await apiPost('/api/settings/profile/username', { username: username.trim() });
    setSavingUser(false);
    if (res.ok) { setBaseUsername(username.trim()); setUStatus('idle'); flash('ok', 'Имя пользователя изменено'); }
    else flash('err', errMsg(res));
  }
  async function onPickFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setAvatarBusy(true);
    const fd = new FormData(); fd.append('file', file);
    const r = await fetch('/api/settings/avatar', { method: 'POST', credentials: 'same-origin', body: fd });
    let data = null; try { data = await r.json(); } catch (e2) {}
    setAvatarBusy(false);
    if (r.ok && data) { setAvatarUrl(data.avatarPreviewUrl || data.avatarUrl || ''); flash('ok', 'Аватар обновлён'); }
    else flash('err', (data && data.message) || 'Не удалось загрузить аватар');
  }
  async function removeAvatar() {
    setAvatarBusy(true);
    const res = await apiPost('/api/settings/avatar/remove');
    setAvatarBusy(false);
    if (res.ok) { setAvatarUrl(''); flash('ok', 'Аватар удалён'); }
    else flash('err', errMsg(res));
  }
  async function doDelete() {
    setDeleting(true);
    const res = await apiPost('/api/settings/account/delete');
    if (res.ok) { window.location = '/login'; return; }
    setDeleting(false);
    flash('err', errMsg(res));
  }

  const uPill = uStatus === 'checking' ? <span className="pill-info warn">Проверка…</span>
    : uStatus === 'ok' ? <span className="pill-info ok"><Icon.check size={12}/> Свободно</span>
    : uStatus === 'taken' ? <span className="pill-info err"><Icon.x size={12}/> Занято</span>
    : uStatus === 'invalid' ? <span className="pill-info err">Минимум 3 символа</span>
    : null;

  return (
    <>
      <div className="set-card">
        <div className="set-card-head"><h3>Профиль</h3><div className="sub">Имя, фото и описание, видимые другим</div></div>
        <div className="set-card-body">
          <div style={{display:'flex', gap:20, alignItems:'center'}}>
            <div className="avatar-big">{avatarUrl ? <img src={avatarUrl} alt=""/> : PROFILE.initials}</div>
            <div style={{display:'flex', flexDirection:'column', gap:8, flex:1}}>
              <div style={{fontSize:14, color:'var(--md-on-surface-variant)'}}>Изменить аватар. Рекомендуется не меньше 256×256.</div>
              <div style={{display:'flex', gap:8, alignItems:'center'}}>
                <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={onPickFile}/>
                <button className="btn" onClick={()=>fileRef.current && fileRef.current.click()} disabled={avatarBusy}>
                  {avatarBusy ? <span className="spin"/> : <Icon.upload size={16}/>} Загрузить
                </button>
                {avatarUrl && <button className="btn text" onClick={removeAvatar} disabled={avatarBusy}>Удалить</button>}
              </div>
            </div>
          </div>
          <hr className="divider"/>
          <div className="form-stack">
            <label>Имя</label>
            <input type="text" value={firstName} onChange={e=>setFirstName(e.target.value)} placeholder="Имя"/>
            <label>Фамилия</label>
            <input type="text" value={lastName} onChange={e=>setLastName(e.target.value)} placeholder="Фамилия"/>
            <div><SaveBtn saving={savingName} onClick={saveName} icon={<Icon.check size={16}/>}>Сохранить имя</SaveBtn></div>
          </div>
          <hr className="divider"/>
          <Field label="Email" help="Используется для входа, изменить нельзя">
            <input type="email" value={PROFILE.email || ''} disabled placeholder="—" style={{opacity:.6, cursor:'not-allowed'}}/>
          </Field>
        </div>
      </div>

      <div className="set-card">
        <div className="set-card-head"><h3>Имя пользователя</h3><div className="sub">Уникальный @username для поиска и ссылок</div></div>
        <div className="set-card-body">
          <div className="uname-wrap">
            <div className="row">
              <input type="text" value={username} onChange={e=>setUsername(e.target.value.replace(/\s/g,''))} placeholder="username"/>
              {uPill}
            </div>
            <div>
              <SaveBtn saving={savingUser} onClick={saveUsername} disabled={uStatus !== 'ok'} icon={<Icon.check size={16}/>}>Сменить имя пользователя</SaveBtn>
            </div>
          </div>
        </div>
      </div>

      <div className="set-card">
        <div className="set-card-head"><h3>О себе</h3><div className="sub">Короткое описание профиля (до 200 символов)</div></div>
        <div className="set-card-body">
          <textarea value={bio} maxLength={200} onChange={e=>setBio(e.target.value)} placeholder="Расскажите о себе…"/>
          <div className="char-counter">{bio.length}/200</div>
          <div><SaveBtn saving={savingBio} onClick={saveBio} icon={<Icon.check size={16}/>}>Сохранить описание</SaveBtn></div>
        </div>
      </div>

      <div className="set-card danger">
        <div className="set-card-head"><h3>Опасная зона</h3><div className="sub">Действие нельзя отменить</div></div>
        <div className="set-card-body">
          <div className="danger-row">
            <div className="info">
              <div className="t">Удалить аккаунт безвозвратно</div>
              <div className="d">Профиль, устройства, файлы и история удаляются. Восстановление невозможно.</div>
            </div>
            <button className="danger-btn" onClick={()=>{ setDelText(''); setDelOpen(true); }}>Удалить</button>
          </div>
        </div>
      </div>

      {delOpen && (
        <div className="sys-scrim" onClick={()=>!deleting && setDelOpen(false)}>
          <div className="sys-dialog" onClick={e=>e.stopPropagation()}>
            <h3>Удалить аккаунт?</h3>
            <div className="sub">Это необратимо. Введите <b>УДАЛИТЬ</b> для подтверждения.</div>
            <input className="dlg-input" value={delText} onChange={e=>setDelText(e.target.value)} placeholder="УДАЛИТЬ" autoFocus/>
            <div className="dlg-actions two">
              <button className="btn text" onClick={()=>setDelOpen(false)} disabled={deleting}>Отмена</button>
              <button className="danger-btn" onClick={doDelete} disabled={deleting || delText.trim() !== 'УДАЛИТЬ'}>
                {deleting ? <span className="spin"/> : null} Удалить навсегда
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ─────────── Безопасность ───────────

function SecurityTab({ flash }) {
  const [auth2fa, setAuth2fa] = React.useState(SECURITY.authenticator);
  const [email2fa, setEmail2fa] = React.useState(SECURITY.emailOtp);

  const [pwdOpen, setPwdOpen] = React.useState(false);
  const [oldPwd, setOldPwd] = React.useState('');
  const [newPwd, setNewPwd] = React.useState('');
  const [confirmPwd, setConfirmPwd] = React.useState('');
  const [savingPwd, setSavingPwd] = React.useState(false);

  const [enableDlg, setEnableDlg] = React.useState(null); // { otpType, qr, code }
  const [enableCode, setEnableCode] = React.useState('');
  const [enableBusy, setEnableBusy] = React.useState(false);

  const [disableDlg, setDisableDlg] = React.useState(null); // { otpType }
  const [disableCode, setDisableCode] = React.useState('');
  const [disableBusy, setDisableBusy] = React.useState(false);

  async function refresh2fa() {
    const res = await apiGet('/api/settings/security/2fa');
    if (res.ok && res.data) { setAuth2fa(res.data.authenticator); setEmail2fa(res.data.email); }
  }
  async function savePassword() {
    if (newPwd.length < 6) { flash('err', 'Пароль слишком короткий (мин. 6)'); return; }
    if (newPwd !== confirmPwd) { flash('err', 'Пароли не совпадают'); return; }
    setSavingPwd(true);
    const res = await apiPost('/api/settings/security/password', { oldPassword: oldPwd, newPassword: newPwd });
    setSavingPwd(false);
    if (res.ok) { setPwdOpen(false); setOldPwd(''); setNewPwd(''); setConfirmPwd(''); flash('ok', 'Пароль изменён'); }
    else flash('err', errMsg(res));
  }
  async function startEnable(otpType) {
    setEnableBusy(true);
    const res = await apiPost('/api/settings/security/2fa/enable', { otpType });
    setEnableBusy(false);
    if (res.ok && res.data) { setEnableCode(''); setEnableDlg({ otpType, qr: res.data.qr, code: res.data.code }); }
    else flash('err', errMsg(res));
  }
  async function confirmEnable() {
    setEnableBusy(true);
    const res = await apiPost('/api/settings/security/2fa/confirm', { otpCode: enableCode.trim() });
    setEnableBusy(false);
    if (res.ok) { setEnableDlg(null); flash('ok', 'Двухфакторная включена'); refresh2fa(); }
    else flash('err', errMsg(res));
  }
  async function startDisable(otpType) {
    if (otpType === 2) {
      const res = await apiPost('/api/settings/security/2fa/disable', { otpType, otpCode: '' });
      if (res.ok) { flash('ok', 'Email-2FA отключена'); refresh2fa(); }
      else flash('err', errMsg(res));
      return;
    }
    setDisableCode(''); setDisableDlg({ otpType });
  }
  async function confirmDisable() {
    setDisableBusy(true);
    const res = await apiPost('/api/settings/security/2fa/disable', { otpType: disableDlg.otpType, otpCode: disableCode.trim() });
    setDisableBusy(false);
    if (res.ok) { setDisableDlg(null); flash('ok', 'Двухфакторная отключена'); refresh2fa(); }
    else flash('err', errMsg(res));
  }

  return (
    <>
      <div className="set-card">
        <div className="set-card-head"><h3>Пароль</h3><div className="sub">Смена пароля для входа</div></div>
        <div className="set-card-body">
          {!pwdOpen
            ? <div><button className="btn" onClick={()=>setPwdOpen(true)}><Icon.key size={16}/> Сменить пароль</button></div>
            : <div className="form-stack">
                <label>Текущий пароль</label>
                <input type="password" value={oldPwd} onChange={e=>setOldPwd(e.target.value)} autoFocus/>
                <label>Новый пароль</label>
                <input type="password" value={newPwd} onChange={e=>setNewPwd(e.target.value)}/>
                <label>Повторите новый пароль</label>
                <input type="password" value={confirmPwd} onChange={e=>setConfirmPwd(e.target.value)}/>
                <div style={{display:'flex', gap:8}}>
                  <SaveBtn saving={savingPwd} onClick={savePassword} icon={<Icon.check size={16}/>}>Сохранить</SaveBtn>
                  <button className="btn text" onClick={()=>{setPwdOpen(false); setOldPwd(''); setNewPwd(''); setConfirmPwd('');}} disabled={savingPwd}>Отмена</button>
                </div>
              </div>}
        </div>
      </div>

      <div className="set-card">
        <div className="set-card-head"><h3>Двухфакторная аутентификация</h3><div className="sub">Дополнительный код при входе</div></div>
        <div className="set-card-body">
          <Field label="Приложение-аутентификатор" help="Google Authenticator · TOTP"
            end={<Toggle on={auth2fa} onChange={(v)=> v ? startEnable(1) : startDisable(1)} disabled={enableBusy}/>}>
            {auth2fa && <span className="pill-info ok"><Icon.check size={12}/> Включено</span>}
          </Field>
          <Field label="Коды по email" help="Одноразовый код на почту"
            end={<Toggle on={email2fa} onChange={(v)=> v ? startEnable(2) : startDisable(2)} disabled={enableBusy}/>}>
            {email2fa && <span className="pill-info ok"><Icon.check size={12}/> Включено</span>}
          </Field>
        </div>
      </div>

      {enableDlg && (
        <div className="sys-scrim" onClick={()=>!enableBusy && setEnableDlg(null)}>
          <div className="sys-dialog" onClick={e=>e.stopPropagation()}>
            <h3>Включение 2FA</h3>
            <div className="sub">{enableDlg.qr ? 'Отсканируйте QR в приложении-аутентификаторе и введите код из него.' : 'Введите код, отправленный на вашу почту.'}</div>
            <div className="qr-wrap">
              {enableDlg.qr && <img src={"data:image/png;base64," + enableDlg.qr} alt="QR"/>}
              {enableDlg.code && <div className="qr-code">Ключ: {enableDlg.code}</div>}
            </div>
            <input className="dlg-input" value={enableCode} onChange={e=>setEnableCode(e.target.value)} placeholder="Код подтверждения" autoFocus
              onKeyDown={e=>{ if(e.key==='Enter') confirmEnable(); }}/>
            <div className="dlg-actions two">
              <button className="btn text" onClick={()=>setEnableDlg(null)} disabled={enableBusy}>Отмена</button>
              <button className="btn primary" onClick={confirmEnable} disabled={enableBusy || !enableCode.trim()}>
                {enableBusy ? <span className="spin"/> : null} Подтвердить
              </button>
            </div>
          </div>
        </div>
      )}

      {disableDlg && (
        <div className="sys-scrim" onClick={()=>!disableBusy && setDisableDlg(null)}>
          <div className="sys-dialog" onClick={e=>e.stopPropagation()}>
            <h3>Отключить 2FA</h3>
            <div className="sub">Введите текущий код из приложения-аутентификатора.</div>
            <input className="dlg-input" value={disableCode} onChange={e=>setDisableCode(e.target.value)} placeholder="Код" autoFocus
              onKeyDown={e=>{ if(e.key==='Enter') confirmDisable(); }}/>
            <div className="dlg-actions two">
              <button className="btn text" onClick={()=>setDisableDlg(null)} disabled={disableBusy}>Отмена</button>
              <button className="btn primary" onClick={confirmDisable} disabled={disableBusy || !disableCode.trim()}>
                {disableBusy ? <span className="spin"/> : null} Отключить
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// ─────────── Приватность ───────────

const VIS_OPTS = [{v:0,l:'Всем'},{v:1,l:'Контактам'},{v:2,l:'Никому'}];

function PrivacyTab({ flash }) {
  const [p, setP] = React.useState(PRIVACY);
  const [saving, setSaving] = React.useState(false);
  const set = (k, v) => setP(prev => ({ ...prev, [k]: v }));

  async function save() {
    setSaving(true);
    const res = await apiPost('/api/settings/privacy', {
      profileVisibility: p.profileVisibility, emailVisibility: p.emailVisibility,
      lastSeenVisibility: p.lastSeenVisibility, searchableByUsername: p.searchableByUsername,
    });
    setSaving(false);
    if (res.ok && res.data) setP(res.data);
    flash(res.ok ? 'ok' : 'err', res.ok ? 'Настройки приватности сохранены' : errMsg(res));
  }

  const sel = (k) => (
    <select value={p[k]} onChange={e=>set(k, parseInt(e.target.value, 10))}>
      {VIS_OPTS.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
    </select>
  );

  return (
    <div className="set-card">
      <div className="set-card-head"><h3>Приватность</h3><div className="sub">Кто видит ваши данные</div></div>
      <div className="set-card-body">
        <Field label="Профиль" help="Аватар, имя и описание">{sel('profileVisibility')}</Field>
        <Field label="Email" help="Видимость адреса почты">{sel('emailVisibility')}</Field>
        <Field label="Был в сети" help="Время последнего захода">{sel('lastSeenVisibility')}</Field>
        <Field label="Поиск по имени пользователя" help="Можно ли найти вас через поиск"
          end={<Toggle on={p.searchableByUsername} onChange={v=>set('searchableByUsername', v)}/>}><span/></Field>
        <hr className="divider"/>
        <div><SaveBtn saving={saving} onClick={save} icon={<Icon.check size={16}/>}>Сохранить</SaveBtn></div>
      </div>
    </div>
  );
}

// ─────────── Хранилище (только чтение) ───────────

function StorageTab() {
  return (
    <div className="set-card">
      <div className="set-card-head">
        <h3>Хранилище</h3>
        <div className="sub" style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
          <span>{STORAGE.used} из {STORAGE.total} {STORAGE.unit} использовано</span>
          <span className="pill-info warn">{STORAGE.percent}%</span>
        </div>
      </div>
      <div className="set-card-body">
        <div className="stor-bar">
          {STORAGE.breakdown.map((b, i) => <span key={i} style={{width:`${b.pct}%`, background:b.color}}/>)}
        </div>
        <div className="stor-legend">
          {STORAGE.breakdown.map((b, i) => (
            <div key={i} className="item"><span className="sw" style={{background:b.color}}/><span className="k">{b.k}</span><span className="v">{b.v}</span></div>
          ))}
          <div className="item"><span className="sw" style={{background:'var(--md-surface-container-high)', border:'1px solid var(--md-outline-variant)'}}/><span className="k">Свободно</span><span className="v">{STORAGE.freeLabel}</span></div>
        </div>
      </div>
    </div>
  );
}

// ─────────── Устройства и сессии ───────────

function SessionsTab({ flash }) {
  const [sessions, setSessions] = React.useState(SESSIONS_INIT);
  const [busy, setBusy] = React.useState({});
  const [renaming, setRenaming] = React.useState(null);
  const [renameVal, setRenameVal] = React.useState('');
  const [revokingAll, setRevokingAll] = React.useState(false);

  async function revoke(s) {
    if (!window.confirm(`Завершить сессию «${s.device}»?`)) return;
    setBusy(b => ({ ...b, [s.deviceId]: true }));
    const res = await apiPost('/api/settings/sessions/revoke', { deviceId: s.deviceId });
    setBusy(b => ({ ...b, [s.deviceId]: false }));
    if (res.ok) { setSessions(prev => prev.filter(x => x.deviceId !== s.deviceId)); flash('ok', 'Сессия завершена'); }
    else flash('err', errMsg(res));
  }
  async function revokeOthers() {
    if (!window.confirm('Завершить все сессии, кроме текущей?')) return;
    setRevokingAll(true);
    const res = await apiPost('/api/settings/sessions/revoke-others');
    if (res.ok) {
      const fresh = await apiGet('/api/settings/sessions');
      if (fresh.ok && fresh.data) setSessions(fresh.data.sessions || []);
      flash('ok', `Завершено сессий: ${res.data ? res.data.revoked : 0}`);
    } else flash('err', errMsg(res));
    setRevokingAll(false);
  }
  async function saveRename(s) {
    const name = renameVal.trim();
    setBusy(b => ({ ...b, [s.deviceId]: true }));
    const res = await apiPost('/api/settings/devices/rename', { deviceId: s.deviceId, customName: name });
    setBusy(b => ({ ...b, [s.deviceId]: false }));
    if (res.ok) {
      setSessions(prev => prev.map(x => x.deviceId === s.deviceId ? { ...x, device: name || x.device } : x));
      setRenaming(null); flash('ok', 'Устройство переименовано');
    } else flash('err', errMsg(res));
  }

  const header = sessions.length
    ? `${sessions.length} ${pluralRu(sessions.length, 'устройство', 'устройства', 'устройств')} с активным доступом`
    : 'Нет активных сессий';

  return (
    <div className="set-card">
      <div className="set-card-head"><h3>Устройства и сессии</h3><div className="sub">{header}</div></div>
      <div className="set-card-body" style={{paddingTop:6}}>
        {sessions.length === 0 && <div style={{color:'var(--md-on-surface-variant)', fontSize:14}}>Список пуст или сервис недоступен.</div>}
        {sessions.map((s) => (
          <div key={s.deviceId || s.device} className={"session-row" + (s.current ? ' curr' : '')}>
            <div className="si"><Icon.device size={20}/></div>
            <div style={{minWidth:0}}>
              {renaming === s.deviceId
                ? <input className="dlg-input" style={{marginTop:0}} value={renameVal} autoFocus
                    onChange={e=>setRenameVal(e.target.value)}
                    onKeyDown={e=>{ if(e.key==='Enter') saveRename(s); if(e.key==='Escape') setRenaming(null); }}/>
                : <div className="who">{s.device}</div>}
              <div className="meta">{[s.os, s.location, s.when].filter(Boolean).join(' · ')}</div>
            </div>
            {s.current ? <span className="badge-curr">Текущая</span> : <span style={{width:80}}/>}
            <div style={{display:'flex', gap:6, justifyContent:'flex-end'}}>
              {busy[s.deviceId]
                ? <span className="spin" style={{margin:'0 8px'}}/>
                : renaming === s.deviceId
                  ? <button className="btn text" onClick={()=>saveRename(s)}>Сохранить</button>
                  : <>
                      {s.deviceId && <button className="btn text" title="Переименовать" onClick={()=>{ setRenameVal(s.device); setRenaming(s.deviceId); }}><Icon.pencil size={16}/></button>}
                      {!s.current && s.deviceId && <button className="disc" onClick={()=>revoke(s)}>Отключить</button>}
                    </>}
            </div>
          </div>
        ))}
        <div style={{marginTop:12}}>
          <button className="btn" onClick={revokeOthers} disabled={revokingAll || sessions.length <= 1}>
            {revokingAll ? <span className="spin"/> : null} Выйти со всех устройств, кроме этого
          </button>
        </div>
      </div>
    </div>
  );
}

// ─────────── Внешний вид (тема) ───────────

function AppearanceTab() {
  const [theme, setTheme] = React.useState(currentTheme());
  function pick(t) {
    setTheme(t);
    try { localStorage.setItem('bark_theme', t); } catch (e) {}
    applyTheme(t);
  }
  return (
    <div className="set-card">
      <div className="set-card-head"><h3>Внешний вид</h3><div className="sub">Тема оформления (сохраняется в этом браузере)</div></div>
      <div className="set-card-body">
        <Field label="Тема">
          <div className="theme-row">
            <div className={"theme-swatch light" + (theme==='light' ? ' on' : '')} onClick={()=>pick('light')} title="Светлая"/>
            <div className={"theme-swatch dark" + (theme==='dark' ? ' on' : '')} onClick={()=>pick('dark')} title="Тёмная"/>
            <div className={"theme-swatch auto" + (theme==='auto' ? ' on' : '')} onClick={()=>pick('auto')} title="Как в системе"/>
          </div>
        </Field>
        <div style={{fontSize:13, color:'var(--md-on-surface-variant)'}}>
          {theme==='light' ? 'Светлая тема.' : theme==='dark' ? 'Тёмная тема.' : 'Тема следует настройкам системы.'}
        </div>
      </div>
    </div>
  );
}

// ─────────── Корневой компонент ───────────

function App() {
  const validInitial = () => {
    const h = (window.location.hash || '').replace('#', '');
    return NAV_KEYS.indexOf(h) >= 0 ? h : 'account';
  };
  const [section, setSection] = React.useState(validInitial());
  const [toast, setToast] = React.useState(null);
  const flash = React.useCallback((kind, msg) => { setToast({ kind, msg }); setTimeout(() => setToast(null), 4200); }, []);

  React.useEffect(() => {
    const onHash = () => { const h = (window.location.hash || '').replace('#', ''); if (NAV_KEYS.indexOf(h) >= 0) setSection(h); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const go = (key) => { setSection(key); window.location.hash = key; };

  let content;
  switch (section) {
    case 'security':   content = <SecurityTab flash={flash}/>; break;
    case 'privacy':    content = <PrivacyTab flash={flash}/>; break;
    case 'storage':    content = <StorageTab/>; break;
    case 'sessions':   content = <SessionsTab flash={flash}/>; break;
    case 'appearance': content = <AppearanceTab/>; break;
    case 'system':     content = <SystemSection/>; break;
    default:           content = <AccountTab flash={flash}/>;
  }

  return (
    <AppShell
      page="settings"
      kicker={<><span>Прочее</span><span className="sep">/</span><span className="cur">Настройки</span></>}
      title="Настройки"
      search={false}
    >
      <div className="settings-shell">
        <div className="set-nav">
          <div className="set-nav-label">Разделы</div>
          {NAV.map(n => {
            const Ic = Icon[n.icon];
            return (
              <button key={n.key} className={section === n.key ? 'on' : ''} onClick={() => go(n.key)}>
                <Ic size={20}/>
                {n.label}
              </button>
            );
          })}
        </div>
        <div className="set-content">{content}</div>
      </div>
      <Toast toast={toast}/>
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
