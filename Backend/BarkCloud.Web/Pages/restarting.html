<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Перезапуск BarkCloud</title>
    <style>
        :root { color-scheme: light dark; font-family: Inter, system-ui, -apple-system, sans-serif; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f8f7f4; color: #242320; }
        .card { width: min(100%, 460px); box-sizing: border-box; padding: 44px 32px; text-align: center; border-radius: 28px; background: #fff; box-shadow: 0 12px 40px rgb(30 28 24 / 12%); }
        .loader { width: 52px; height: 52px; margin: 0 auto 24px; border: 4px solid #dbe5ef; border-top-color: #356b9b; border-radius: 50%; animation: spin 1s linear infinite; }
        h1 { margin: 0 0 10px; font-size: 25px; font-weight: 600; }
        p { margin: 0; color: #6b6963; line-height: 1.5; }
        .hint { display: block; margin-top: 26px; font-size: 12px; color: #77746d; }
        .wait-error { margin-top: 18px; color: #a23d35; font-size: 13px; line-height: 1.45; }
        .wait-error a { color: inherit; font-weight: 600; }
        .timer { display: inline-block; margin-top: 24px; padding: 8px 15px; border-radius: 999px; background: #e4edf7; color: #28557d; font-size: 14px; font-weight: 600; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-color-scheme: dark) {
            body { background: #171714; color: #f2f0ea; }
            .card { background: #252521; box-shadow: 0 12px 40px rgb(0 0 0 / 35%); }
            p, .hint { color: #b9b6ad; }
            .wait-error { color: #ffb4ab; }
            .loader { border-color: #283b4d; border-top-color: #a9d0f2; }
            .timer { background: #26394c; color: #b8d8f4; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="loader" aria-hidden="true"></div>
        <h1>BarkCloud перезапускается</h1>
        <p>Пожалуйста, подождите — соединение восстановится автоматически.</p>
        <span class="hint">Проверяем доступность сервера каждые 3 секунды</span>
        <div class="timer"><span id="timer">0</span> сек</div>
        <p id="wait-error" class="wait-error" hidden>Сервер не перезапустился за 90 секунд. <a href="/settings#system">Открыть раздел обслуживания</a></p>
    </main>
    <script src="/maintenance-wait.js"></script>
    <script>
        BarkCloudWait.start({ initialDelayMs: 5000, pageServerStartedAt: '{{BARKCLOUD_STARTED_AT_UTC}}' });
    </script>
</body>
</html>
