name: "🚀 BarkCloud.Configuration CI/CD"

on:
  push:
    branches:
      - dev
      - nightly
      - master
    paths:
      - 'Backend/BarkCloud.Configuration/**'
      - 'Shared/**'
      # proto-контракты: только свой, а не весь BarkCloud.Proto → не пересобирать весь бэкенд
      - '!Shared/BarkCloud.Proto/**'
      - 'Shared/BarkCloud.Proto/configuration_api.proto'
      - 'Tests/Backend/BarkCloud.Configuration.Tests/**'
      - 'Tests/BarkCloud.TestKit/**'
      - 'Backend/rebuild.trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ci:
    uses: ./.github/workflows/backend-service-ci.yml
    with:
      service-name: BarkCloud.Configuration
      service-key: configuration
      service-path: Backend/BarkCloud.Configuration
      test-path: Tests/Backend/BarkCloud.Configuration.Tests
      project-path: Backend/BarkCloud.Configuration/BarkCloud.Configuration.csproj
      test-project-path: Tests/Backend/BarkCloud.Configuration.Tests/BarkCloud.Configuration.Tests.csproj
      dockerfile: Backend/BarkCloud.Configuration/Dockerfile.slim
      image-name: barkcloud-configuration
      force-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
