name: BarkCloud Builder Release

on:
  push:
    branches:
      - '**'
    paths:
      - 'Tools/BarkCloud.Builder/**'
      - 'Tests/Tools/BarkCloud.Builder.Tests/**'
      - 'Tests/Directory.Build.props'
      - 'Directory.Build.props'
      - '.github/workflows/build-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: builder-${{ github.run_number }}-${{ github.run_attempt }}
      PUBLISH_DIR: ${{ runner.temp }}/BarkCloud.Builder-win-x64
      ARCHIVE_PATH: ${{ runner.temp }}/BarkCloud.Builder-win-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Builder
        run: dotnet test Tests/Tools/BarkCloud.Builder.Tests/BarkCloud.Builder.Tests.csproj --configuration Release

      - name: Publish Windows executable
        run: >-
          dotnet publish Tools/BarkCloud.Builder/BarkCloud.Builder.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "$env:PUBLISH_DIR"

      - name: Archive publish folder
        run: |
          if (-not (Test-Path -LiteralPath "$env:PUBLISH_DIR/BarkCloud.Builder.exe")) {
            throw 'BarkCloud.Builder.exe was not published.'
          }
          Compress-Archive -LiteralPath $env:PUBLISH_DIR -DestinationPath $env:ARCHIVE_PATH

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG $env:ARCHIVE_PATH `
            --target $env:GITHUB_SHA `
            --title "BarkCloud Builder $env:RELEASE_TAG" `
            --notes "Windows x64, self-contained. Branch: $env:SOURCE_BRANCH. Commit: $env:GITHUB_SHA. Extract the ZIP and run BarkCloud.Builder.exe from the included folder." `
            --latest=false
