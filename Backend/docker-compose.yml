# По умолчанию приложения пишут только в Console; Seq и Lognara выключены.
# Для Seq или локального relay Lognara используйте BarkCloud.Builder, чтобы он
# согласованно обновил .env и сгенерировал нужные Lognara Dockerfile wrappers.
x-common-variables: &common-variables
  CONFIGURATION_SERVICE_URL: "${CONFIGURATION_SERVICE_URL}"
  ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
  CONFIGURATION_ACCESS_KEY: "${CONFIGURATION_ACCESS_KEY}"

services:
  # === Основные микросервисы (prod-образы) ===

  cloud-configuration:
    image: docker.barkfluff.com/barkcloud-configuration:latest
    container_name: ${CONFIGURATION_CONTAINER_NAME}
    restart: always
    env_file:
      - .env
    environment:
      <<: *common-variables
      CONFIGURATION_HOST:  cloud-postgres:5432
      CONFIGURATION_DATABASE: configuration
      CONFIGURATION_USERNAME: ${POSTGRES_USER}
      CONFIGURATION_PASSWORD: ${POSTGRES_PASSWORD}
      CONFIGURATION_PORT: ${CONFIGURATION_PORT}
      CONFIGURATION_DBPORT: "5432"
      MINIO_HOST: cloud-minio
      MINIO_PORT: "9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      # SMTP для подтверждений по email (опционально; пусто — режим без почты)
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SENDER_EMAIL: ${EMAIL_SENDER_EMAIL}
      EMAIL_SENDER_PASSWORD: ${EMAIL_SENDER_PASSWORD}
      # Внешние адреса сервисов для клиентов (обязательны)
      EXTERNAL_IDENTITY_HOST: ${EXTERNAL_IDENTITY_HOST}
      EXTERNAL_USERS_HOST: ${EXTERNAL_USERS_HOST}
      EXTERNAL_FILES_HOST: ${EXTERNAL_FILES_HOST}
      EXTERNAL_TORRENT_HOST: ${EXTERNAL_TORRENT_HOST}
      # Порты торрент-сервиса нужны configuration для вычисления TorrentService:Host/RunSettings
      TORRENT_PORT: ${TORRENT_PORT}
      TORRENT_HTTP1PORT: ${TORRENT_HTTP1PORT}
      TORRENT_PEER_PORT: ${TORRENT_PEER_PORT}
      ConsoleOutput: ${CONFIGURATION_CONSOLE_OUTPUT}
      SeqEnable: ${CONFIGURATION_SEQ_ENABLE}
      LognaraEnable: ${CONFIGURATION_LOGNARA_ENABLE}
    networks:
      - barkcloud-network

  cloud-identity:
    image: docker.barkfluff.com/barkcloud-identity:latest
    container_name: ${IDENTITY_CONTAINER_NAME}
    restart: always
    environment:
      <<: *common-variables
      SERVICE_PORT: ${IDENTITY_PORT}
      BarkCloud__AndroidCertificateSha256Fingerprint: "${BARKCLOUD_ANDROID_CERT_SHA256_FINGERPRINT:-}"
      ConsoleOutput: ${IDENTITY_CONSOLE_OUTPUT}
      SeqEnable: ${IDENTITY_SEQ_ENABLE}
      LognaraEnable: ${IDENTITY_LOGNARA_ENABLE}
    networks:
      - barkcloud-network
    depends_on:
      - cloud-configuration

  cloud-users:
    image: docker.barkfluff.com/barkcloud-users:latest
    container_name: ${USERS_CONTAINER_NAME}
    restart: always
    environment:
      <<: *common-variables
      SERVICE_PORT: ${USERS_PORT}
      ConsoleOutput: ${USERS_CONSOLE_OUTPUT}
      SeqEnable: ${USERS_SEQ_ENABLE}
      LognaraEnable: ${USERS_LOGNARA_ENABLE}
    networks:
      - barkcloud-network
    depends_on:
      - cloud-configuration
      - cloud-identity

  cloud-files:
    image: docker.barkfluff.com/barkcloud-files:latest
    container_name: ${FILES_CONTAINER_NAME}
    restart: always
    environment:
      <<: *common-variables
      SERVICE_PORT: ${FILES_PORT}
      SERVICE_HTTP1PORT: ${FILES_HTTP1PORT}
      StorageProbe__Path: "/mnt/minio-data"
      Archive__TempPath: "/mnt/archive-temp"
      ConsoleOutput: ${FILES_CONSOLE_OUTPUT}
      SeqEnable: ${FILES_SEQ_ENABLE}
      LognaraEnable: ${FILES_LOGNARA_ENABLE}
    volumes:
      - ${MINIO_DATA_PATH:-cloud-minio_data}:/mnt/minio-data:ro
      - ${ARCHIVE_TEMP_PATH:-archive_temp}:/mnt/archive-temp
    networks:
      - barkcloud-network
    depends_on:
      - cloud-configuration
      - cloud-identity

  # Сервис уведомлений. Внешнего API нет — в nginx не маршрутизируется. Опционален
  cloud-notification:
    image: docker.barkfluff.com/barkcloud-notification:latest
    container_name: ${NOTIFICATION_CONTAINER_NAME}
    restart: always
    environment:
      <<: *common-variables
      ConsoleOutput: ${NOTIFICATION_CONSOLE_OUTPUT}
      SeqEnable: ${NOTIFICATION_SEQ_ENABLE}
      LognaraEnable: ${NOTIFICATION_LOGNARA_ENABLE}
    networks:
      - barkcloud-network
    depends_on:
      - cloud-configuration

  # Торрент-сервис: качает торренты на хост-диск ({TORRENT_DOWNLOAD_PATH} → /mnt/torrents)
  cloud-torrent:
    image: docker.barkfluff.com/barkcloud-torrent:latest
    container_name: ${TORRENT_CONTAINER_NAME}
    restart: always
    environment:
      <<: *common-variables
      SERVICE_PORT: ${TORRENT_PORT}
      SERVICE_HTTP1PORT: ${TORRENT_HTTP1PORT}
      FILES_HTTP1PORT: ${FILES_HTTP1PORT}
      Torrent__DownloadPath: "/mnt/torrents"
      Torrent__PeerPort: ${TORRENT_PEER_PORT}
      ConsoleOutput: ${TORRENT_CONSOLE_OUTPUT}
      SeqEnable: ${TORRENT_SEQ_ENABLE}
      LognaraEnable: ${TORRENT_LOGNARA_ENABLE}
    volumes:
      - ${TORRENT_DOWNLOAD_PATH:-torrent_data}:/mnt/torrents
    networks:
      - barkcloud-network
    depends_on:
      - cloud-configuration
      - cloud-identity

  # Веб-клиент
  cloud-web:
    image: docker.barkfluff.com/barkcloud-web:latest
    container_name: ${WEB_CONTAINER_NAME}
    restart: always
    user: root
    env_file:
      - .env
    environment:
      <<: *common-variables
      ASPNETCORE_URLS: "http://+:8080"
      App__CookieSecure: "${WEB_COOKIE_SECURE}"
      App__PublicHost: "${WEB_PUBLIC_HOST}"
      App__AdminPassword: "${WEB_ADMIN_PASSWORD}"
      BarkCloud__AndroidCertificateSha256Fingerprint: "${BARKCLOUD_ANDROID_CERT_SHA256_FINGERPRINT:-}"
      Docker__ContainerNames__Configuration: "${CONFIGURATION_CONTAINER_NAME}"
      Docker__ContainerNames__Identity: "${IDENTITY_CONTAINER_NAME}"
      Docker__ContainerNames__Users: "${USERS_CONTAINER_NAME}"
      Docker__ContainerNames__Files: "${FILES_CONTAINER_NAME}"
      Docker__ContainerNames__Web: "${WEB_CONTAINER_NAME}"
      Docker__ContainerNames__Notification: "${NOTIFICATION_CONTAINER_NAME}"
      Docker__ContainerNames__Torrent: "${TORRENT_CONTAINER_NAME}"
      ConsoleOutput: ${WEB_CONSOLE_OUTPUT}
      SeqEnable: ${WEB_SEQ_ENABLE}
      LognaraEnable: ${WEB_LOGNARA_ENABLE}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/docker-compose.yml:rw
      - ./.env:/.env:ro
      - cloud-web-maintenance:/app/maintenance
    networks:
      - barkcloud-network
    depends_on:
      - cloud-configuration
      - cloud-identity
      - cloud-users
      - cloud-files
      - cloud-torrent

  # === Инфраструктурные сервисы ===

  cloud-minio:
    image: docker.barkfluff.com/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1

    container_name: ${MINIO_CONTAINER_NAME}
    restart: always
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - ${MINIO_DATA_PATH:-cloud-minio_data}:/data
    command: server /data --console-address ":9001"
    networks:
      - barkcloud-network

  cloud-rabbitmq:
    image: rabbitmq:latest

    container_name: ${RABBITMQ_CONTAINER_NAME}
    restart: always
    volumes:
      - cloud-rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
    networks:
      - barkcloud-network

  cloud-postgres:
    image: postgres:18

    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_worker_processes=2"
      - "-c"
      - "max_parallel_workers=2"
      - "-c"
      - "max_parallel_workers_per_gather=1"
      - "-c"
      - "jit=off"
    volumes:
      - ${POSTGRES_DATA_PATH:-pgdata}:/var/lib/postgresql
      - ${BACKUP_PATH:-backup_volume}:/backup
    networks:
      - barkcloud-network

networks:
  barkcloud-network:
    external: true
    name: ${DOCKER_NETWORK_NAME}
volumes:
  pgdata:
  cloud-rabbitmq_data:
  cloud-minio_data:
  backup_volume:
  archive_temp:
  torrent_data:
  cloud-web-maintenance:
