name: "🚀 BarkCloud.Torrent CI/CD"

on:
  push:
    branches:
      - dev
      - nightly
      - master
    # Proto-контракты — не весь BarkCloud.Proto, а только свои + компилируемые в GrpcServer
    # (configuration_api, session_revocation_api) → правка одного .proto не пересобирает весь бэкенд.
    # Те же пути без тестов передаются ниже в runtime-paths — меняй оба списка вместе.
    paths:
      - 'Backend/BarkCloud.Torrent/**'
      - 'Backend/BarkCloud.GrpcServer/**'
      - 'Shared/BarkCloud.Shared.*/**'
      - 'Shared/BarkCloud.Proto/configuration_api.proto'
      - 'Shared/BarkCloud.Proto/session_revocation_api.proto'
      - 'Shared/BarkCloud.Proto/torrent_api.proto'
      - 'Shared/BarkCloud.Proto/files_api.proto'
      - 'Shared/BarkCloud.Proto/shared.proto'
      - 'Backend/rebuild.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/backend-service-ci.yml
    with:
      service-name: BarkCloud.Torrent
      service-key: torrent
      runtime-paths: |
        Backend/BarkCloud.Torrent/**
        Backend/BarkCloud.GrpcServer/**
        Shared/BarkCloud.Shared.*/**
        Shared/BarkCloud.Proto/configuration_api.proto
        Shared/BarkCloud.Proto/session_revocation_api.proto
        Shared/BarkCloud.Proto/torrent_api.proto
        Shared/BarkCloud.Proto/files_api.proto
        Shared/BarkCloud.Proto/shared.proto
        Backend/rebuild.trigger
      project-path: Backend/BarkCloud.Torrent/BarkCloud.Torrent.csproj
      dockerfile: Backend/BarkCloud.Torrent/Dockerfile.slim
      image-name: barkcloud-torrent
      force-run: ${{ github.event_name == 'workflow_dispatch' }}
      push-delay: 75
    secrets: inherit
