version: '3.8'

x-common-variables: &common-variables
  CONFIGURATION_SERVICE_URL: "${CONFIGURATION_SERVICE_URL}"
  ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
  CONFIGURATION_ACCESS_KEY: "${CONFIGURATION_ACCESS_KEY}"

services:
  # === Основные микросервисы (prod-образы) ===

  configuration:
    image: docker.barkfluff.com/barkcloud-configuration:latest
    container_name: cloud-configuration
    restart: always
    env_file:
      - .env
    environment:
      <<: *common-variables
      CONFIGURATION_HOST:  postgres_barkcloud:5432
      CONFIGURATION_DATABASE: configuration
      CONFIGURATION_USERNAME: ${POSTGRES_USER}
      CONFIGURATION_PASSWORD: ${POSTGRES_PASSWORD}
      CONFIGURATION_PORT: ${CONFIGURATION_PORT}
      CONFIGURATION_DBPORT: "5432"
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      # SMTP для подтверждений по email (опционально; пусто — режим без почты)
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SENDER_EMAIL: ${EMAIL_SENDER_EMAIL}
      EMAIL_SENDER_PASSWORD: ${EMAIL_SENDER_PASSWORD}
      # Внешние адреса сервисов для клиентов (обязательны)
      EXTERNAL_IDENTITY_HOST: ${EXTERNAL_IDENTITY_HOST}
      EXTERNAL_USERS_HOST: ${EXTERNAL_USERS_HOST}
      EXTERNAL_FILES_HOST: ${EXTERNAL_FILES_HOST}
      EXTERNAL_TORRENT_HOST: ${EXTERNAL_TORRENT_HOST}
      TORRENT_PORT: ${TORRENT_PORT}
      TORRENT_HTTP1PORT: ${TORRENT_HTTP1PORT}
      TORRENT_PEER_PORT: ${TORRENT_PEER_PORT}
    networks:
      - barkcloud-network



  torrent:
    image: docker.barkfluff.com/barkcloud-torrent:latest
    container_name: cloud-torrent
    restart: always
    environment:
      <<: *common-variables
      SERVICE_PORT: ${TORRENT_PORT}
      SERVICE_HTTP1PORT: ${TORRENT_HTTP1PORT}
      Torrent__DownloadPath: "./data/torrents"
      Torrent__PeerPort: ${TORRENT_PEER_PORT}
    volumes:
      - ${TORRENT_DOWNLOAD_PATH:-torrent_data}:/mnt/torrents
    # BitTorrent peer-порт публикуется напрямую; gRPC/HTTP идут через nginx.
    ports:
      - "${TORRENT_PEER_PORT}:${TORRENT_PEER_PORT}"
      - "${TORRENT_PEER_PORT}:${TORRENT_PEER_PORT}/udp"
    networks:
      - barkcloud-network
    depends_on:
      - configuration


  identity:
    image: docker.barkfluff.com/barkcloud-identity:latest
    container_name: cloud-identity
    restart: always
    environment:
      <<: *common-variables
      SERVICE_PORT: ${IDENTITY_PORT}
    networks:
      - barkcloud-network
    depends_on:
      - configuration

  users:
    image: docker.barkfluff.com/barkcloud-users:latest
    container_name: cloud-users
    restart: always
    environment:
      <<: *common-variables
      SERVICE_PORT: ${USERS_PORT}
    networks:
      - barkcloud-network
    depends_on:
      - configuration

  files:
    image: docker.barkfluff.com/barkcloud-files:latest
    container_name: cloud-files
    restart: always
    environment:
      <<: *common-variables
      SERVICE_PORT: ${FILES_PORT}
      SERVICE_HTTP1PORT: ${FILES_HTTP1PORT}
      StorageProbe__Path: "./data/minio-data"
      Archive__TempPath: "./data/archive-temp"
    volumes:
      - ${MINIO_DATA_PATH:-minio_data}:/mnt/minio-data:ro
      - ${ARCHIVE_TEMP_PATH:-archive_temp}:/mnt/archive-temp
    networks:
      - barkcloud-network
    depends_on:
      - configuration

  # Сервис уведомлений. Внешнего API нет — в nginx не маршрутизируется. Опционален
  notification:
    image: docker.barkfluff.com/barkcloud-notification:latest
    container_name: cloud-notification
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkcloud-network
    depends_on:
      - configuration

  # Веб-клиент
  web:
    image: docker.barkfluff.com/barkcloud-web:latest
    container_name: cloud-web
    restart: always
    user: root
    env_file:
      - .env
    environment:
      <<: *common-variables
      ASPNETCORE_URLS: "http://+:8080"
      App__CookieSecure: "${WEB_COOKIE_SECURE}"
      App__PublicHost: "${WEB_PUBLIC_HOST}"
      App__AdminPassword: "${WEB_ADMIN_PASSWORD}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/docker-compose.yml:ro
      - ./.env:/.env:ro
    ports:
      - "${WEB_PORT}:8080"
    networks:
      - barkcloud-network
    depends_on:
      - configuration
      - identity
      - users
      - files
      - torrent

  # === Инфраструктурные сервисы ===

  seq:
    image: datalust/seq:latest
    container_name: seq_barkcloud
    restart: always
    ports:
      - "${SEQ_WEBPORT}:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_ADMIN_PASSWORD}"
    volumes:
      - ${SEQ_DATA_PATH:-seq_data}:/data
    networks:
      - barkcloud-network

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    container_name: minio_barkcloud
    restart: always
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_WEBPORT}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - ${MINIO_DATA_PATH:-minio_data}:/data
    command: server /data --console-address ":9001"
    networks:
      - barkcloud-network

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq_barkcloud
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
    networks:
      - barkcloud-network

  postgres:
    image: postgres:18
    container_name: postgres_barkcloud
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_worker_processes=2"
      - "-c"
      - "max_parallel_workers=2"
      - "-c"
      - "max_parallel_workers_per_gather=1"
      - "-c"
      - "jit=off"
    volumes:
      - ${POSTGRES_DATA_PATH:-pgdata}:/var/lib/postgresql
      - ${BACKUP_PATH:-backup_volume}:/backup
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - barkcloud-network

networks:
  barkcloud-network:
    external: true
    name: barkcloud-network

volumes:
  pgdata:
  rabbitmq_data:
  minio_data:
  backup_volume:
  seq_data:
  archive_temp:
  torrent_data:
