syntax = "proto3";

option csharp_namespace = "BarkCloud.Proto.SessionRevocation";

package barkcloud.session_revocation;

import "google/protobuf/timestamp.proto";

service SessionRevocationApi {
  rpc GetRevokedSessions(GetRevokedSessionsRequest) returns (GetRevokedSessionsResponse);
}

message GetRevokedSessionsRequest {
  google.protobuf.Timestamp changed_since = 1;
}

message GetRevokedSessionsResponse {
  repeated RevokedSession sessions = 1;
  google.protobuf.Timestamp server_time = 2;
}

message RevokedSession {
  int64 user_id = 1;
  string device_id = 2;
  google.protobuf.Timestamp revoked_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  // Задано — отзыв по сессии: отклоняются токены с sid <= значения (и без sid), revoked_at порог времени не задаёт.
  optional int64 max_session_id = 5;
}
