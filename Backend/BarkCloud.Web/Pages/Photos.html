<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarkCloud — Фото</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600;8..144,700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css"/>
  <script>
    /* Тема применяется до рендера, чтобы не было мигания. Источник — localStorage (bark_theme: light|dark|auto). */
    (function(){try{var t=localStorage.getItem('bark_theme')||'auto';var d=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <style>
    .photos-toolbar { display:flex; align-items:center; gap:14px; margin-bottom: 24px; flex-wrap: wrap; }
    .photos-toolbar .right { margin-left:auto; display:flex; gap:8px; align-items:center; }

    .date-group { margin-bottom: 36px; }
    .date-head {
      display:flex; align-items:baseline; justify-content:space-between;
      margin-bottom: 16px;
    }
    .date-head h3 {
      font-size: 22px;
      font-weight: 500;
      line-height: 28px;
      color: var(--md-on-surface);
    }
    .date-head .right {
      font-size: 13px;
      color: var(--md-on-surface-variant);
      display:flex; gap: 12px; align-items:center;
    }
    .date-head .right a { color: var(--md-primary); text-decoration: none; font-weight: 500; }
    .date-head .right a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div id="root"></div>

<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║ SERVER PAYLOAD (Photos.html)                                     ║
  ╠══════════════════════════════════════════════════════════════════╣
  ║ Server should fill the JSON below with:                          ║
  ║   {                                                              ║
  ║     "filters":   [{ key, label, count }, ...],                   ║
  ║     "memories":  [{ label, date, tint:[a,b], featured? }, ...],  ║
  ║     "groups":    [{                                              ║
  ║        label, meta,                                              ║
  ║        photos:[{ tint:[a,b], tall?, video?, fav?, dur? }, ...]   ║
  ║     }, ...],                                                     ║
  ║     "memoriesUpdated": "03:14"                                   ║
  ║   }                                                              ║
  ╚══════════════════════════════════════════════════════════════════╝
-->
<script type="application/json" id="server-data">
{{{ page_data_json }}}
</script>

<script type="text/babel">
const { AppShell, Icon, apiGet, apiPost, pickFiles, uploadFile,
        MediaThumb, Lightbox, Modal, useToast, EmptyState, Loading,
        GRID_SIZES, plural, groupByDate, AlbumCard, AlbumFormModal, AlbumDetail,
        useInfiniteMedia, useMediaActions } = window;

const RECENT_FOLDER = 'Недавно загруженные';

function Photo({ m, onOpen, onMenu }) {
  return (
    <div className="photo" onClick={() => onOpen(m)} onContextMenu={(e) => onMenu(e, m)}>
      <MediaThumb media={m} sizes={GRID_SIZES} />
      {m.kind === 'video' && <div className="vbadge"><Icon.play size={10}/> видео</div>}
    </div>
  );
}

function App() {
  const [tab, setTab] = React.useState('photos');     // photos | albums
  const [albums, setAlbums] = React.useState(null);
  const [openAlbum, setOpenAlbum] = React.useState(null);
  const [lightbox, setLightbox] = React.useState(null); // индекс в items | null
  const [creating, setCreating] = React.useState(false);
  const [upload, setUpload] = React.useState(null);     // {pct,current,total} | null
  const [toastNode, toast] = useToast();

  const { items: photos, loading, done, sentinelRef, removeItem, updateItem, reload } = useInfiniteMedia('photo', toast);

  const loadAlbums = React.useCallback(() => {
    apiGet('/api/albums')
      .then(d => setAlbums(d.albums || []))
      .catch(e => { toast(e.message, 'err'); setAlbums([]); });
  }, [toast]);

  React.useEffect(() => { loadAlbums(); }, [loadAlbums]);

  const actionsCtx = useMediaActions({
    albums: albums || [], toast,
    onRenamed: (m, name) => updateItem(m.id, { entryNames: [name, ...((m.entryNames || []).slice(1))] }),
    onRemoved: (m) => removeItem(m.id),
    reloadAlbums: loadAlbums
  });

  // Загруженные фото кладём в папку «Недавно загруженные» (создаётся при отсутствии),
  // чтобы у них была запись каталога — тогда работают переименование/удаление в корзину.
  async function ensureRecentFolder() {
    const d = await apiGet('/api/cloud/list?dir=');
    const found = (d.dirs || []).find(x => x.name === RECENT_FOLDER);
    if (found) return found.id;
    const created = await apiPost('/api/cloud/dir', { name: RECENT_FOLDER });
    return created.id;
  }

  async function doUpload() {
    const files = await pickFiles({ accept: 'image/*' });
    if (!files.length) return;
    let folderId = null;
    try { folderId = await ensureRecentFolder(); } catch (e) { /* без папки — файл всё равно попадёт в галерею */ }
    let done = 0;
    for (const f of files) {
      setUpload({ current: done + 1, total: files.length, pct: 0 });
      try {
        const res = await uploadFile(f, p => setUpload({ current: done + 1, total: files.length, pct: Math.round(p * 100) }));
        if (folderId && res && res.fileId) {
          try { await apiPost('/api/cloud/attach', { dir: folderId, fileId: res.fileId, name: res.name || f.name }); }
          catch (e) { /* attach best-effort: дубликат/уже привязан — не критично */ }
        }
      }
      catch (e) { toast(`«${f.name}»: ${e.message}`, 'err'); }
      done++;
    }
    setUpload(null);
    toast(`Загружено: ${done} ${plural(done,'файл','файла','файлов')}`);
    reload();
  }

  const groups = React.useMemo(() => groupByDate(photos), [photos]);

  const actions = (
    <>
      {tab === 'albums' && <button className="btn outlined" onClick={() => setCreating(true)}><Icon.plus size={16}/> Альбом</button>}
      <button className="btn primary" onClick={doUpload}><Icon.upload size={16}/> Загрузить</button>
    </>
  );

  return (
    <AppShell
      page="photos"
      kicker={<><span>Библиотека</span><span className="sep">/</span><span className="cur">Фото</span></>}
      title="Фотогалерея"
      actions={actions}
    >
      {toastNode}
      {actionsCtx.overlay}

      <div className="photos-toolbar">
        <div className="chip-row">
          <button className={"chip" + (tab==='photos'?' active':'')} onClick={() => { setTab('photos'); setOpenAlbum(null); }}>
            {tab==='photos' && <Icon.check size={16}/>} Все фото
            <span className="count">{photos.length}{done ? '' : '+'}</span>
          </button>
          <button className={"chip" + (tab==='albums'?' active':'')} onClick={() => setTab('albums')}>
            {tab==='albums' && <Icon.check size={16}/>} Альбомы
            {albums && <span className="count">{albums.length}</span>}
          </button>
        </div>
      </div>

      {upload && (
        <div className="upload-banner">
          <span className="spinner"/>
          Загрузка {upload.current}/{upload.total}…
          <div className="bar"><div className="bar-fill" style={{width: upload.pct + '%'}}/></div>
        </div>
      )}

      {/* ── Вкладка АЛЬБОМЫ ── */}
      {tab === 'albums' && (
        openAlbum
          ? <AlbumDetail album={openAlbum} candidates={photos} toast={toast}
              onBack={() => setOpenAlbum(null)}
              onChanged={() => { loadAlbums(); }}/>
          : albums === null ? <Loading/> :
            <div className="album-grid">
              {albums.map(a => <AlbumCard key={a.id} album={a} onOpen={(al) => setOpenAlbum(al)}/>)}
              <div className="album-card new-album" onClick={() => setCreating(true)}>
                <Icon.plus size={28}/>
                <span>Создать альбом</span>
              </div>
            </div>
      )}

      {/* ── Вкладка ВСЕ ФОТО ── */}
      {tab === 'photos' && (
        (loading && photos.length === 0) ? <Loading/> :
        photos.length === 0
          ? <EmptyState icon="photo" title="Пока нет фотографий" hint="Загрузите снимки — они появятся здесь и в галерее."
              action={<button className="btn primary" onClick={doUpload}><Icon.upload size={16}/> Загрузить</button>}/>
          : <>
              {groups.map(g => (
                <div key={g.key} className="date-group">
                  <div className="date-head">
                    <h3>{g.label}</h3>
                    <div className="right"><span>{g.items.length} {plural(g.items.length,'фото','фото','фото')}</span></div>
                  </div>
                  <div className="photo-grid">
                    {g.items.map(m => <Photo key={m.id} m={m}
                      onOpen={() => setLightbox(photos.findIndex(p => p.id === m.id))}
                      onMenu={actionsCtx.openMenu}/>)}
                  </div>
                </div>
              ))}
              <div ref={sentinelRef} className="infinite-sentinel">
                {loading && photos.length > 0 && <Loading label="Загрузка…"/>}
              </div>
            </>
      )}

      {creating && <AlbumFormModal onClose={() => setCreating(false)}
        onSaved={() => { setCreating(false); setTab('albums'); loadAlbums(); toast('Альбом создан'); }} toast={toast}/>}
      {lightbox !== null && <Lightbox items={photos} index={lightbox} onClose={() => setLightbox(null)}/>}
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
