# BarkCloud — единый субдомен cloud.barkfluff.com, маршрутизация по порту.
# nginx терминирует TLS, внутрь сервисов проксирует по h2c (plaintext gRPC).
#
# Внешний порт (TLS)        ->  внутренний сервис (RunSettings:Port в конфиг-БД)
#   7020                    ->  cloud-identity:7000   (gRPC)
#   7021                    ->  cloud-users:7021      (gRPC)
#   7025                    ->  cloud-files:7025      (gRPC) + cloud-files:7026 (HTTP1 /web/)
#
# Если RunSettings:Port сервисов поменяется в БД — поправить backend-порты в upstream ниже.
#
# ВАЖНО (keepalive vs. смена IP): upstream-блоки держат пул постоянных соединений к бэкендам
# (keepalive) — это убирает установку TCP+HTTP/2 на каждый RPC и резко поднимает потолок rps.
# Цена: имена бэкендов резолвятся при загрузке конфига и кэшируются. Если backend-контейнер
# ПЕРЕСОЗДаётся (docker compose up при обновлении образа) и получает новый IP, nginx продолжит
# ходить на старый IP до перезагрузки конфига. Поэтому после обновления бэкенда обязательно
# перезагрузить nginx:  docker exec cloud-nginx nginx -s reload  (или перезапустить контейнер).

# --- Пулы соединений к бэкендам (постоянные h2c-соединения для gRPC) ---
upstream barkcloud_identity {
    server cloud-identity:7000;
    keepalive 32;            # держать до 32 idle-соединений в пуле на воркер
    keepalive_requests 1000; # пересоздавать соединение после 1000 запросов
    keepalive_timeout 60s;   # закрыть простаивающее соединение через 60с
}

upstream barkcloud_users {
    server cloud-users:7021;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream barkcloud_files {
    server cloud-files:7025;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# HTTP/1.1-пул для скачивания/загрузки файлов (/web/).
upstream barkcloud_files_http {
    server cloud-files:7026;
    keepalive 16;
    keepalive_timeout 60s;
}

# --- Identity (порт 7020) ---
server {
    listen 7020 ssl;
    http2 on;
    server_name cloud.barkfluff.com;

    ssl_certificate     /etc/nginx/certs/barkfluff.com-crt.pem;
    ssl_certificate_key /etc/nginx/certs/barkfluff.com-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        grpc_pass grpc://barkcloud_identity;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}

# --- Users (порт 7021) ---
server {
    listen 7021 ssl;
    http2 on;
    server_name cloud.barkfluff.com;

    ssl_certificate     /etc/nginx/certs/barkfluff.com-crt.pem;
    ssl_certificate_key /etc/nginx/certs/barkfluff.com-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        grpc_pass grpc://barkcloud_users;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}

# --- Files (порт 7025): gRPC + HTTP1 веб для скачивания/загрузки ---
server {
    listen 7025 ssl;
    http2 on;
    server_name cloud.barkfluff.com;

    ssl_certificate     /etc/nginx/certs/barkfluff.com-crt.pem;
    ssl_certificate_key /etc/nginx/certs/barkfluff.com-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 512m;

    # gRPC API (основной)
    location / {
        grpc_pass grpc://barkcloud_files;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }

    # HTTP-веб: /web/upload/{id}, /web/download/{id} -> cloud-files:7026/upload|download
    location /web/ {
        rewrite ^/web/(.*) /$1 break;
        proxy_pass http://barkcloud_files_http;
        # keepalive к апстриму требует HTTP/1.1 и очистки заголовка Connection
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Большие файлы — буферизацию выключаем, таймауты увеличиваем
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }
}
