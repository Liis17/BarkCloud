name: "BarkCloud Docker version"
description: "Вычисляет SemVer-тег образа с учётом ветки BarkCloud"
inputs:
  image:
    description: "Имя образа без registry и branch suffix"
    required: true
  registry:
    description: "Docker Registry"
    required: false
    default: "docker.barkfluff.com"
  username:
    description: "Registry username для чтения тегов"
    required: false
    default: ""
  password:
    description: "Registry password для чтения тегов"
    required: false
    default: ""
outputs:
  version:
    description: "SemVer-версия публикуемого образа"
    value: ${{ steps.version.outputs.version }}
  repository:
    description: "Репозиторий с branch suffix"
    value: ${{ steps.version.outputs.repository }}
  tags:
    description: "Версионный, latest и SHA-теги"
    value: ${{ steps.version.outputs.tags }}
  tag_sha:
    description: "SHA-тег образа"
    value: ${{ steps.version.outputs.tag_sha }}
  tag_version:
    description: "Полный тег с SemVer-версией"
    value: ${{ steps.version.outputs.tag_version }}
runs:
  using: composite
  steps:
    - name: "Вычислить SemVer-версию образа"
      id: version
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USERNAME: ${{ inputs.username }}
        REGISTRY_PASSWORD: ${{ inputs.password }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: bash "$GITHUB_ACTION_PATH/resolve-version.sh"
