name: "🚀 BarkCloud.Transcoder CI/CD"

on:
  push:
    branches:
      - dev
    paths:
      - 'Backend/BarkCloud.Transcoder/**'
      - 'Backend/rebuild.trigger'
      - 'Tests/Backend/BarkCloud.Transcoder.Tests/**'
      - 'Tests/BarkCloud.TestKit/**'
  pull_request:
    types:
      - closed
    branches:
      - master
    paths:
      - 'Backend/BarkCloud.Transcoder/**'
      - 'Backend/rebuild.trigger'
      - 'Tests/Backend/BarkCloud.Transcoder.Tests/**'
      - 'Tests/BarkCloud.TestKit/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    if: >-
      ${{ github.event_name == 'push' && github.ref_name == 'dev'
          || github.event_name == 'workflow_dispatch' && github.ref_name == 'dev'
          || github.event_name == 'pull_request' && github.event.pull_request.merged == true
             && github.event.pull_request.head.ref == 'dev'
             && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/backend-service-ci.yml
    with:
      service-name: BarkCloud.Transcoder
      service-key: transcoder
      runtime-paths: |
        Backend/BarkCloud.Transcoder/**
        Backend/rebuild.trigger
      test-path: Tests/Backend/BarkCloud.Transcoder.Tests
      project-path: Backend/BarkCloud.Transcoder/BarkCloud.Transcoder.csproj
      test-project-path: Tests/Backend/BarkCloud.Transcoder.Tests/BarkCloud.Transcoder.Tests.csproj
      dockerfile: Backend/BarkCloud.Transcoder/Dockerfile
      image-name: barkcloud-transcoder
      force-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
