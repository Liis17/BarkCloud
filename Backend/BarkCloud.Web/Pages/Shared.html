<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarkCloud — Общие</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600;8..144,700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <style>
    /* Primary tabs */
    .sh-tabs {
      display: flex; gap: 0;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .sh-tab {
      padding: 14px 20px;
      background: transparent; border: none; cursor: pointer;
      color: var(--md-on-surface-variant);
      font-family: inherit;
      font-size: 14px; font-weight: 500;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      display: inline-flex; align-items: center; gap: 8px;
      transition: color var(--d-short), border-color var(--d-short);
    }
    .sh-tab:hover { color: var(--md-on-surface); }
    .sh-tab.on { color: var(--md-primary); border-color: var(--md-primary); }
    .sh-tab .count {
      color: var(--md-on-surface-variant);
      background: var(--md-surface-container-high);
      padding: 2px 8px; border-radius: var(--r-full);
      font-size: 11px;
      font-weight: 500;
    }
    .sh-tab.on .count { color: var(--md-on-primary-container); background: var(--md-primary-container); }

    /* Share card — M3 filled card */
    .share-card {
      display: grid;
      grid-template-columns: 56px 1fr 220px 200px 100px;
      gap: 18px;
      align-items: center;
      padding: 16px 20px;
      border-radius: var(--r-lg);
      background: var(--md-surface-container-low);
      cursor: pointer;
      transition: background var(--d-short), transform var(--d-short);
      margin-bottom: 8px;
    }
    .share-card:hover {
      background: var(--md-surface-container);
      transform: translateY(-1px);
    }
    .share-card .file-icon {
      width: 48px; height: 48px;
      border-radius: var(--r-md);
      display:flex; align-items:center; justify-content:center;
      font-size: 11px;
      font-weight: 600;
    }
    .share-card .file-icon.folder { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    .share-card .file-icon.pdf    { background: #FFCDD2; color: #B71C1C; }
    .share-card .file-icon.code   { background: #B2DFDB; color: #004D40; }
    .share-card .file-icon.doc    { background: #BBDEFB; color: #0D47A1; }
    .share-card .file-icon.vid    { background: #D1C4E9; color: #311B92; }

    .share-card .main-col .name {
      font-size: 15px; font-weight: 500;
      color: var(--md-on-surface);
      margin-bottom: 3px;
    }
    .share-card .main-col .path {
      font-size: 12px; color: var(--md-on-surface-variant);
    }
    .share-card .ppl-col {
      display: flex; align-items: center; gap: 12px;
    }
    .share-card .ppl-col .ppl-text {
      font-size: 13px; color: var(--md-on-surface-variant);
    }
    .share-card .ppl-col .ppl-text .b { color: var(--md-on-surface); font-weight: 500; }
    .share-card .meta-col {
      display: flex; flex-direction: column; gap: 4px;
    }
    .meta-line {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      display: flex; align-items: center; gap: 6px;
    }
    .meta-line .k { color: var(--md-outline); }

    .perm-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px;
      border-radius: var(--r-full);
      font-size: 12px;
      font-weight: 500;
    }
    .perm-badge.owner { background: var(--md-success-container); color: var(--md-on-success-container); }
    .perm-badge.editor { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    .perm-badge.viewer { background: var(--md-surface-container-high); color: var(--md-on-surface); }
    .perm-badge.link { background: var(--md-warning-container); color: var(--md-on-surface); }

    .share-card .act-col {
      display: flex; justify-content: flex-end; gap: 4px;
    }

    /* Link card */
    .link-card {
      display: grid;
      grid-template-columns: 56px 1fr 240px 100px;
      gap: 18px;
      align-items: center;
      padding: 16px 20px;
      border-radius: var(--r-lg);
      background: var(--md-surface-container-low);
      margin-bottom: 8px;
      transition: background var(--d-short);
    }
    .link-card:hover { background: var(--md-surface-container); }
    .link-card .link-icon {
      width: 48px; height: 48px;
      border-radius: var(--r-md);
      background: var(--md-warning-container);
      color: var(--md-warning);
      display:flex; align-items:center; justify-content:center;
    }
    .link-url {
      display:flex; align-items:center; gap: 8px;
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      background: var(--md-surface-container);
      padding: 8px 12px; border-radius: var(--r-full);
      color: var(--md-on-surface);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-url .accent { color: var(--md-primary); font-weight: 500; }

    /* People sidebar */
    .right-pane {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 1280px) {
      .right-pane { grid-template-columns: 1fr; }
    }

    .ppl-panel {
      background: var(--md-surface-container-low);
      border-radius: var(--r-xl);
      padding: 24px;
    }
    .ppl-panel h3 {
      font-size: 16px; font-weight: 500;
      margin-bottom: 16px;
      color: var(--md-on-surface);
    }
    .ppl-row {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .ppl-row:last-of-type { border: none; padding-bottom: 0; }
    .ppl-row .av {
      width: 40px; height: 40px; border-radius: 50%;
      display:flex; align-items:center; justify-content:center;
      font-weight: 600; font-size: 13px;
      position: relative;
      flex-shrink: 0;
    }
    .ppl-row .av .online {
      position: absolute; bottom: -1px; right: -1px;
      width: 12px; height: 12px;
      border-radius: 50%; background: var(--md-success);
      border: 2px solid var(--md-surface-container-low);
    }
    .ppl-row .av .online.off { background: var(--md-outline); }
    .ppl-row .nm { font-size: 14px; color: var(--md-on-surface); margin-bottom: 2px; font-weight: 500; }
    .ppl-row .meta { font-size: 12px; color: var(--md-on-surface-variant); }
    .ppl-row .count { margin-left: auto; font-size: 12px; color: var(--md-on-surface-variant); }

    /* Stat tiles */
    .stat-tiles {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 24px;
    }
    .stat-tile {
      padding: 20px 22px;
      border-radius: var(--r-lg);
      background: var(--md-surface-container-low);
    }
    .stat-tile.accent {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
    }
    .stat-tile .k {
      font-size: 13px;
      color: var(--md-on-surface-variant);
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
      font-weight: 500;
    }
    .stat-tile.accent .k { color: var(--md-on-primary-container); opacity: .85; }
    .stat-tile .v {
      font-size: 36px;
      font-weight: 500;
      line-height: 44px;
      letter-spacing: 0;
    }
    .stat-tile.accent .v { color: var(--md-on-primary-container); }
    .stat-tile .d {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      margin-top: 6px;
    }
    .stat-tile.accent .d { color: var(--md-on-primary-container); opacity: .85; }
    .stat-tile .d .pos { color: var(--md-success); font-weight: 600; }
  </style>
</head>
<body>
<div id="root"></div>

<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║ SERVER PAYLOAD (Shared.html)                                     ║
  ╠══════════════════════════════════════════════════════════════════╣
  ║ JSON-схема:                                                      ║
  ║   {                                                              ║
  ║     "tabs":    [{ key, label, count, icon }, ...],               ║
  ║     "stats":   [{ k, v, d, ic, accent? }, ...],                  ║
  ║     "shares":  [{ kind, ext, name, path, owner, ppl, count,      ║
  ║                   shared, perm, size, expires? }, ...],          ║
  ║     "links":   [{ name, url, exp, clicks, kind, ext, pw,         ║
  ║                   expired? }, ...],                              ║
  ║     "people":  [{ nm, mail, tone, in, online, count }, ...],     ║
  ║     "byMeCount":   21,                                           ║
  ║     "withMeCount": 34,                                           ║
  ║     "linksMeta":   "12 ссылок · 2 истекают в 7 дней"             ║
  ║   }                                                              ║
  ╚══════════════════════════════════════════════════════════════════╝
-->
<script type="application/json" id="server-data">
{{{ page_data_json }}}
</script>

<script type="text/babel">
const { AppShell, Icon } = window;

function loadServerData() {
  try {
    const raw = document.getElementById('server-data')?.textContent?.trim();
    if (!raw || raw.startsWith('{{')) return null;
    return JSON.parse(raw);
  } catch (e) { console.warn('server-data parse failed', e); return null; }
}
const SERVER_DATA = loadServerData();

const TABS = SERVER_DATA?.tabs ?? [
  {key:'with-me', label:'Доступно мне', count: 34, icon:'share'},
  {key:'by-me', label:'Я открыл доступ', count: 21, icon:'user'},
  {key:'links', label:'Публичные ссылки', count: 12, icon:'link'},
  {key:'pending', label:'Запросы', count: 3, icon:'clock'},
];

const SHARES_WITH_ME = SERVER_DATA?.shares ?? [
  {kind:'folder', ext:'DIR', name:'Команда дизайна 2026', path:'lena.s@cloud.bark.io · /design-2026', owner:{nm:'Лена С.', tone:'g', in:'ЛС'}, ppl:[['АК','p'],['ДО','v'],['МВ','b'],['+4','n']], count:'7 чел.', shared:'14 мая', perm:'editor', size:'4,2 ГБ'},
  {kind:'pdf', ext:'PDF', name:'Контракт_2026_BarkCloud_v3.pdf', path:'lena.s@cloud.bark.io', owner:{nm:'Лена С.', tone:'g', in:'ЛС'}, ppl:[['ЛС','g'],['АК','p'],['МВ','b'],['+1','n']], count:'4 чел.', shared:'Вчера', perm:'viewer', size:'2,4 МБ', expires:'31 мая'},
  {kind:'code', ext:'GIT', name:'cloud-sync-engine (репозиторий)', path:'dima.o@cloud.bark.io · /repos/', owner:{nm:'Дима О.', tone:'v', in:'ДО'}, ppl:[['ДО','v'],['АК','p']], count:'2 чел.', shared:'2 дня', perm:'editor', size:'186 МБ'},
  {kind:'doc', ext:'XLS', name:'Бюджет-проекта-2026.xlsx', path:'lena.s@cloud.bark.io', owner:{nm:'Лена С.', tone:'g', in:'ЛС'}, ppl:[['ЛС','g'],['АК','p'],['МВ','b'],['+2','n']], count:'5 чел.', shared:'10 мая', perm:'editor', size:'1,1 МБ'},
  {kind:'vid', ext:'MP4', name:'all-hands-Q2-recording.mp4', path:'marina.v@cloud.bark.io', owner:{nm:'Марина В.', tone:'b', in:'МВ'}, ppl:[['МВ','b'],['АК','p'],['+12','n']], count:'14 чел.', shared:'5 мая', perm:'viewer', size:'2,8 ГБ'},
  {kind:'folder', ext:'DIR', name:'Фото, корпоратив 2025', path:'hr@cloud.bark.io', owner:{nm:'HR · BarkCloud', tone:'r', in:'HR'}, ppl:[['HR','r'],['+24','n']], count:'24 чел.', shared:'3 мес', perm:'viewer', size:'18,4 ГБ'},
];

const LINKS = SERVER_DATA?.links ?? [
  {name:'Презентация Q2 (финал).pdf', url:'cloud.bark.io/s/8x4F2-mPp9aQ', perm:'link', exp:'31 мая 2026', clicks:42, kind:'pdf', ext:'PDF', pw:true},
  {name:'photos-bali-2026.zip', url:'cloud.bark.io/s/zT7uK1-vQ8wN', perm:'link', exp:'7 дней', clicks:8, kind:'zip', ext:'ZIP', pw:false},
  {name:'BarkCloud · Pitch Deck.pdf', url:'cloud.bark.io/s/Ld3HmQ-w4xRr', perm:'link', exp:'Бессрочно', clicks:312, kind:'pdf', ext:'PDF', pw:true},
  {name:'Отчёт_Q1.xlsx', url:'cloud.bark.io/s/9j6Vp2-tNc1k', perm:'link', exp:'Истёк · 12 мая', clicks:14, kind:'doc', ext:'XLS', pw:false, expired: true},
];

const STATS = SERVER_DATA?.stats ?? [
  {k:'Доступно мне', v:'34', d:<>+<span className="pos">3</span> за неделю</>, ic:'share', accent: true},
  {k:'Я открыл', v:'21', d:'+1 за неделю', ic:'user'},
  {k:'Активных ссылок', v:'12', d:'2 истекают в 7 дн.', ic:'link'},
  {k:'Запросов в ожидании', v:'3', d:'1 новый сегодня', ic:'bell'},
];

const PEOPLE = SERVER_DATA?.people ?? [
  {nm:'Лена С.', mail:'lena.s', tone:'g', in:'ЛС', online:true, count:'18 файлов'},
  {nm:'Дима О.', mail:'dima.o', tone:'v', in:'ДО', online:true, count:'6 файлов'},
  {nm:'Марина В.', mail:'marina.v', tone:'b', in:'МВ', online:false, count:'4 файла'},
  {nm:'HR · BarkCloud', mail:'hr', tone:'r', in:'HR', online:false, count:'3 папки'},
  {nm:'Паша М.', mail:'pasha.m', tone:'y', in:'ПМ', online:true, count:'2 файла'},
  {nm:'Аня Г.', mail:'anya.g', tone:'p', in:'АГ', online:false, count:'1 файл'},
];

const BY_ME_COUNT   = SERVER_DATA?.byMeCount   ?? 21;
const WITH_ME_COUNT = SERVER_DATA?.withMeCount ?? 34;
const LINKS_META    = SERVER_DATA?.linksMeta   ?? '12 ссылок · 2 истекают в 7 дней';
const MAIL_DOMAIN   = SERVER_DATA?.mailDomain  ?? 'cloud.bark.io';

const TONES = {
  p: ['var(--md-primary-container)','var(--md-on-primary-container)'],
  g: ['#C8E6C9','#1B5E20'],
  v: ['#D1C4E9','#311B92'],
  b: ['#BBDEFB','#0D47A1'],
  r: ['#FFCDD2','#B71C1C'],
  y: ['#FFE0B2','#6D4C00'],
  n: ['var(--md-surface-container-highest)','var(--md-on-surface-variant)'],
};

function ShareCard({ s }) {
  return (
    <div className="share-card">
      <div className={"file-icon " + s.kind}>{s.ext}</div>
      <div className="main-col">
        <div className="name">{s.name}</div>
        <div className="path">{s.path}</div>
      </div>
      <div className="ppl-col">
        <div className="avatars">
          {s.ppl.map((a, i) => {
            const [bg, fg] = TONES[a[1]];
            return <div key={i} className="av" style={{background:bg, color:fg}}>{a[0]}</div>;
          })}
        </div>
        <div className="ppl-text"><span className="b">{s.count}</span></div>
      </div>
      <div className="meta-col">
        <div className="meta-line"><span className="k">Размер</span> {s.size}</div>
        <div className="meta-line"><span className="k">Открыто</span> {s.shared}</div>
        {s.expires && <div className="meta-line" style={{color:'var(--md-warning)'}}><span className="k">Истекает</span> {s.expires}</div>}
      </div>
      <div className="act-col">
        <span className={"perm-badge " + s.perm}>
          {s.perm === 'editor' ? <Icon.pencil size={12}/> : <Icon.eye size={12}/>}
          {s.perm === 'editor' ? 'Редактор' : 'Просмотр'}
        </span>
      </div>
    </div>
  );
}

function LinkCard({ l }) {
  return (
    <div className="link-card" style={l.expired ? {opacity: .55} : {}}>
      <div className="link-icon"><Icon.link size={22}/></div>
      <div>
        <div style={{fontSize:15, fontWeight:500, color:'var(--md-on-surface)', marginBottom:8}}>{l.name}</div>
        <div className="link-url"><Icon.link size={12}/><span><span className="accent">{l.url.split('/')[0]}/{l.url.split('/')[1]}/</span>{l.url.split('/')[2]}</span></div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        <div className="meta-line"><span className="k">Кликов</span> <span style={{color:'var(--md-on-surface)', fontWeight:500}}>{l.clicks}</span></div>
        <div className="meta-line"><span className="k">Истекает</span> <span style={{color: l.expired ? 'var(--md-error)' : 'var(--md-on-surface)'}}>{l.exp}</span></div>
        {l.pw && <div className="meta-line" style={{color:'var(--md-success)'}}><Icon.lock size={12}/> С паролем</div>}
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:4}}>
        <button className="icon-btn" title="Скопировать"><Icon.link size={18}/></button>
        <button className="icon-btn" title="Ещё"><Icon.more size={18}/></button>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = React.useState('with-me');

  const actions = (
    <>
      <button className="btn outlined"><Icon.link size={16}/> Новая ссылка</button>
      <button className="btn primary"><Icon.plus size={16}/> Поделиться</button>
    </>
  );

  return (
    <AppShell
      page="shared"
      kicker={<><span>Совместное</span><span className="sep">/</span><span className="cur">Общие</span></>}
      title="Общий доступ"
      actions={actions}
    >
      {/* Stats */}
      <div className="stat-tiles">
        {STATS.map((s, i) => {
          const Ic = Icon[s.ic];
          return (
            <div key={i} className={"stat-tile" + (s.accent ? ' accent' : '')}>
              <div className="k"><Ic size={16}/> {s.k}</div>
              <div className="v">{s.v}</div>
              <div className="d">{s.d}</div>
            </div>
          );
        })}
      </div>

      {/* Tabs */}
      <div className="sh-tabs">
        {TABS.map(t => {
          const Ic = Icon[t.icon];
          return (
            <button key={t.key} className={"sh-tab" + (tab === t.key ? ' on' : '')} onClick={() => setTab(t.key)}>
              <Ic size={18}/>
              {t.label}
              <span className="count">{t.count}</span>
            </button>
          );
        })}
      </div>

      {/* Two-column layout */}
      <div className="right-pane">
        <div>
          {tab === 'links' ? (
            <>
              <div className="section-head">
                <h2>Активные публичные ссылки</h2>
                <div className="meta">{LINKS_META}</div>
              </div>
              {LINKS.map((l, i) => <LinkCard key={i} l={l}/>)}
            </>
          ) : (
            <>
              <div className="section-head">
                <h2>{tab === 'by-me' ? 'Файлы, которые я открыл' : tab === 'pending' ? 'Запросы доступа' : 'Файлы, доступные мне'}</h2>
                <div className="meta">{SHARES_WITH_ME.length} из {tab === 'by-me' ? BY_ME_COUNT : WITH_ME_COUNT} · сорт. по дате</div>
              </div>
              {SHARES_WITH_ME.map((s, i) => <ShareCard key={i} s={s}/>)}
            </>
          )}
        </div>

        {/* People panel */}
        <div className="ppl-panel">
          <h3>Часто работаете вместе</h3>
          {PEOPLE.map((p, i) => {
            const [bg, fg] = TONES[p.tone];
            return (
              <div key={i} className="ppl-row">
                <div className="av" style={{background:bg, color:fg}}>
                  {p.in}
                  <span className={"online" + (p.online ? '' : ' off')}/>
                </div>
                <div>
                  <div className="nm">{p.nm}</div>
                  <div className="meta">{p.mail}@{MAIL_DOMAIN}</div>
                </div>
                <div className="count">{p.count}</div>
              </div>
            );
          })}
          <button className="btn outlined" style={{width:'100%', marginTop: 16, justifyContent:'center'}}>
            <Icon.plus size={16}/> Пригласить
          </button>
        </div>
      </div>
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
