<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarkCloud — Корзина</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600;8..144,700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css"/>
  <script>
    /* Тема применяется до рендера, чтобы не было мигания. Источник — localStorage (bark_theme: light|dark|auto). */
    (function(){try{var t=localStorage.getItem('bark_theme')||'auto';var d=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <style>
    .content { padding: 0 !important; }
    .trash-shell { height: 100%; padding: 4px 16px 16px; }
    .trash-main {
      display:flex; flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: var(--md-surface-container-low);
      border-radius: var(--r-xl);
    }
    .trash-bar {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 24px;
      color: var(--md-on-surface-variant);
      font-size: 14px;
    }
    .trash-bar .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .trash-list { flex: 1; overflow: auto; }

    .ftable { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ftable thead th {
      position: sticky; top: 0;
      background: var(--md-surface-container-low);
      padding: 12px 16px; text-align: left;
      font-size: 12px; color: var(--md-on-surface-variant);
      border-bottom: 1px solid var(--md-outline-variant);
      font-weight: 500; white-space: nowrap;
    }
    .ftable thead th:first-child { padding-left: 24px; }
    .ftable thead th:last-child { padding-right: 24px; text-align: right; }
    .ftable tbody tr { transition: background var(--d-short); }
    .ftable tbody tr:hover { background: color-mix(in srgb, var(--md-on-surface) 6%, transparent); }
    .ftable td {
      padding: 12px 16px; vertical-align: middle;
      color: var(--md-on-surface);
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .ftable td:first-child { padding-left: 24px; }
    .ftable td:last-child { padding-right: 24px; text-align: right; }
    .ftable td.name { display: flex; align-items: center; gap: 14px; }

    .file-icon {
      width: 40px; height: 40px; border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 10px; font-weight: 600; letter-spacing: .3px;
    }
    .file-icon.img    { background: #C8E6C9; color: #1B5E20; }
    .file-icon.vid    { background: #D1C4E9; color: #311B92; }
    .file-icon.doc    { background: #BBDEFB; color: #0D47A1; }
    .file-icon.pdf    { background: #FFCDD2; color: #B71C1C; }
    .file-icon.zip    { background: #FFE0B2; color: #6D4C00; }
    .file-icon.code   { background: #B2DFDB; color: #004D40; }
    .file-icon.audio  { background: #F8BBD0; color: #880E4F; }

    .file-name-col .fn { color: var(--md-on-surface); font-weight: 500; }
    .file-name-col .meta { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 2px; }
    td.size, td.when { font-size: 13px; color: var(--md-on-surface-variant); }
    td.when .left { font-size: 11px; color: var(--md-outline); margin-top: 2px; display: block; }

    .row-actions { display: inline-flex; gap: 2px; opacity: 0; transition: opacity var(--d-short); }
    tr:hover .row-actions { opacity: 1; }
    .row-actions button {
      width: 36px; height: 36px; background: transparent; border: none; border-radius: 50%;
      color: var(--md-on-surface-variant);
      display:flex; align-items:center; justify-content:center; cursor: pointer;
      transition: background var(--d-short), color var(--d-short);
    }
    .row-actions button:hover { background: color-mix(in srgb, var(--md-on-surface) 10%, transparent); color: var(--md-on-surface); }
    .row-actions button.danger:hover { background: color-mix(in srgb, var(--md-error) 14%, transparent); color: var(--md-error); }
  </style>
</head>
<body>
<div id="root"></div>

<script type="application/json" id="server-data">
{{{ page_data_json }}}
</script>

<script type="text/babel">
const { AppShell, Icon, apiGet, apiPost, MediaThumb, useToast, EmptyState, Loading, plural } = window;

const ruDate = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
function fmtDate(iso) { return iso ? ruDate.format(new Date(iso)) : '—'; }
function kindLabel(k) { return k === 'photo' ? 'фото' : k === 'video' ? 'видео' : k === 'audio' ? 'аудио' : k === 'document' ? 'документ' : 'файл'; }

/* Сколько осталось до окончательного удаления */
function purgeLeft(iso) {
  if (!iso) return '—';
  const ms = new Date(iso) - new Date();
  if (ms <= 0) return 'скоро';
  const days = Math.floor(ms / 86400000);
  if (days >= 1) return `через ${days} ${plural(days, 'день', 'дня', 'дней')}`;
  const hours = Math.max(1, Math.floor(ms / 3600000));
  return `через ${hours} ${plural(hours, 'час', 'часа', 'часов')}`;
}

function TrashRow({ item, onRestore, onPurge }) {
  const m = item.media || {};
  return (
    <tr>
      <td className="name">
        <div className={"file-icon " + (m.iconKind || 'doc')}>{m.ext || 'FILE'}</div>
        <div className="file-name-col"><div className="fn">{item.name}</div><div className="meta">{kindLabel(m.kind)}</div></div>
      </td>
      <td className="size">{m.sizeLabel || '—'}</td>
      <td className="when">{fmtDate(item.deletedAt)}</td>
      <td className="when">{purgeLeft(item.purgeAt)}<span className="left">{fmtDate(item.purgeAt)}</span></td>
      <td>
        <span className="row-actions">
          <button title="Восстановить" onClick={() => onRestore(item)}><Icon.refresh size={18}/></button>
          <button className="danger" title="Удалить навсегда" onClick={() => onPurge(item)}><Icon.trash size={18}/></button>
        </span>
      </td>
    </tr>
  );
}

function App() {
  const [items, setItems] = React.useState(null);
  const [toastNode, toast] = useToast();

  const load = React.useCallback(() => {
    setItems(null);
    apiGet('/api/cloud/trash')
      .then(d => setItems(d.items || []))
      .catch(e => { toast(e.message, 'err'); setItems([]); });
  }, [toast]);
  React.useEffect(load, [load]);

  async function restore(item) {
    try { await apiPost('/api/cloud/trash/restore', { entryId: item.entryId }); load(); toast('Восстановлено'); }
    catch (e) { toast(e.message, 'err'); }
  }
  async function purge(item) {
    if (!window.confirm(`Удалить «${item.name}» навсегда? Это действие необратимо.`)) return;
    try { await apiPost('/api/cloud/trash/purge', { entryId: item.entryId }); load(); toast('Удалено навсегда'); }
    catch (e) { toast(e.message, 'err'); }
  }
  async function empty() {
    if (!items || !items.length) return;
    if (!window.confirm('Очистить корзину? Все файлы будут удалены навсегда.')) return;
    try { await apiPost('/api/cloud/trash/empty', {}); load(); toast('Корзина очищена'); }
    catch (e) { toast(e.message, 'err'); }
  }

  const empty_ = items && !items.length;

  const actions = (
    <button className="btn outlined" onClick={empty} disabled={!items || !items.length}>
      <Icon.trash size={16}/> Очистить корзину
    </button>
  );

  return (
    <AppShell page="trash"
      kicker={<><span>Прочее</span><span className="sep">/</span><span className="cur">Корзина</span></>}
      title="Корзина" actions={actions}>
      {toastNode}
      <div className="trash-shell">
        <div className="trash-main">
          <div className="trash-bar">
            <span>Удалённые файлы хранятся 14 дней, затем удаляются навсегда.</span>
          </div>
          <div className="trash-list">
            {items === null ? <Loading/> :
              empty_ ? <EmptyState icon="trash" title="Корзина пуста" hint="Удалённые файлы появятся здесь и будут храниться 14 дней."/>
                : <table className="ftable">
                  <thead><tr>
                    <th>Имя</th>
                    <th style={{ width: 120 }}>Размер</th>
                    <th style={{ width: 150 }}>Удалён</th>
                    <th style={{ width: 180 }}>Будет удалён</th>
                    <th style={{ width: 110 }}></th>
                  </tr></thead>
                  <tbody>
                    {items.map(it => <TrashRow key={it.entryId} item={it} onRestore={restore} onPurge={purge}/>)}
                  </tbody>
                </table>}
          </div>
        </div>
      </div>
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
