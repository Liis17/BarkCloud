syntax = "proto3";

option csharp_namespace = "BarkCloud.Proto.Files";

import "google/protobuf/timestamp.proto";

package barkcloud.files;

service FilesApi {
  rpc GetUploadUrl(GetUploadUrlRequest) returns(GetUploadUrlResponse); // Получить ссылку для загрузки файла

  rpc GetTempDownloadUrl(GetTempDownloadUrlRequest) returns(GetTempDownloadUrlResponse); // Получить ссылку для скачивания файла

  rpc CheckFileHash(CheckFileHashRequest) returns(CheckFileHashResponse); // Проверить существует ли файл с таким хешем

  rpc CheckFileHashes(CheckFileHashesRequest) returns(CheckFileHashesResponse); // Пакетная проверка наличия файлов по списку SHA256-хешей (без побочных эффектов)

  rpc GetUserStorageInfo(GetUserStorageInfoRequest) returns(GetUserStorageInfoResponse); // Получить информацию о хранилище пользователя
}

service CloudApi {
  rpc CreateDirectory      (CreateDirectoryRequest)      returns (DirectoryInfo);            // Создать папку
  rpc RenameDirectory      (RenameDirectoryRequest)      returns (CloudEmpty);               // Переименовать папку
  rpc MoveDirectory        (MoveDirectoryRequest)        returns (CloudEmpty);               // Переместить папку
  rpc DeleteDirectory      (DeleteDirectoryRequest)      returns (CloudEmpty);               // Удалить папку рекурсивно
  rpc ListDirectory        (ListDirectoryRequest)        returns (DirectoryListing);         // Листинг содержимого папки (только метаданные)
  rpc ListDirectoryDetailed(ListDirectoryRequest)        returns (DirectoryListingDetailed); // Листинг с полной информацией о каждом файле (URL, превью, размеры)

  rpc AttachFile           (AttachFileRequest)           returns (CloudEmpty);               // Привязать загруженный файл к папке
  rpc RenameFileEntry      (RenameFileEntryRequest)      returns (CloudEmpty);               // Переименовать запись о файле
  rpc MoveFileEntry        (MoveFileEntryRequest)        returns (CloudEmpty);               // Переместить запись о файле
  rpc DeleteFileEntry      (DeleteFileEntryRequest)      returns (CloudEmpty);               // Удалить запись о файле

  rpc ListUserImages       (ListUserImagesRequest)       returns (ListUserImagesResponse);   // [DEPRECATED] Все изображения пользователя; используйте ListUserMedia(PHOTO)
  rpc ListUserMedia        (ListUserMediaRequest)        returns (ListUserMediaResponse);     // Медиа пользователя по типу (фото / видео) от новых к старым (cursor pagination)

  rpc GetPath              (GetPathRequest)              returns (PathResponse);             // Построить путь до объекта в иерархии

  rpc SetVideoThumbnail    (SetVideoThumbnailRequest)    returns (CloudEmpty);               // Заменить превью видео загруженной картинкой

  // ───────── Корзина ─────────
  rpc ListTrash            (ListTrashRequest)            returns (ListTrashResponse);        // Список файлов в корзине (от новых к старым)
  rpc RestoreFromTrash     (RestoreFromTrashRequest)     returns (CloudEmpty);               // Восстановить файл из корзины
  rpc DeleteFromTrash      (DeleteFromTrashRequest)      returns (CloudEmpty);               // Удалить файл из корзины навсегда (немедленно)
  rpc EmptyTrash           (EmptyTrashRequest)           returns (CloudEmpty);               // Очистить корзину целиком

  // ───────── Избранное ─────────
  rpc AddFavorite          (AddFavoriteRequest)          returns (CloudEmpty);               // Добавить файл в избранное
  rpc RemoveFavorite       (RemoveFavoriteRequest)       returns (CloudEmpty);               // Убрать файл из избранного
  rpc ListFavorites        (ListFavoritesRequest)        returns (ListFavoritesResponse);    // Все избранные файлы (от новых к старым)
}

service FilesServerApi {
  rpc GetFileData(GetFileDataRequest) returns(GetFileDataResponse); // Получить информацию о загруженном файле

  rpc GetFilesData(GetFilesDataRequest) returns(GetFilesDataResponse); // Получить информацию о загруженных файлах

  rpc GetUserStorageInfoServer(GetUserStorageInfoServerRequest) returns(GetUserStorageInfoResponse); // Получить информацию о хранилище пользователя (для админ-панели)

  rpc UploadAvatarServer(UploadAvatarServerRequest) returns(UploadAvatarServerResponse); // Загрузить аватарку пользователя (для админ-панели)
}

service AlbumApi {
  rpc CreateAlbum         (CreateAlbumRequest)         returns (AlbumInfo);            // Создать альбом
  rpc UpdateAlbum         (UpdateAlbumRequest)         returns (AlbumInfo);            // Изменить имя / описание / обложку
  rpc DeleteAlbum         (DeleteAlbumRequest)         returns (CloudEmpty);           // Удалить альбом
  rpc AddItemsToAlbum     (AddItemsToAlbumRequest)     returns (CloudEmpty);           // Добавить фото/видео в альбом
  rpc RemoveItemsFromAlbum(RemoveItemsFromAlbumRequest) returns (CloudEmpty);          // Убрать фото/видео из альбома
  rpc ListAlbums          (ListAlbumsRequest)          returns (ListAlbumsResponse);   // Список альбомов (обложка / описание / счётчик)
  rpc ListAlbumItems      (ListAlbumItemsRequest)      returns (ListAlbumItemsResponse); // Содержимое альбома (фото/видео с превью)
}

message GetTempDownloadUrlRequest {
  repeated string file_ids = 1; // Идентификаторы файлов
}

message GetTempDownloadUrlResponse {

  message DownloadFileData {
    string file_id = 1; // идентификатор файла
    string url = 2; // ссылка на загрузку
    string preview_url = 3; // ссылка на превью файла
  }

  repeated DownloadFileData file_urls = 1; // ссылки на файлы

}

message GetFilesDataRequest {
  repeated string file_ids = 1; // Идентификаторы файлов
}

message GetFilesDataResponse {
  repeated UploadFileInfo files_infos = 1; // Информация о файлах
}

message GetFileDataRequest {
  string file_id = 1;
}

message GetFileDataResponse {
    UploadFileInfo file_info = 1;
}

message UploadFileInfo {
  string id = 1; // Идентификатор файла
  repeated int64 uploaders = 2; // Идентификаторы пользователей загрузивших файл
  google.protobuf.Timestamp created_at = 3; // Время создания
  google.protobuf.Timestamp uploaded_at = 4; // время загрузки
  string etag = 5; // Etag S3
  UploadFileType type = 6; // Тип загруженного файла
  string file_name = 7; // Имя файла
  string file_url = 8; // Ссылка на загрузку файла
  string preview_url = 9; // [DEPRECATED] Ссылка на «главное» превью; см. previews для мультиразмерных
  int64 file_size = 10; // Размер файла в байтах
  repeated FilePreviewInfo previews = 11; // Превью изображения/видео (если есть) — 128 / 512 / 1024 по ширине
  int32 image_width = 12; // Ширина изображения/кадра в пикселях (0 если не медиа)
  int32 image_height = 13; // Высота изображения/кадра в пикселях (0 если не медиа)
  MediaKind media_kind = 14; // Категория медиа (фото / видео / документ / аудио)
}

enum MediaKind {
  MEDIA_KIND_OTHER = 0;
  MEDIA_KIND_PHOTO = 1;
  MEDIA_KIND_VIDEO = 2;
  MEDIA_KIND_DOCUMENT = 3;
  MEDIA_KIND_AUDIO = 4;
}

message FilePreviewInfo {
  string preview_file_id = 1; // ID отдельного UploadFile с байтами превью
  int32 target_width = 2;     // Запрошенная ширина (128 / 512 / 1024)
  int32 actual_width = 3;     // Фактическая ширина после ресайза
  int32 actual_height = 4;    // Фактическая высота после ресайза
  string preview_url = 5;     // Публичная ссылка на скачивание превью
}

message GetUploadUrlRequest {
  UploadFileType file_type = 1; // Тип загружаемого файла
}

message GetUploadUrlResponse {
  string url = 1; // адрес для загрузки файла
  string file_id = 2; // идентификатор файла
}

enum UploadFileType {
  UPLOAD_FILE_TYPE_UNKNOWN = 0;

  USER_AVATAR = 1; // Аватарка пользователя

  CLOUD_FILE = 2; // Файл в облачном хранилище пользователя
}

message GetUserStorageInfoServerRequest {
  int64 user_id = 1;
}

message UploadAvatarServerRequest {
  bytes image_data = 1;   // содержимое файла
  string filename = 2;    // имя файла
  int64 user_id = 3;      // идентификатор пользователя
}

message UploadAvatarServerResponse {
  string file_url = 1;          // ссылка на полное изображение
  string preview_url = 2;       // ссылка на превью
  string file_id = 3;           // идентификатор файла
}

message CheckFileHashRequest {
  string file_hash = 1; // SHA256 хеш файла (hex строка, 64 символа)
}

message CheckFileHashResponse {
  string file_id = 1; // Идентификатор файла если найден, пустая строка если не найден
}

message CheckFileHashesRequest {
  repeated string file_hashes = 1; // SHA256 хеши файлов (hex строки по 64 символа)
}

message HashCheckResult {
  string file_hash = 1; // исходный хеш (нормализован к нижнему регистру)
  bool exists = 2;      // true — файл с таким хешем есть в хранилище
}

message CheckFileHashesResponse {
  repeated HashCheckResult results = 1; // результат по каждому уникальному валидному хешу
}

message GetUserStorageInfoRequest {
}

// ============ CloudApi messages ============

message CloudEmpty {}

message DirectoryInfo {
  string id = 1; // Идентификатор папки
  string parent_id = 2; // Идентификатор родительской папки, пустая строка для корня
  string name = 3; // Имя папки
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message FileEntryInfo {
  string id = 1; // Идентификатор записи в иерархии
  string directory_id = 2; // Папка, в которой лежит запись
  string file_id = 3; // Идентификатор реального UploadFile
  string name = 4; // Имя файла в иерархии
  google.protobuf.Timestamp created_at = 5;
}

message CreateDirectoryRequest {
  string parent_id = 1; // Пустая строка означает корень владельца
  string name = 2;
}

message RenameDirectoryRequest {
  string directory_id = 1;
  string new_name = 2;
}

message MoveDirectoryRequest {
  string directory_id = 1;
  string new_parent_id = 2; // Пустая строка означает перемещение в корень
}

message DeleteDirectoryRequest {
  string directory_id = 1;
}

message ListDirectoryRequest {
  optional string directory_id = 1; // Не указан или пустой = корень владельца
}

message DirectoryListing {
  repeated DirectoryInfo subdirs = 1;
  repeated FileEntryInfo files = 2;
}

message AttachFileRequest {
  string directory_id = 1; // Пустая строка означает корень владельца
  string file_id = 2;
  string name = 3;
}

message RenameFileEntryRequest {
  string entry_id = 1;
  string new_name = 2;
}

message MoveFileEntryRequest {
  string entry_id = 1;
  string new_directory_id = 2; // Пустая строка означает корень владельца
}

message DeleteFileEntryRequest {
  string entry_id = 1;
}

// ============ Детальный листинг и галерея ============

message FileEntryDetailed {
  FileEntryInfo entry = 1; // id / directory_id / file_id / name / created_at
  UploadFileInfo file = 2; // полная информация о блобе (URL, размеры, превью)
}

message DirectoryListingDetailed {
  repeated DirectoryInfo subdirs = 1;
  repeated FileEntryDetailed files = 2;
}

message ListUserImagesRequest {
  int32 limit = 1;                                  // 1..200, default 50
  google.protobuf.Timestamp cursor_created_at = 2;  // exclusive; пусто = с самой свежей загрузки
  string cursor_file_id = 3;                        // tie-breaker для стабильной cursor-пагинации
}

message UserImageItem {
  UploadFileInfo file = 1;          // карточка по UploadFile
  int32 entries_count = 2;          // сколько копий записи у владельца
  repeated string entry_names = 3;  // имена в папках, до 5 шт.
  repeated string entry_ids = 4;    // id записей каталога владельца (для rename/delete из галереи)
}

message ListUserImagesResponse {
  repeated UserImageItem items = 1;
  google.protobuf.Timestamp next_cursor_created_at = 2; // пусто = больше нет страниц
  string next_cursor_file_id = 3;
}

message ListUserMediaRequest {
  MediaKind kind = 1;                               // PHOTO или VIDEO — какой тип медиа листать
  int32 limit = 2;                                  // 1..200, default 50
  google.protobuf.Timestamp cursor_created_at = 3;  // exclusive; пусто = с самой свежей загрузки
  string cursor_file_id = 4;                        // tie-breaker для стабильной cursor-пагинации
}

message ListUserMediaResponse {
  repeated UserImageItem items = 1;
  google.protobuf.Timestamp next_cursor_created_at = 2; // пусто = больше нет страниц
  string next_cursor_file_id = 3;
}

message SetVideoThumbnailRequest {
  string video_file_id = 1;         // идентификатор видео-файла
  string source_image_file_id = 2;  // загруженная пользователем картинка-кадр для нового превью
}

// ============ Корзина ============

message ListTrashRequest {
  int32 limit = 1;                                  // 1..200, default 50
  google.protobuf.Timestamp cursor_deleted_at = 2;  // exclusive; пусто = с самых свежеудалённых
  string cursor_entry_id = 3;                       // tie-breaker для стабильной cursor-пагинации
}

message TrashEntry {
  FileEntryInfo entry = 1;                  // id / directory_id / file_id / name / created_at
  UploadFileInfo file = 2;                  // полная информация о блобе (URL, размеры, превью)
  google.protobuf.Timestamp deleted_at = 3; // когда перемещён в корзину
  google.protobuf.Timestamp purge_at = 4;   // когда будет удалён окончательно
}

message ListTrashResponse {
  repeated TrashEntry items = 1;
  google.protobuf.Timestamp next_cursor_deleted_at = 2; // пусто = больше нет страниц
  string next_cursor_entry_id = 3;
}

message RestoreFromTrashRequest {
  string entry_id = 1;
}

message DeleteFromTrashRequest {
  string entry_id = 1;
}

message EmptyTrashRequest {
}

// ============ Избранное ============

message AddFavoriteRequest {
  string file_id = 1; // Идентификатор реального UploadFile (фото / видео / документ)
}

message RemoveFavoriteRequest {
  string file_id = 1;
}

message ListFavoritesRequest {
  int32 limit = 1;                                    // 1..200, default 50
  google.protobuf.Timestamp cursor_favorited_at = 2;  // exclusive; пусто = с самых свежих
  string cursor_file_id = 3;                          // tie-breaker для стабильной cursor-пагинации
}

message FavoriteEntry {
  UploadFileInfo file = 1;                    // полная информация о блобе (URL, размеры, превью)
  google.protobuf.Timestamp favorited_at = 2; // когда файл добавлен в избранное
}

message ListFavoritesResponse {
  repeated FavoriteEntry items = 1;
  google.protobuf.Timestamp next_cursor_favorited_at = 2; // пусто = больше нет страниц
  string next_cursor_file_id = 3;
}

message GetPathRequest {
  oneof target {
    string directory_id = 1;
    string entry_id = 2;
  }
}

message PathSegment {
  string id = 1; // Идентификатор папки сегмента
  string name = 2; // Имя сегмента
}

message PathResponse {
  // Сегменты от корня до целевого объекта (не включая сам объект).
  // Для объекта в корне — пустой список.
  repeated PathSegment segments = 1;
  // Полный текстовый путь, например /A/B/C/file.txt
  string full_path = 2;
}

message GetUserStorageInfoResponse {
  message StorageByType {
    UploadFileType file_type = 1; // Тип файла
    int64 used_storage = 2; // Занятое пространство для данного типа в байтах
  }

  int64 total_used_storage = 1; // Общее занятое пространство в байтах
  int64 storage_limit = 2; // Лимит хранилища в байтах
  repeated StorageByType storage_by_types = 3; // Использованное пространство по типам файлов
}

// ============ AlbumApi messages ============

message AlbumInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  string cover_file_id = 4;       // ID файла-обложки (пусто, если нет)
  string cover_preview_url = 5;   // URL превью обложки (пусто, если нет)
  int32 items_count = 6;          // Количество элементов в альбоме
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateAlbumRequest {
  string name = 1;
  string description = 2;
}

message UpdateAlbumRequest {
  string album_id = 1;
  optional string name = 2;          // не задано = не менять
  optional string description = 3;   // не задано = не менять
  optional string cover_file_id = 4; // не задано = не менять; пустая строка = сбросить обложку
}

message DeleteAlbumRequest {
  string album_id = 1;
}

message AddItemsToAlbumRequest {
  string album_id = 1;
  repeated string file_ids = 2;
}

message RemoveItemsFromAlbumRequest {
  string album_id = 1;
  repeated string file_ids = 2;
}

message ListAlbumsRequest {
  int32 limit = 1;                                  // 1..200, default 50
  google.protobuf.Timestamp cursor_updated_at = 2;  // exclusive; пусто = с самых свежих
  string cursor_album_id = 3;                       // tie-breaker
}

message ListAlbumsResponse {
  repeated AlbumInfo albums = 1;
  google.protobuf.Timestamp next_cursor_updated_at = 2; // пусто = больше нет страниц
  string next_cursor_album_id = 3;
}

message ListAlbumItemsRequest {
  string album_id = 1;
  int32 limit = 2;                                  // 1..200, default 50
  google.protobuf.Timestamp cursor_added_at = 3;    // exclusive; пусто = с самых свежих
  string cursor_file_id = 4;                        // tie-breaker
  optional MediaKind kind_filter = 5;               // не задано = все типы
}

message AlbumItemEntry {
  UploadFileInfo file = 1;                  // полная информация о файле (URL, превью, размеры)
  google.protobuf.Timestamp added_at = 2;   // когда добавлен в альбом
}

message ListAlbumItemsResponse {
  repeated AlbumItemEntry items = 1;
  google.protobuf.Timestamp next_cursor_added_at = 2; // пусто = больше нет страниц
  string next_cursor_file_id = 3;
}
