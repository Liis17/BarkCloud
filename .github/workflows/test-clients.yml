name: Client tests

on:
  workflow_call:
    inputs:
      platform:
        description: windows, android or apple
        type: string
        required: true

permissions:
  contents: read

jobs:
  windows:
    if: ${{ inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Drive — сборка
        run: dotnet build Drive/BarkCloud.Drive.slnx -c Release
      - name: Drive — тесты
        run: dotnet test Tests/Drive/BarkCloud.Drive.Engine.Tests -c Release --no-build --logger trx --results-directory test-results
      # Builder — WPF-приложение, а его тесты проверяют Windows-пути, поэтому оба идут только здесь.
      - name: Builder — сборка
        run: dotnet build Tools/BarkCloud.Builder/BarkCloud.Builder.csproj -c Release
      - name: Builder — тесты
        run: dotnet test Tests/Tools/BarkCloud.Builder.Tests -c Release --logger trx --results-directory test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: windows-tests
          path: test-results/*.trx

  android:
    if: ${{ inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android/BarkCloud.Android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: android-tests
          path: Android/BarkCloud.Android/app/build/reports/tests/

  apple:
    if: ${{ inputs.platform == 'apple' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: BarkCloudKit tests
        run: swift test --package-path Mac/BarkCloudKit
