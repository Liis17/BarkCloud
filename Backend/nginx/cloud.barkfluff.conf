# BarkCloud — единый субдомен cloud.barkfluff.com, маршрутизация по порту.
# nginx терминирует TLS, внутрь сервисов проксирует по h2c (plaintext gRPC).
#
# Внешний порт (TLS)        ->  внутренний сервис (RunSettings:Port в конфиг-БД)
#   7020                    ->  cloud-identity:7000   (gRPC)
#   7021                    ->  cloud-users:7021      (gRPC)
#   7025                    ->  cloud-files:7025      (gRPC) + cloud-files:7026 (HTTP1 /web/)
#
# Если RunSettings:Port сервисов поменяется в БД — поправить backend-порты ниже.

# --- Identity (порт 7020) ---
server {
    listen 7020 ssl;
    http2 on;
    server_name cloud.barkfluff.com;

    ssl_certificate     /etc/nginx/certs/barkfluff.com-crt.pem;
    ssl_certificate_key /etc/nginx/certs/barkfluff.com-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $grpc_backend grpc://cloud-identity:7000;
        grpc_pass $grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}

# --- Users (порт 7021) ---
server {
    listen 7021 ssl;
    http2 on;
    server_name cloud.barkfluff.com;

    ssl_certificate     /etc/nginx/certs/barkfluff.com-crt.pem;
    ssl_certificate_key /etc/nginx/certs/barkfluff.com-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $grpc_backend grpc://cloud-users:7021;
        grpc_pass $grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}

# --- Files (порт 7025): gRPC + HTTP1 веб для скачивания/загрузки ---
server {
    listen 7025 ssl;
    http2 on;
    server_name cloud.barkfluff.com;

    ssl_certificate     /etc/nginx/certs/barkfluff.com-crt.pem;
    ssl_certificate_key /etc/nginx/certs/barkfluff.com-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 512m;

    # gRPC API (основной)
    location / {
        set $grpc_backend grpc://cloud-files:7025;
        grpc_pass $grpc_backend;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }

    # HTTP-веб: /web/upload/{id}, /web/download/{id} -> cloud-files:7026/upload|download
    location /web/ {
        set $http_backend http://cloud-files:7026;
        rewrite ^/web/(.*) /$1 break;
        proxy_pass $http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Большие файлы — буферизацию выключаем, таймауты увеличиваем
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }
}
