<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Обновление BarkCloud</title>
    <style>
        :root { color-scheme: light dark; font-family: Inter, system-ui, -apple-system, sans-serif; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #FFF8F5; color: #211A15; }
        .card { width: min(100%, 460px); box-sizing: border-box; padding: 44px 32px; text-align: center; border-radius: 28px; background: #FFF1E9; box-shadow: 0 12px 40px rgb(33 26 21 / 12%); }
        .loader { width: 52px; height: 52px; margin: 0 auto 24px; border: 4px solid #F5E5DC; border-top-color: #9A4F1E; border-radius: 50%; animation: spin 1s linear infinite; }
        h1 { margin: 0 0 10px; font-size: 25px; font-weight: 600; }
        p { margin: 0; color: #52443C; line-height: 1.5; }
        .stages { display: flex; justify-content: center; gap: 10px; margin: 26px 0 12px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #D7C2B5; }
        .dot.active { background: #9A4F1E; animation: pulse 1.4s ease-in-out infinite; }
        .hint { font-size: 12px; color: #52443C; }
        .wait-error { margin-top: 18px; color: #a23d35; font-size: 13px; line-height: 1.45; }
        .wait-error a { color: inherit; font-weight: 600; }
        .timer { display: inline-block; margin-top: 24px; padding: 8px 15px; border-radius: 999px; background: #FFDCC2; color: #341100; font-size: 14px; font-weight: 600; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 50% { transform: scale(1.45); opacity: .65; } }
        @media (prefers-color-scheme: dark) {
            body { background: #1A120D; color: #F0DFD6; }
            .card { background: #231A14; box-shadow: 0 12px 40px rgb(0 0 0 / 35%); }
            p, .hint { color: #D7C2B5; }
            .wait-error { color: #ffb4ab; }
            .loader { border-color: #52443C; border-top-color: #FFB68A; }
            .dot { background: #52443C; }
            .dot.active { background: #FFB68A; }
            .timer { background: #793709; color: #FFDCC2; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="loader" aria-hidden="true"></div>
        <h1>BarkCloud обновляется</h1>
        <p>Загружаем новый образ и пересоздаём веб-контейнер.</p>
        <div class="stages" aria-hidden="true"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
        <div class="hint">Проверяем доступность сервера каждые 3 секунды</div>
        <div class="timer"><span id="timer">0</span> сек</div>
        <p id="wait-error" class="wait-error" hidden><span id="wait-error-message">Сервер не перезапустился за 90 секунд.</span> <a href="/settings#system">Открыть раздел обслуживания</a></p>
    </main>
    <script src="/maintenance-wait.js"></script>
    <script>
        BarkCloudWait.start({ initialDelayMs: 10000, pageServerStartedAt: '{{BARKCLOUD_STARTED_AT_UTC}}', operationId: '{{BARKCLOUD_OPERATION_ID}}' });
    </script>
</body>
</html>
