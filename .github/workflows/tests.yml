name: "🧪 BarkCloud Tests"

on:
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  Определение изменённых частей репозитория.
  #  Изменения в Shared/Proto/TestKit запускают все backend-тесты.
  # ═══════════════════════════════════════════════════════════════
  changes:
    name: "Определение изменений"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      configuration: ${{ steps.filter.outputs.configuration }}
      files: ${{ steps.filter.outputs.files }}
      grpcserver: ${{ steps.filter.outputs.grpcserver }}
      identity: ${{ steps.filter.outputs.identity }}
      notification: ${{ steps.filter.outputs.notification }}
      users: ${{ steps.filter.outputs.users }}
      web: ${{ steps.filter.outputs.web }}
      shared: ${{ steps.filter.outputs.shared }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'Shared/**'
              - 'Tests/BarkCloud.TestKit/**'
            configuration:
              - 'Backend/BarkCloud.Configuration/**'
              - 'Tests/Backend/BarkCloud.Configuration.Tests/**'
            files:
              - 'Backend/BarkCloud.Files/**'
              - 'Tests/Backend/BarkCloud.Files.Tests/**'
            grpcserver:
              - 'Backend/BarkCloud.GrpcServer/**'
              - 'Tests/Backend/BarkCloud.GrpcServer.Tests/**'
            identity:
              - 'Backend/BarkCloud.Identity/**'
              - 'Tests/Backend/BarkCloud.Identity.Tests/**'
            notification:
              - 'Backend/BarkCloud.Notification/**'
              - 'Tests/Backend/BarkCloud.Notification.Tests/**'
            users:
              - 'Backend/BarkCloud.Users/**'
              - 'Tests/Backend/BarkCloud.Users.Tests/**'
            web:
              - 'Backend/BarkCloud.Web/**'
              - 'Tests/Backend/BarkCloud.Web.Tests/**'
            android:
              - 'Android/**'

  # ═══════════════════════════════════════════════════════════════
  #  Backend — тесты per-микросервис (свой + изменения в Shared)
  # ═══════════════════════════════════════════════════════════════
  test-configuration:
    name: "Configuration"
    needs: changes
    if: ${{ needs.changes.outputs.configuration == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Configuration.Tests/BarkCloud.Configuration.Tests.csproj -c Release --logger "trx;LogFileName=configuration.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-configuration
          path: TestResults/**

  test-files:
    name: "Files"
    needs: changes
    if: ${{ needs.changes.outputs.files == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Files.Tests/BarkCloud.Files.Tests.csproj -c Release --logger "trx;LogFileName=files.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-files
          path: TestResults/**

  test-grpcserver:
    name: "GrpcServer"
    needs: changes
    if: ${{ needs.changes.outputs.grpcserver == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.GrpcServer.Tests/BarkCloud.GrpcServer.Tests.csproj -c Release --logger "trx;LogFileName=grpcserver.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-grpcserver
          path: TestResults/**

  test-identity:
    name: "Identity"
    needs: changes
    if: ${{ needs.changes.outputs.identity == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Identity.Tests/BarkCloud.Identity.Tests.csproj -c Release --logger "trx;LogFileName=identity.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-identity
          path: TestResults/**

  test-notification:
    name: "Notification"
    needs: changes
    if: ${{ needs.changes.outputs.notification == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Notification.Tests/BarkCloud.Notification.Tests.csproj -c Release --logger "trx;LogFileName=notification.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-notification
          path: TestResults/**

  test-users:
    name: "Users"
    needs: changes
    if: ${{ needs.changes.outputs.users == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Users.Tests/BarkCloud.Users.Tests.csproj -c Release --logger "trx;LogFileName=users.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-users
          path: TestResults/**

  test-web:
    name: "Web"
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Web.Tests/BarkCloud.Web.Tests.csproj -c Release --logger "trx;LogFileName=web.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-web
          path: TestResults/**

  # ═══════════════════════════════════════════════════════════════
  #  Shared — все Shared.*.Tests одним прогоном
  # ═══════════════════════════════════════════════════════════════
  test-shared:
    name: "Shared"
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Test"
        run: |
          for proj in Tests/Shared/*/*.csproj; do
            dotnet test "$proj" -c Release \
              --logger "trx;LogFileName=$(basename "$proj" .csproj).trx" \
              --results-directory TestResults
          done
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shared
          path: TestResults/**

  # ═══════════════════════════════════════════════════════════════
  #  Android — только при изменениях в Android/**
  # ═══════════════════════════════════════════════════════════════
  android-tests:
    name: "Android unit tests"
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v3

      - name: "Run unit tests"
        working-directory: Android/BarkCloud.Android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: "Upload reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: Android/BarkCloud.Android/app/build/reports/tests/
