name: "🧪 BarkCloud Tests"

on:
  pull_request:
    branches:
      - dev
      - nightly
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  Определение изменённых частей репозитория.
  #  Изменения в Shared/Proto/TestKit запускают все backend-тесты.
  # ═══════════════════════════════════════════════════════════════
  changes:
    name: "Определение изменений"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      configuration: ${{ steps.filter.outputs.configuration }}
      files: ${{ steps.filter.outputs.files }}
      grpcserver: ${{ steps.filter.outputs.grpcserver }}
      identity: ${{ steps.filter.outputs.identity }}
      notification: ${{ steps.filter.outputs.notification }}
      users: ${{ steps.filter.outputs.users }}
      web: ${{ steps.filter.outputs.web }}
      shared: ${{ steps.filter.outputs.shared }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'Shared/**'
              - 'Tests/BarkCloud.TestKit/**'
            configuration:
              - 'Backend/BarkCloud.Configuration/**'
              - 'Backend/BarkCloud.GrpcServer/**'
              - 'Tests/Backend/BarkCloud.Configuration.Tests/**'
            files:
              - 'Backend/BarkCloud.Files/**'
              - 'Backend/BarkCloud.GrpcServer/**'
              - 'Tests/Backend/BarkCloud.Files.Tests/**'
              - 'Tests/Backend/BarkCloud.Files.IntegrationTests/**'
              - '.github/workflows/files-upload-integration.yml'
            grpcserver:
              - 'Backend/BarkCloud.GrpcServer/**'
              - 'Tests/Backend/BarkCloud.GrpcServer.Tests/**'
            identity:
              - 'Backend/BarkCloud.Identity/**'
              - 'Backend/BarkCloud.GrpcServer/**'
              - 'Tests/Backend/BarkCloud.Identity.Tests/**'
              - 'Tests/Backend/BarkCloud.Identity.IntegrationTests/**'
            notification:
              - 'Backend/BarkCloud.Notification/**'
              - 'Backend/BarkCloud.GrpcServer/**'
              - 'Tests/Backend/BarkCloud.Notification.Tests/**'
            users:
              - 'Backend/BarkCloud.Users/**'
              - 'Backend/BarkCloud.GrpcServer/**'
              - 'Tests/Backend/BarkCloud.Users.Tests/**'
              - 'Tests/Backend/BarkCloud.Users.IntegrationTests/**'
            web:
              - 'Backend/BarkCloud.Web/**'
              - 'Backend/BarkCloud.GrpcServer/**'
              - 'Tests/Backend/BarkCloud.Web.Tests/**'
            android:
              - 'Android/**'

  # ═══════════════════════════════════════════════════════════════
  #  Backend — тесты per-микросервис (свой + изменения в Shared)
  # ═══════════════════════════════════════════════════════════════
  test-configuration:
    name: "Configuration"
    needs: changes
    if: ${{ needs.changes.outputs.configuration == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Configuration.Tests/BarkCloud.Configuration.Tests.csproj -c Release --logger "trx;LogFileName=configuration.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-configuration
          path: TestResults/**

  test-files:
    name: "Files"
    needs: changes
    if: ${{ needs.changes.outputs.files == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    env:
      BARKCLOUD_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Files.Tests/BarkCloud.Files.Tests.csproj -c Release --logger "trx;LogFileName=files.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-files
          path: TestResults/**

  test-files-upload-integration:
    needs: changes
    if: ${{ needs.changes.outputs.files == 'true' || needs.changes.outputs.shared == 'true' }}
    uses: ./.github/workflows/files-upload-integration.yml

  test-grpcserver:
    name: "GrpcServer"
    needs: changes
    if: ${{ needs.changes.outputs.grpcserver == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.GrpcServer.Tests/BarkCloud.GrpcServer.Tests.csproj -c Release --logger "trx;LogFileName=grpcserver.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-grpcserver
          path: TestResults/**

  test-identity:
    name: "Identity"
    needs: changes
    if: ${{ needs.changes.outputs.identity == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Identity.Tests/BarkCloud.Identity.Tests.csproj -c Release --logger "trx;LogFileName=identity.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-identity
          path: TestResults/**

  test-identity-integration:
    name: "Identity — PostgreSQL integration"
    needs: changes
    if: ${{ needs.changes.outputs.identity == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    env:
      BARKCLOUD_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Identity.IntegrationTests/BarkCloud.Identity.IntegrationTests.csproj -c Release --logger "trx;LogFileName=identity-integration.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-identity-integration
          path: TestResults/**

  test-notification:
    name: "Notification"
    needs: changes
    if: ${{ needs.changes.outputs.notification == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Notification.Tests/BarkCloud.Notification.Tests.csproj -c Release --logger "trx;LogFileName=notification.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-notification
          path: TestResults/**

  test-users:
    name: "Users"
    needs: changes
    if: ${{ needs.changes.outputs.users == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    env:
      BARKCLOUD_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Users.Tests/BarkCloud.Users.Tests.csproj -c Release --logger "trx;LogFileName=users.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-users
          path: TestResults/**

  test-users-integration:
    name: "Users — PostgreSQL/RabbitMQ integration"
    needs: changes
    if: ${{ needs.changes.outputs.users == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    env:
      BARKCLOUD_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres
      BARKCLOUD_TEST_RABBITMQ: rabbitmq://integration:integration@127.0.0.1:5672/
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.1
        env:
          RABBITMQ_DEFAULT_USER: integration
          RABBITMQ_DEFAULT_PASS: integration
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Users.IntegrationTests/BarkCloud.Users.IntegrationTests.csproj -c Release --logger "trx;LogFileName=users-integration.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-users-integration
          path: TestResults/**

  test-web:
    name: "Web"
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: "Test"
        run: dotnet test Tests/Backend/BarkCloud.Web.Tests/BarkCloud.Web.Tests.csproj -c Release --logger "trx;LogFileName=web.trx" --results-directory TestResults
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-web
          path: TestResults/**

  # ═══════════════════════════════════════════════════════════════
  #  Shared — все Shared.*.Tests одним прогоном
  # ═══════════════════════════════════════════════════════════════
  test-shared:
    name: "Shared"
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: "Test"
        run: |
          for proj in Tests/Shared/*/*.csproj; do
            dotnet test "$proj" -c Release \
              --logger "trx;LogFileName=$(basename "$proj" .csproj).trx" \
              --results-directory TestResults
          done
      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shared
          path: TestResults/**

  # ═══════════════════════════════════════════════════════════════
  #  Android — только при изменениях в Android/**
  # ═══════════════════════════════════════════════════════════════
  android-tests:
    name: "Android unit tests"
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup JDK 17"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v5

      - name: "Run unit tests"
        working-directory: Android/BarkCloud.Android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: "Upload reports"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: Android/BarkCloud.Android/app/build/reports/tests/
