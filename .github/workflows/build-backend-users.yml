name: "🚀 BarkCloud.Users CI/CD"

on:
  push:
    branches:
      - dev
    # Keep these filters in sync with pull_request.paths and runtime-paths below.
    paths:
      - 'Backend/BarkCloud.Users/**'
      - 'Backend/BarkCloud.GrpcServer/**'
      - 'Shared/BarkCloud.Shared.*/**'
      - 'Shared/BarkCloud.Proto/configuration_api.proto'
      - 'Shared/BarkCloud.Proto/session_revocation_api.proto'
      - 'Shared/BarkCloud.Proto/users_api.proto'
      - 'Shared/BarkCloud.Proto/shared.proto'
      - 'Backend/rebuild.trigger'
      - 'Tests/Backend/BarkCloud.Users.Tests/**'
      - 'Tests/BarkCloud.TestKit/**'
  pull_request:
    types:
      - closed
    branches:
      - master
    paths:
      - 'Backend/BarkCloud.Users/**'
      - 'Backend/BarkCloud.GrpcServer/**'
      - 'Shared/BarkCloud.Shared.*/**'
      - 'Shared/BarkCloud.Proto/configuration_api.proto'
      - 'Shared/BarkCloud.Proto/session_revocation_api.proto'
      - 'Shared/BarkCloud.Proto/users_api.proto'
      - 'Shared/BarkCloud.Proto/shared.proto'
      - 'Backend/rebuild.trigger'
      - 'Tests/Backend/BarkCloud.Users.Tests/**'
      - 'Tests/BarkCloud.TestKit/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    if: >-
      ${{ github.event_name == 'push' && github.ref_name == 'dev'
          || github.event_name == 'workflow_dispatch' && github.ref_name == 'dev'
          || github.event_name == 'pull_request' && github.event.pull_request.merged == true
             && github.event.pull_request.head.ref == 'dev'
             && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/backend-service-ci.yml
    with:
      service-name: BarkCloud.Users
      service-key: users
      runtime-paths: |
        Backend/BarkCloud.Users/**
        Backend/BarkCloud.GrpcServer/**
        Shared/BarkCloud.Shared.*/**
        Shared/BarkCloud.Proto/configuration_api.proto
        Shared/BarkCloud.Proto/session_revocation_api.proto
        Shared/BarkCloud.Proto/users_api.proto
        Shared/BarkCloud.Proto/shared.proto
        Backend/rebuild.trigger
      test-path: Tests/Backend/BarkCloud.Users.Tests
      project-path: Backend/BarkCloud.Users/BarkCloud.Users.csproj
      test-project-path: Tests/Backend/BarkCloud.Users.Tests/BarkCloud.Users.Tests.csproj
      dockerfile: Backend/BarkCloud.Users/Dockerfile.slim
      image-name: barkcloud-users
      force-run: ${{ github.event_name == 'workflow_dispatch' }}
      push-delay: 90
    secrets: inherit
