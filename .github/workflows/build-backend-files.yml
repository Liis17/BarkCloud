name: "🚀 BarkCloud.Files CI/CD"

on:
  push:
    branches:
      - dev
      - master
    paths:
      - 'Backend/BarkCloud.Files/**'
      - 'Shared/**'
      - 'Tests/Backend/BarkCloud.Files.Tests/**'
      - 'Tests/BarkCloud.TestKit/**'
      - 'Backend/rebuild.trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ci:
    uses: ./.github/workflows/backend-service-ci.yml
    with:
      service-name: BarkCloud.Files
      service-key: files
      service-path: Backend/BarkCloud.Files
      test-path: Tests/Backend/BarkCloud.Files.Tests
      project-path: Backend/BarkCloud.Files/BarkCloud.Files.csproj
      test-project-path: Tests/Backend/BarkCloud.Files.Tests/BarkCloud.Files.Tests.csproj
      dockerfile: Backend/BarkCloud.Files/Dockerfile.slim
      image-name: barkcloud-files
      force-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
