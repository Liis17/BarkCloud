<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarkCloud — Файлы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600;8..144,700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css"/>
  <script>
    /* Тема применяется до рендера, чтобы не было мигания. Источник — localStorage (bark_theme: light|dark|auto). */
    (function(){try{var t=localStorage.getItem('bark_theme')||'auto';var d=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <style>
    .content { padding: 0 !important; }
    .files-shell {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 16px;
      height: 100%;
      padding: 4px 16px 16px;
    }
    .files-main {
      display:flex; flex-direction: column;
      overflow: hidden;
      background: var(--md-surface-container-low);
      border-radius: var(--r-xl);
    }
    .files-inspector {
      background: var(--md-surface-container-low);
      border-radius: var(--r-xl);
      overflow-y: auto;
      padding: 24px;
    }

    /* breadcrumb + toolbar */
    .files-bar {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 24px;
    }
    .breadcrumb {
      display:flex; align-items:center; gap: 2px;
      font-size: 14px;
      flex-wrap: wrap;
    }
    .breadcrumb a {
      color: var(--md-on-surface-variant);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: var(--r-full);
      transition: background var(--d-short), color var(--d-short);
      font-weight: 500;
      display: inline-flex; align-items: center;
    }
    .breadcrumb a:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); color: var(--md-on-surface); }
    .breadcrumb .sep { color: var(--md-outline); font-size: 16px; }
    .breadcrumb .cur {
      color: var(--md-on-secondary-container);
      font-weight: 500;
      padding: 6px 12px;
      background: var(--md-secondary-container);
      border-radius: var(--r-full);
    }
    .files-bar .right { margin-left:auto; display:flex; gap:8px; align-items:center; }

    /* Table */
    .files-list {
      flex: 1; overflow: auto;
    }
    .ftable {
      width: 100%; border-collapse: collapse;
      font-size: 14px;
    }
    .ftable thead th {
      position: sticky; top: 0;
      background: var(--md-surface-container-low);
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      color: var(--md-on-surface-variant);
      border-bottom: 1px solid var(--md-outline-variant);
      font-weight: 500;
      white-space: nowrap;
    }
    .ftable thead th:first-child { padding-left: 24px; }
    .ftable thead th:last-child { padding-right: 24px; text-align: right; }

    .ftable tbody tr {
      cursor: pointer;
      transition: background var(--d-short);
    }
    .ftable tbody tr:hover { background: color-mix(in srgb, var(--md-on-surface) 6%, transparent); }
    .ftable tbody tr.selected {
      background: var(--md-secondary-container);
    }
    .ftable tbody tr.selected:hover { background: color-mix(in srgb, var(--md-on-secondary-container) 10%, var(--md-secondary-container)); }
    .ftable td {
      padding: 12px 16px;
      vertical-align: middle;
      color: var(--md-on-surface);
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .ftable tbody tr.selected td { border-color: transparent; }
    .ftable td:first-child { padding-left: 24px; }
    .ftable td:last-child { padding-right: 24px; text-align: right; }
    .ftable td.name {
      display: flex; align-items: center; gap: 14px;
    }

    /* File-type chips — M3 container colors */
    .file-icon {
      width: 40px; height: 40px;
      border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .3px;
    }
    .file-icon.folder { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    .file-icon.img    { background: #C8E6C9; color: #1B5E20; }
    .file-icon.vid    { background: #D1C4E9; color: #311B92; }
    .file-icon.doc    { background: #BBDEFB; color: #0D47A1; }
    .file-icon.pdf    { background: #FFCDD2; color: #B71C1C; }
    .file-icon.zip    { background: #FFE0B2; color: #6D4C00; }
    .file-icon.code   { background: #B2DFDB; color: #004D40; }
    .file-icon.audio  { background: #F8BBD0; color: #880E4F; }

    .file-name-col .fn { color: var(--md-on-surface); font-weight: 500; }
    .file-name-col .meta { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 2px; }

    td.size, td.modified { font-size: 13px; color: var(--md-on-surface-variant); }
    td.modified .ago { font-size: 11px; color: var(--md-outline); margin-top: 2px; display: block; }

    .row-actions { display: inline-flex; gap: 2px; opacity: 0; transition: opacity var(--d-short); }
    tr:hover .row-actions { opacity: 1; }
    tr.selected .row-actions { opacity: 1; }
    .row-actions button {
      width: 36px; height: 36px;
      background: transparent;
      border: none;
      border-radius: 50%;
      color: var(--md-on-surface-variant);
      display:flex; align-items:center; justify-content:center;
      cursor: pointer;
      transition: background var(--d-short), color var(--d-short);
    }
    .row-actions button:hover { background: color-mix(in srgb, var(--md-on-surface) 10%, transparent); color: var(--md-on-surface); }

    /* INSPECTOR */
    .insp-preview {
      aspect-ratio: 4/3;
      margin-bottom: 20px;
      position: relative;
      border-radius: var(--r-lg);
      overflow: hidden;
      background: var(--md-surface-container-high);
    }
    .insp-preview .thumb { width:100%; height:100%; border-radius: var(--r-lg); }
    .insp-preview .pin {
      position: absolute; top: 12px; left: 12px;
      font-size: 11px;
      background: rgba(0,0,0,.6);
      color: white;
      padding: 6px 10px; border-radius: var(--r-full);
      font-weight: 500;
    }

    .insp-name {
      font-size: 22px;
      font-weight: 500;
      line-height: 28px;
      letter-spacing: 0;
      margin-bottom: 4px;
      word-break: break-word;
      color: var(--md-on-surface);
    }
    .insp-empty {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      color: var(--md-on-surface-variant);
      text-align: center;
      padding: 60px 20px;
      font-size: 14px;
    }
    .file-icon.big {
      width: 100%; height: 100%;
      border-radius: var(--r-lg);
      font-size: 22px; letter-spacing: .5px;
    }
    .insp-name { margin-top: 4px; margin-bottom: 18px; }
    .insp-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }
    .insp-actions .btn { width: 100%; height: 40px; font-size: 13px; padding: 0 12px; }
    .insp-section {
      border-top: 1px solid var(--md-outline-variant);
      padding-top: 18px;
      margin-bottom: 18px;
    }
    .insp-section h4 {
      font-size: 14px;
      color: var(--md-on-surface);
      margin-bottom: 12px;
      font-weight: 500;
    }
    .kv-list { display: grid; grid-template-columns: 110px 1fr; gap: 10px 14px; font-size: 13px; }
    .kv-list dt { color: var(--md-on-surface-variant); font-size: 12px; align-self: center; }
    .kv-list dd { color: var(--md-on-surface); }

  </style>
</head>
<body>
<div id="root"></div>

<!--
  ╔═══════════════════════════════════════════════════════════════╗
  ║ SERVER PAYLOAD (Files.html)                                       ║
  ╠═══════════════════════════════════════════════════════════════╣
  ║ Сервер должен заменить всё содержимое блока ниже на JSON      ║
  ║ вида:                                                            ║
  ║   {                                                              ║
  ║     "tabs":       [{ key, label, count }, ...],                  ║
  ║     "breadcrumb": [{ label, href }, ...],                        ║
  ║     "files":      [{ id, kind, ext, name, meta, size, ... },...],║
  ║     "selectedId": <id выбранного файла из files>           ║
  ║   }                                                              ║
  ║                                                                  ║
  ║ Поля файла в files[]:                                          ║
  ║   id, kind, ext, name, meta, size, mod, ago, owner, tone,        ║
  ║   shared, star, path, details:{type,size,dim,cam,created,...},   ║
  ║   tags:[...], people:[{initials,tone,name,role}], activity:[...]  ║
  ╚═══════════════════════════════════════════════════════════════╝
-->
<script type="application/json" id="server-data">
{{{ page_data_json }}}
</script>

<script type="text/babel">
const { AppShell, Icon, apiGet, apiPost, pickFiles, uploadFile,
        MediaThumb, Lightbox, Modal, useToast, EmptyState, Loading,
        useContextMenu, ConfirmModal, PropertiesModal, useAlbumMembership } = window;

const ruDate = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
function fmtDate(iso) { return iso ? ruDate.format(new Date(iso)) : '—'; }
function fmtFull(iso) { return iso ? new Date(iso).toLocaleString('ru-RU') : '—'; }
function kindLabel(k) { return k === 'photo' ? 'фото' : k === 'video' ? 'видео' : k === 'audio' ? 'аудио' : k === 'document' ? 'документ' : 'файл'; }

function DirRow({ dir, onOpen, onRename, onDelete, onMenu }) {
  return (
    <tr onClick={() => onOpen(dir)} onContextMenu={(e) => onMenu(e, dir)}>
      <td className="name">
        <div className="file-icon folder">DIR</div>
        <div className="file-name-col"><div className="fn">{dir.name}</div><div className="meta">Папка</div></div>
      </td>
      <td className="size">—</td>
      <td className="modified">{fmtDate(dir.updatedAt)}</td>
      <td>
        <span className="row-actions">
          <button title="Переименовать" onClick={(e) => { e.stopPropagation(); onRename(dir); }}><Icon.pencil size={18}/></button>
          <button title="Удалить" onClick={(e) => { e.stopPropagation(); onDelete(dir); }}><Icon.trash size={18}/></button>
        </span>
      </td>
    </tr>
  );
}

function FileRow({ entry, selected, onSelect, onRename, onDelete, onDownload, onMenu }) {
  const m = entry.media || {};
  return (
    <tr className={selected ? 'selected' : ''} onClick={() => onSelect(entry)} onContextMenu={(e) => onMenu(e, entry)}>
      <td className="name">
        <div className={"file-icon " + (m.iconKind || 'doc')}>{m.ext || 'FILE'}</div>
        <div className="file-name-col"><div className="fn">{entry.name}</div><div className="meta">{kindLabel(m.kind)}</div></div>
      </td>
      <td className="size">{m.sizeLabel || '—'}</td>
      <td className="modified">{fmtDate(entry.createdAt)}</td>
      <td>
        <span className="row-actions">
          <button title="Скачать" onClick={(e) => { e.stopPropagation(); onDownload(entry); }}><Icon.download size={18}/></button>
          <button title="Переименовать" onClick={(e) => { e.stopPropagation(); onRename(entry); }}><Icon.pencil size={18}/></button>
          <button title="Удалить" onClick={(e) => { e.stopPropagation(); onDelete(entry); }}><Icon.trash size={18}/></button>
        </span>
      </td>
    </tr>
  );
}

function Inspector({ entry, onOpen, onRename, onDelete, onDownload }) {
  if (!entry) {
    return (
      <div className="insp-empty">
        <Icon.file size={40}/>
        <div>Выберите файл, чтобы увидеть детали и превью</div>
      </div>
    );
  }
  const m = entry.media || {};
  const isMedia = m.kind === 'photo' || m.kind === 'video';
  const hasPreview = (m.previews || []).length > 0;
  return (
    <div>
      <div className="insp-preview">
        {isMedia && hasPreview
          ? <MediaThumb media={m} sizes="360px"/>
          : <div className={"file-icon big " + (m.iconKind || 'doc')}>{m.ext || 'FILE'}</div>}
        <div className="pin">{m.ext || 'FILE'}{m.kind === 'video' ? ' · видео' : ''}</div>
      </div>
      <div className="insp-name">{entry.name}</div>

      <div className="insp-actions">
        <button className="btn primary" onClick={() => onDownload(entry)}><Icon.download size={16}/> Скачать</button>
        {isMedia && <button className="btn outlined" onClick={() => onOpen(m)}><Icon.eye size={16}/> Открыть</button>}
        <button className="btn outlined" onClick={() => onRename(entry)}><Icon.pencil size={16}/> Переименовать</button>
        <button className="btn outlined" onClick={() => onDelete(entry)}><Icon.trash size={16}/> Удалить</button>
      </div>

      <div className="insp-section">
        <h4>Детали</h4>
        <dl className="kv-list">
          <React.Fragment><dt>Тип</dt><dd>{m.ext || '—'}{m.kind && m.kind !== 'other' ? ` · ${kindLabel(m.kind)}` : ''}</dd></React.Fragment>
          {m.sizeLabel && <React.Fragment><dt>Размер</dt><dd>{m.sizeLabel}</dd></React.Fragment>}
          {m.width > 0 && <React.Fragment><dt>Размерность</dt><dd>{m.width} × {m.height}</dd></React.Fragment>}
          <React.Fragment><dt>Добавлен</dt><dd>{fmtFull(entry.createdAt)}</dd></React.Fragment>
          {m.uploadedAt && <React.Fragment><dt>Загружен</dt><dd>{fmtFull(m.uploadedAt)}</dd></React.Fragment>}
        </dl>
      </div>
    </div>
  );
}

function App() {
  const [stack, setStack] = React.useState([]);        // [{id,name}] — путь от корня
  const [listing, setListing] = React.useState(null);  // {dirs, files}
  const [sel, setSel] = React.useState(null);          // выбранная запись файла
  const [lightbox, setLightbox] = React.useState(null);
  const [upload, setUpload] = React.useState(null);
  const [creating, setCreating] = React.useState(false);
  const [renaming, setRenaming] = React.useState(null); // {isDir, target}
  const [name, setName] = React.useState('');
  const [albums, setAlbums] = React.useState([]);
  const [props, setProps] = React.useState(null);       // media для модалки «Свойства»
  const [confirmDel, setConfirmDel] = React.useState(null); // { isDir, target }
  const [toastNode, toast] = useToast();
  const { menu, openAt } = useContextMenu();
  const membership = useAlbumMembership(albums);

  const currentDir = stack.length ? stack[stack.length - 1].id : '';

  const load = React.useCallback(() => {
    setListing(null); setSel(null);
    apiGet('/api/cloud/list?dir=' + encodeURIComponent(currentDir))
      .then(d => setListing(d))
      .catch(e => { toast(e.message, 'err'); setListing({ dirs: [], files: [] }); });
  }, [currentDir, toast]);
  React.useEffect(load, [load]);

  const loadAlbums = React.useCallback(() => {
    apiGet('/api/albums').then(d => setAlbums(d.albums || [])).catch(() => {});
  }, []);
  React.useEffect(() => { loadAlbums(); }, [loadAlbums]);
  // Подгружаем членство в альбомах заранее — меню строится синхронно при ПКМ
  React.useEffect(() => { membership.ensureLoaded(); }, [albums]);

  const openDir = (dir) => setStack(s => [...s, { id: dir.id, name: dir.name }]);
  const gotoIndex = (i) => setStack(s => s.slice(0, i + 1));   // i = -1 → корень

  async function createDir() {
    const n = name.trim(); if (!n) return;
    try { await apiPost('/api/cloud/dir', { parentId: currentDir, name: n }); setCreating(false); load(); toast('Папка создана'); }
    catch (e) { toast(e.message, 'err'); }
  }
  async function doRename() {
    const n = name.trim(); if (!n || !renaming) return;
    try {
      if (renaming.isDir) await apiPost('/api/cloud/dir/rename', { id: renaming.target.id, name: n });
      else await apiPost('/api/cloud/entry/rename', { entryId: renaming.target.entryId, name: n });
      setRenaming(null); load(); toast('Переименовано');
    } catch (e) { toast(e.message, 'err'); }
  }
  const requestDelete = (target, isDir) => setConfirmDel({ isDir, target });
  async function doConfirmDelete() {
    if (!confirmDel) return;
    const { isDir, target } = confirmDel;
    try {
      if (isDir) { await apiPost('/api/cloud/dir/delete', { id: target.id }); toast('Папка удалена, файлы в корзине'); }
      else { await apiPost('/api/cloud/entry/delete', { entryId: target.entryId }); toast('Перемещено в корзину'); }
      setConfirmDel(null); load();
    } catch (e) { toast(e.message, 'err'); }
  }
  async function download(entry) {
    try {
      const d = await apiGet('/api/files/download?ids=' + encodeURIComponent(entry.fileId));
      const url = d.urls && d.urls[entry.fileId];
      if (url) window.open(url, '_blank');
      else toast('Ссылка недоступна', 'err');
    } catch (e) { toast(e.message, 'err'); }
  }
  async function copyLink(fileId) {
    try {
      const d = await apiGet('/api/files/download?ids=' + encodeURIComponent(fileId));
      const url = d.urls && d.urls[fileId];
      if (!url) throw new Error('Ссылка недоступна');
      await navigator.clipboard.writeText(url); toast('Ссылка скопирована (временная)');
    } catch (e) { toast(e.message || 'Не удалось скопировать', 'err'); }
  }
  async function addToAlbum(fileId, albumId) {
    try { await apiPost('/api/albums/items/add', { album: albumId, fileIds: [fileId] }); membership.addLocal(fileId, albumId); loadAlbums(); toast('Добавлено в альбом'); }
    catch (e) { toast(e.message, 'err'); }
  }
  async function removeFromAlbum(fileId, albumId) {
    try { await apiPost('/api/albums/items/remove', { album: albumId, fileIds: [fileId] }); membership.removeLocal(fileId, albumId); loadAlbums(); toast('Убрано из альбома'); }
    catch (e) { toast(e.message, 'err'); }
  }

  function fileMenu(entry) {
    const m = entry.media || {};
    const isMedia = m.kind === 'photo' || m.kind === 'video';
    const inAlbums = membership.of(entry.fileId);
    const available = albums.filter(a => !inAlbums.has(a.id));
    const present = albums.filter(a => inAlbums.has(a.id));
    const out = [
      { label: 'Копировать ссылку', icon: 'link', onClick: () => copyLink(entry.fileId) },
      { label: 'Переименовать', icon: 'pencil', onClick: () => startRename(entry, false) },
    ];
    if (isMedia) {
      out.push({
        label: 'Добавить в альбом', icon: 'plus',
        submenu: available.length ? available.map(a => ({ label: a.name, onClick: () => addToAlbum(entry.fileId, a.id) }))
          : [{ label: albums.length ? 'Уже во всех альбомах' : 'Нет альбомов', disabled: true }]
      });
      if (present.length) out.push({ label: 'Удалить из альбома', icon: 'x', submenu: present.map(a => ({ label: a.name, onClick: () => removeFromAlbum(entry.fileId, a.id) })) });
    }
    out.push({ label: 'Свойства', icon: 'info', onClick: () => setProps(m) });
    out.push({ divider: true });
    out.push({ label: 'Удалить', icon: 'trash', danger: true, onClick: () => requestDelete(entry, false) });
    return out;
  }
  function dirMenu(dir) {
    return [
      { label: 'Переименовать', icon: 'pencil', onClick: () => startRename(dir, true) },
      { divider: true },
      { label: 'Удалить', icon: 'trash', danger: true, onClick: () => requestDelete(dir, true) },
    ];
  }
  async function doUpload() {
    const files = await pickFiles({});
    if (!files.length) return;
    let done = 0;
    for (const f of files) {
      setUpload({ current: done + 1, total: files.length, pct: 0 });
      try {
        const res = await uploadFile(f, p => setUpload({ current: done + 1, total: files.length, pct: Math.round(p * 100) }));
        await apiPost('/api/cloud/attach', { dir: currentDir, fileId: res.fileId, name: f.name });
      } catch (e) { toast(`«${f.name}»: ${e.message}`, 'err'); }
      done++;
    }
    setUpload(null);
    toast(`Загружено: ${done}`);
    load();
  }

  const startRename = (target, isDir) => { setName(target.name); setRenaming({ isDir, target }); };

  const actions = (
    <>
      <button className="btn outlined" onClick={() => { setName(''); setCreating(true); }}><Icon.plus size={16}/> Создать</button>
      <button className="btn primary" onClick={doUpload}><Icon.upload size={16}/> Загрузить</button>
    </>
  );

  const dirs = listing ? listing.dirs : [];
  const files = listing ? listing.files : [];
  const empty = listing && !dirs.length && !files.length;

  return (
    <AppShell page="files"
      kicker={<><span>Библиотека</span><span className="sep">/</span><span className="cur">Файлы</span></>}
      title="Файлы" actions={actions}>
      {toastNode}
      <div className="files-shell">
        <div className="files-main">
          <div className="files-bar">
            <div className="breadcrumb">
              <a onClick={() => gotoIndex(-1)} className={stack.length ? '' : 'cur'} style={{ cursor: 'pointer' }}><Icon.folder size={18}/></a>
              {stack.map((s, i) => (
                <React.Fragment key={s.id}>
                  <span className="sep">/</span>
                  {i === stack.length - 1
                    ? <span className="cur">{s.name}</span>
                    : <a onClick={() => gotoIndex(i)} style={{ cursor: 'pointer' }}>{s.name}</a>}
                </React.Fragment>
              ))}
            </div>
          </div>

          {upload && (
            <div className="upload-banner" style={{ margin: '0 24px 12px' }}>
              <span className="spinner"/> Загрузка {upload.current}/{upload.total}…
              <div className="bar"><div className="bar-fill" style={{ width: upload.pct + '%' }}/></div>
            </div>
          )}

          <div className="files-list">
            {listing === null ? <Loading/> :
              empty ? <EmptyState icon="folder" title="Папка пуста" hint="Загрузите файлы или создайте подпапку."
                action={<button className="btn primary" onClick={doUpload}><Icon.upload size={16}/> Загрузить</button>}/>
                : <table className="ftable">
                  <thead><tr>
                    <th>Имя</th>
                    <th style={{ width: 120 }}>Размер</th>
                    <th style={{ width: 140 }}>Изменён</th>
                    <th style={{ width: 120 }}></th>
                  </tr></thead>
                  <tbody>
                    {dirs.map(d => <DirRow key={d.id} dir={d} onOpen={openDir}
                      onRename={(t) => startRename(t, true)} onDelete={(t) => requestDelete(t, true)}
                      onMenu={(ev, t) => openAt(ev, dirMenu(t))}/>)}
                    {files.map(e => <FileRow key={e.entryId} entry={e} selected={sel && sel.entryId === e.entryId}
                      onSelect={setSel} onDownload={download}
                      onRename={(t) => startRename(t, false)} onDelete={(t) => requestDelete(t, false)}
                      onMenu={(ev, t) => openAt(ev, fileMenu(t))}/>)}
                  </tbody>
                </table>}
          </div>
        </div>

        <aside className="files-inspector">
          <Inspector entry={sel} onOpen={setLightbox} onDownload={download}
            onRename={(t) => startRename(t, false)} onDelete={(t) => requestDelete(t, false)}/>
        </aside>
      </div>

      {creating && (
        <Modal title="Новая папка" onClose={() => setCreating(false)}
          actions={<>
            <button className="btn text" onClick={() => setCreating(false)}>Отмена</button>
            <button className="btn primary" onClick={createDir}>Создать</button>
          </>}>
          <label className="field-label">Имя папки</label>
          <input type="text" value={name} autoFocus onChange={e => setName(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') createDir(); }}/>
        </Modal>
      )}

      {renaming && (
        <Modal title="Переименовать" onClose={() => setRenaming(null)}
          actions={<>
            <button className="btn text" onClick={() => setRenaming(null)}>Отмена</button>
            <button className="btn primary" onClick={doRename}>Сохранить</button>
          </>}>
          <label className="field-label">Новое имя</label>
          <input type="text" value={name} autoFocus onChange={e => setName(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') doRename(); }}/>
        </Modal>
      )}

      {confirmDel && <ConfirmModal title={confirmDel.isDir ? 'Удалить папку?' : 'Удалить в корзину?'} danger confirmLabel="Удалить"
        message={confirmDel.isDir
          ? `Папка «${confirmDel.target.name}» и файлы внутри попадут в корзину (14 дней).`
          : `«${confirmDel.target.name}» будет перемещён в корзину.`}
        onClose={() => setConfirmDel(null)} onConfirm={doConfirmDelete}/>}

      {props && <PropertiesModal fileId={props.id} fallback={props} onClose={() => setProps(null)}/>}

      {menu}

      {lightbox && <Lightbox media={lightbox} onClose={() => setLightbox(null)}/>}
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
