name: "🚀 BarkCloud.Notification CI/CD"

on:
  push:
    branches:
      - dev
      - nightly
      - master
    paths:
      - 'Backend/BarkCloud.Notification/**'
      - 'Shared/**'
      # proto: Notification его не использует — исключаем весь BarkCloud.Proto
      - '!Shared/BarkCloud.Proto/**'
      - 'Tests/Backend/BarkCloud.Notification.Tests/**'
      - 'Tests/BarkCloud.TestKit/**'
      - 'Backend/rebuild.trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ci:
    uses: ./.github/workflows/backend-service-ci.yml
    with:
      service-name: BarkCloud.Notification
      service-key: notification
      service-path: Backend/BarkCloud.Notification
      test-path: Tests/Backend/BarkCloud.Notification.Tests
      project-path: Backend/BarkCloud.Notification/BarkCloud.Notification.csproj
      test-project-path: Tests/Backend/BarkCloud.Notification.Tests/BarkCloud.Notification.Tests.csproj
      dockerfile: Backend/BarkCloud.Notification/Dockerfile.slim
      image-name: barkcloud-notification
      force-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
