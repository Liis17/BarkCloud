<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Обновление BarkCloud</title>
    <style>
        :root { color-scheme: light dark; font-family: Inter, system-ui, -apple-system, sans-serif; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f8f7f4; color: #242320; }
        .card { width: min(100%, 460px); box-sizing: border-box; padding: 44px 32px; text-align: center; border-radius: 28px; background: #fff; box-shadow: 0 12px 40px rgb(30 28 24 / 12%); }
        .loader { width: 52px; height: 52px; margin: 0 auto 24px; border: 4px solid #d9e7dc; border-top-color: #2f7045; border-radius: 50%; animation: spin 1s linear infinite; }
        h1 { margin: 0 0 10px; font-size: 25px; font-weight: 600; }
        p { margin: 0; color: #6b6963; line-height: 1.5; }
        .stages { display: flex; justify-content: center; gap: 10px; margin: 26px 0 12px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #d4d2cc; }
        .dot.active { background: #2f7045; animation: pulse 1.4s ease-in-out infinite; }
        .hint { font-size: 12px; color: #77746d; }
        .timer { display: inline-block; margin-top: 24px; padding: 8px 15px; border-radius: 999px; background: #e1f0e4; color: #245c36; font-size: 14px; font-weight: 600; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 50% { transform: scale(1.45); opacity: .65; } }
        @media (prefers-color-scheme: dark) {
            body { background: #171714; color: #f2f0ea; }
            .card { background: #252521; box-shadow: 0 12px 40px rgb(0 0 0 / 35%); }
            p, .hint { color: #b9b6ad; }
            .loader { border-color: #24452e; border-top-color: #9ed1a6; }
            .dot { background: #55544e; }
            .dot.active { background: #9ed1a6; }
            .timer { background: #203d28; color: #b5e1ba; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="loader" aria-hidden="true"></div>
        <h1>BarkCloud обновляется</h1>
        <p>Загружаем новый образ и пересоздаём веб-контейнер.</p>
        <div class="stages" aria-hidden="true"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
        <div class="hint">Проверяем доступность сервера каждые 3 секунды</div>
        <div class="timer"><span id="timer">0</span> сек</div>
    </main>
    <script src="/maintenance-wait.js"></script>
    <script>
        BarkCloudWait.start({ initialDelayMs: 10000, pageServerStartedAt: '{{BARKCLOUD_STARTED_AT_UTC}}' });
    </script>
</body>
</html>
