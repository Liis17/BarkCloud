name: "🚀 BarkCloud.Identity CI/CD"

on:
  push:
    branches:
      - dev
      - nightly
      - master
    paths:
      - 'Backend/BarkCloud.Identity/**'
      - 'Shared/**'
      # proto-контракты: только свой (+ общий shared.proto), а не весь BarkCloud.Proto → не пересобирать весь бэкенд
      - '!Shared/BarkCloud.Proto/**'
      - 'Shared/BarkCloud.Proto/identity_api.proto'
      - 'Shared/BarkCloud.Proto/shared.proto'
      - 'Tests/Backend/BarkCloud.Identity.Tests/**'
      - 'Tests/BarkCloud.TestKit/**'
      - 'Backend/rebuild.trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ci:
    uses: ./.github/workflows/backend-service-ci.yml
    with:
      service-name: BarkCloud.Identity
      service-key: identity
      service-path: Backend/BarkCloud.Identity
      test-path: Tests/Backend/BarkCloud.Identity.Tests
      project-path: Backend/BarkCloud.Identity/BarkCloud.Identity.csproj
      test-project-path: Tests/Backend/BarkCloud.Identity.Tests/BarkCloud.Identity.Tests.csproj
      dockerfile: Backend/BarkCloud.Identity/Dockerfile.slim
      image-name: barkcloud-identity
      force-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
