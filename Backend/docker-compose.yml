version: '3.8'

x-common-variables: &common-variables
  CONFIGURATION_SERVICE_URL: "${CONFIGURATION_SERVICE_URL}"
  ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
  CONFIGURATION_ACCESS_KEY: "${CONFIGURATION_ACCESS_KEY}"

services:
  # === Основные микросервисы (prod-образы) ===

  configuration:
    image: docker.barkfluff.com:5000/barkcloud-configuration:latest
    container_name: cloud-configuration
    restart: always
    env_file:
      - .env
    environment:
      <<: *common-variables
      CONFIGURATION_HOST: ${CONFIGURATION_HOST}
      CONFIGURATION_DATABASE: ${CONFIGURATION_DATABASE}
      CONFIGURATION_USERNAME: ${CONFIGURATION_USERNAME}
      CONFIGURATION_PASSWORD: ${CONFIGURATION_PASSWORD}
      CONFIGURATION_PORT: ${CONFIGURATION_PORT}
      # Postgres внутри контейнера всегда слушает 5432 — POSTGRES_PORT из .env это host-маппинг
      CONFIGURATION_DBPORT: "5432"
      # MinIO внутри контейнера всегда слушает 9000 — MINIO_PORT из .env это host-маппинг
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - barkcloud-network

  identity:
    image: docker.barkfluff.com:5000/barkcloud-identity:latest
    container_name: cloud-identity
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkcloud-network
    depends_on:
      - configuration

  users:
    image: docker.barkfluff.com:5000/barkcloud-users:latest
    container_name: cloud-users
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkcloud-network
    depends_on:
      - configuration

  files:
    image: docker.barkfluff.com:5000/barkcloud-files:latest
    container_name: cloud-files
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkcloud-network
    depends_on:
      - configuration

  # Сервис уведомлений (consumer RabbitMQ → SMTP). Внешнего API нет — в nginx не маршрутизируется.
  notification:
    image: docker.barkfluff.com:5000/barkcloud-notification:latest
    container_name: cloud-notification
    restart: always
    environment:
      <<: *common-variables
    networks:
      - barkcloud-network
    depends_on:
      - configuration

  # Веб-клиент (HTTP, отдаёт страницы браузеру; к микросервисам обращается по docker-сети через gRPC)
  # JwtSettings и адреса сервисов тянет из Configuration-сервиса (CONFIGURATION_SERVICE_URL), как остальные.
  web:
    image: docker.barkfluff.com:5000/barkcloud-web:latest
    container_name: cloud-web
    restart: always
    # root нужен для доступа к docker.sock — веб управляет обновлением бэкенда из страницы настроек.
    user: root
    env_file:
      - .env
    environment:
      <<: *common-variables
      ASPNETCORE_URLS: "http://+:8080"
      App__CookieSecure: "${WEB_COOKIE_SECURE}"
      App__PublicHost: "${WEB_PUBLIC_HOST}"
      # Пароль доступа к разделу «Обслуживание» (обновление бэкенда). Пусто → раздел недоступен.
      App__AdminPassword: "${WEB_ADMIN_PASSWORD}"
    volumes:
      # Управление контейнерами бэкенда (pull/up/restart) через локальный Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      # compose-файл и .env нужны для `docker compose pull/up`; монтируем по тем же путям, что админка BarkFluff.
      - ./docker-compose.yml:/docker-compose.yml:ro
      - ./.env:/.env:ro
    ports:
      - "${WEB_PORT}:8080"
    networks:
      - barkcloud-network
    depends_on:
      - configuration
      - identity
      - users
      - files

  # === Reverse-proxy (единственная точка выхода наружу) ===

  nginx:
    image: nginx:latest
    container_name: cloud-nginx
    restart: always
    # Наружу выставлены только эти порты; микросервисы доступны лишь через прокси.
    ports:
      - "${IDENTITY_PORT}:7020"
      - "${USERS_PORT}:7021"
      - "${FILES_PORT}:7025"
    volumes:
      - ./nginx/cloud.barkfluff.conf:/etc/nginx/conf.d/cloud.barkfluff.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - barkcloud-network
    depends_on:
      - identity
      - users
      - files

  # === Инфраструктурные сервисы ===

  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: always
    ports:
      - "${SEQ_WEBPORT}:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_ADMIN_PASSWORD}"
    volumes:
      - seq_data:/data
    networks:
      - barkcloud-network

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    container_name: minio
    restart: always
    # MINIO_PORT / MINIO_WEBPORT в .env — это host-маппинг.
    # Внутри контейнера MinIO всегда слушает 9000 (API) и 9001 (console).
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_WEBPORT}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - barkcloud-network

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
    networks:
      - barkcloud-network

  postgres:
    image: postgres:18
    container_name: postgres_barkcloud
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql
      - backup_volume:/backup
    # POSTGRES_PORT в .env — host-маппинг. Внутри контейнера Postgres всегда слушает 5432.
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - barkcloud-network

networks:
  barkcloud-network:
    driver: bridge

volumes:
  pgdata:
  rabbitmq_data:
  minio_data:
  backup_volume:
  seq_data:
