[versions]
agp = "8.11.1"
kotlin = "2.1.20"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

composeBom = "2025.10.00"
# Material 3 Expressive API (MaterialExpressiveTheme, FloatingToolbar, ButtonGroup,
# MotionScheme) публичен (experimental) в ветке material3 1.4.0-alpha, но СКРЫТ (internal)
# в стабильной 1.4.0. Поэтому material3 форсится на 1.4.0-alpha18 (см. resolutionStrategy
# в app/build.gradle.kts) — эта версия зависит от Compose 1.8.x, совместимого с AGP 8.11.
material3Expressive = "1.4.0-alpha18"
activityCompose = "1.10.1"
lifecycle = "2.9.0"
navigationCompose = "2.9.0"
securityCrypto = "1.1.0-alpha07"
coroutines = "1.10.2"
coil = "3.4.0"
okhttp = "4.12.0"
graphicsShapes = "1.0.1"

protobufPlugin = "0.9.4"
protobufJava = "3.25.1"
grpc = "1.65.1"
grpcKotlin = "1.4.1"

mockk = "1.13.13"
turbine = "1.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

androidx-activity-compose             = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom                  = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui                   = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics          = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling           = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview   = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3            = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-lifecycle-runtime-compose    = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose  = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose           = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-security-crypto              = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

protobuf-javalite      = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobufJava" }
protobuf-kotlin-lite   = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobufJava" }
grpc-okhttp            = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
grpc-protobuf-lite     = { module = "io.grpc:grpc-protobuf-lite", version.ref = "grpc" }
grpc-stub              = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub       = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpcKotlin" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

mockk   = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-video   = { module = "io.coil-kt.coil3:coil-video",   version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphicsShapes" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
protobuf            = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
