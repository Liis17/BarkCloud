syntax = "proto3";

option csharp_namespace = "BarkCloud.Proto.Identity";

import "google/protobuf/timestamp.proto";

package barkcloud.identity;

// Выдача короткоживущих сервисных JWT. Аутентификация — сам секрет сервиса (credential):
// JWT здесь получить нельзя (курица и яйцо), реестр секретов есть только у Identity.
service ServiceCredentialsApi {

  // Обменять свой credential на сервисный JWT для вызова target-сервиса.
  rpc GetServiceToken(GetServiceTokenRequest) returns(GetServiceTokenResponse);
}

message GetServiceTokenRequest {
  string credential = 1;     // секрет сервиса-вызывающего
  int32 target_service = 2;  // ServiceId целевого сервиса
}

message GetServiceTokenResponse {
  string token = 1;                            // сервисный JWT (RS256, ~10 минут)
  google.protobuf.Timestamp expires_at = 2;     // срок действия токена
}
