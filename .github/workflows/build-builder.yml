name: BarkCloud Builder CI

on:
  push:
    branches:
      - master
    paths:
      - 'Tools/BarkCloud.Builder/**'
      - 'Tests/Tools/BarkCloud.Builder.Tests/**'
      - 'Tests/Directory.Build.props'
      - 'Directory.Build.props'
      - '.github/workflows/build-builder.yml'
  pull_request:
    paths:
      - 'Tools/BarkCloud.Builder/**'
      - 'Tests/Tools/BarkCloud.Builder.Tests/**'
      - 'Tests/Directory.Build.props'
      - 'Directory.Build.props'
      - '.github/workflows/build-builder.yml'
  workflow_dispatch:

# Публикация Builder-а выполняется release.yml: один релиз master
# со всеми клиентами (APK/IPA/DMG/ZIP Drive + ZIP Builder).

permissions:
  contents: read

jobs:
  ci:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Builder
        run: dotnet test Tests/Tools/BarkCloud.Builder.Tests/BarkCloud.Builder.Tests.csproj --configuration Release

      - name: Publish self-contained Windows executable
        run: >-
          dotnet publish Tools/BarkCloud.Builder/BarkCloud.Builder.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "$env:RUNNER_TEMP/BarkCloud.Builder-win-x64-self-contained"

      - name: Verify published executable
        run: |
          if (-not (Test-Path -LiteralPath "$env:RUNNER_TEMP/BarkCloud.Builder-win-x64-self-contained/BarkCloud.Builder.exe")) {
            throw "BarkCloud.Builder.exe was not published."
          }
