name: "🚀 BarkCloud.Files CI/CD"

on:
  push:
    branches:
      - dev
    # Keep these filters in sync with pull_request.paths and runtime-paths below.
    paths:
      - 'Backend/BarkCloud.Files/**'
      - 'Backend/BarkCloud.GrpcServer/**'
      - 'Shared/BarkCloud.Shared.*/**'
      - 'Shared/BarkCloud.Proto/configuration_api.proto'
      - 'Shared/BarkCloud.Proto/session_revocation_api.proto'
      - 'Shared/BarkCloud.Proto/BarkCloud.Proto.csproj'
      - 'Shared/BarkCloud.Proto/files_api.proto'
      - 'Shared/BarkCloud.Proto/shared.proto'
      - 'Backend/rebuild.trigger'
      - 'Tests/Backend/BarkCloud.Files.Tests/**'
      - 'Tests/Backend/BarkCloud.Files.IntegrationTests/**'
      - '.github/workflows/files-upload-integration.yml'
      - 'Tests/BarkCloud.TestKit/**'
  pull_request:
    types:
      - closed
    branches:
      - master
    paths:
      - 'Backend/BarkCloud.Files/**'
      - 'Backend/BarkCloud.GrpcServer/**'
      - 'Shared/BarkCloud.Shared.*/**'
      - 'Shared/BarkCloud.Proto/configuration_api.proto'
      - 'Shared/BarkCloud.Proto/session_revocation_api.proto'
      - 'Shared/BarkCloud.Proto/BarkCloud.Proto.csproj'
      - 'Shared/BarkCloud.Proto/files_api.proto'
      - 'Shared/BarkCloud.Proto/shared.proto'
      - 'Backend/rebuild.trigger'
      - 'Tests/Backend/BarkCloud.Files.Tests/**'
      - 'Tests/Backend/BarkCloud.Files.IntegrationTests/**'
      - '.github/workflows/files-upload-integration.yml'
      - 'Tests/BarkCloud.TestKit/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  upload-integration:
    if: >-
      ${{ github.event_name == 'push' && github.ref_name == 'dev'
          || github.event_name == 'workflow_dispatch' && github.ref_name == 'dev'
          || github.event_name == 'pull_request' && github.event.pull_request.merged == true
             && github.event.pull_request.head.ref == 'dev'
             && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/files-upload-integration.yml
  ci:
    needs: upload-integration
    uses: ./.github/workflows/backend-service-ci.yml
    with:
      service-name: BarkCloud.Files
      service-key: files
      runtime-paths: |
        Backend/BarkCloud.Files/**
        Backend/BarkCloud.GrpcServer/**
        Shared/BarkCloud.Shared.*/**
        Shared/BarkCloud.Proto/configuration_api.proto
        Shared/BarkCloud.Proto/session_revocation_api.proto
        Shared/BarkCloud.Proto/BarkCloud.Proto.csproj
        Shared/BarkCloud.Proto/files_api.proto
        Shared/BarkCloud.Proto/shared.proto
        Backend/rebuild.trigger
      test-path: Tests/Backend/BarkCloud.Files.Tests
      project-path: Backend/BarkCloud.Files/BarkCloud.Files.csproj
      test-project-path: Tests/Backend/BarkCloud.Files.Tests/BarkCloud.Files.Tests.csproj
      dockerfile: Backend/BarkCloud.Files/Dockerfile.slim
      image-name: barkcloud-files
      force-run: ${{ github.event_name == 'workflow_dispatch' }}
      push-delay: 30
    secrets: inherit
