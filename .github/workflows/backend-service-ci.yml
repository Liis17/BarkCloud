name: "Backend service CI/CD"

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-key:
        required: true
        type: string
      # Пути, правка которых пересобирает образ: по одному glob на строку.
      # Совпадают с on.push.paths вызывающего воркфлоу за вычетом тестов
      runtime-paths:
        required: true
        type: string
      test-path:
        required: false
        type: string
        default: ""
      project-path:
        required: true
        type: string
      test-project-path:
        required: false
        type: string
        default: ""
      dockerfile:
        required: true
        type: string
      image-name:
        required: true
        type: string
      web-client-directory:
        required: false
        type: string
        default: ""
      force-run:
        required: false
        type: boolean
        default: false
      # Пауза (сек) между сборкой и отправкой образа: у каждого сервиса своя,
      # чтобы одновременно запущенные сборки не пушили в реестр разом
      push-delay:
        required: false
        type: number
        default: 0
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHANNEL_ID:
        required: true
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: barkcloud-image-${{ inputs.image-name }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    name: "Определение изменений"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_test: ${{ steps.decide.outputs.should_test }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Фильтры путей"
        id: paths
        env:
          RUNTIME_PATHS: ${{ inputs.runtime-paths }}
          TEST_PATH: ${{ inputs.test-path }}
        run: |
          {
            echo 'filters<<EOF'
            echo 'runtime:'
            while IFS= read -r path; do
              if [ -n "$path" ]; then echo "  - '$path'"; fi
            done <<< "$RUNTIME_PATHS"
            echo 'tests:'
            if [ -n "$TEST_PATH" ]; then echo "  - '$TEST_PATH/**'"; fi
            echo "  - 'Tests/BarkCloud.TestKit/**'"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: ${{ steps.paths.outputs.filters }}

      - name: "Решение о запуске"
        id: decide
        run: |
          should_test=false
          should_build=false

          has_tests=false
          [ -n "${{ inputs.test-project-path }}" ] && has_tests=true

          if [ "$has_tests" = "true" ] && { [ "${{ inputs.force-run }}" = "true" ] || [ "${{ steps.filter.outputs.runtime }}" = "true" ] || [ "${{ steps.filter.outputs.tests }}" = "true" ]; }; then
            should_test=true
          fi

          if [ "${{ inputs.force-run }}" = "true" ] || [ "${{ steps.filter.outputs.runtime }}" = "true" ]; then
            should_build=true
          fi

          echo "should_test=${should_test}" >> "$GITHUB_OUTPUT"
          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"

  test:
    name: "Тесты ${{ inputs.service-name }}"
    needs: changes
    if: ${{ needs.changes.outputs.should_test == 'true' }}
    runs-on: ubuntu-latest
    env:
      BARKCLOUD_TEST_POSTGRES: ${{ (inputs.service-key == 'users' || inputs.service-key == 'files') && 'Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres' || '' }}
    services:
      postgres:
        image: ${{ (inputs.service-key == 'users' || inputs.service-key == 'files') && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: "Test"
        id: test
        run: dotnet test ${{ inputs.test-project-path }} -c Release --logger "trx;LogFileName=${{ inputs.service-key }}.trx" --results-directory TestResults

      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.service-key }}
          path: TestResults/**

      - name: "Уведомление: тесты провалены"
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ❌ *Тесты провалены*

            🧪 *${{ inputs.service-name }}*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: bash .github/scripts/send-telegram.sh

  build:
    name: "Сборка и публикация ${{ inputs.service-name }}"
    needs:
      - changes
      - test
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.should_build == 'true' && needs.test.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: "Установка Node.js 22"
        if: ${{ inputs.web-client-directory != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: "Сборка React-SPA (Vite → wwwroot)"
        if: ${{ inputs.web-client-directory != '' }}
        working-directory: ${{ inputs.web-client-directory }}
        run: |
          npm ci
          npm run build

      - name: "dotnet publish (Linux Release)"
        run: |
          dotnet publish ${{ inputs.project-path }} \
            -c Release \
            -o ./publish \
            /p:UseAppHost=false
          mkdir -p ./publish/logs

      - name: "Login to Private Registry"
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          attempt=1
          until printf '%s' "$REGISTRY_PASSWORD" | docker login docker.barkfluff.com -u "$REGISTRY_USERNAME" --password-stdin; do
            [ "$attempt" -gt 3 ] && exit 1
            echo "Повтор входа в реестр через 15 с ($attempt/3)"
            sleep 15
            attempt=$((attempt + 1))
          done

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Вычисление SemVer Docker-образа"
        id: docker-version
        uses: ./.github/actions/docker-version
        with:
          image: ${{ inputs.image-name }}
          registry: docker.barkfluff.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: "Build Docker image"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ inputs.dockerfile }}
          load: true
          tags: ${{ steps.docker-version.outputs.tags }}

      - name: "Пауза перед отправкой (${{ inputs.push-delay }} с)"
        if: ${{ inputs.push-delay > 0 }}
        run: sleep ${{ inputs.push-delay }}

      - name: "Push Docker image"
        env:
          TAGS: ${{ steps.docker-version.outputs.tags }}
        run: |
          for tag in ${TAGS//,/ }; do
            attempt=1
            until docker push "$tag"; do
              [ "$attempt" -gt 3 ] && exit 1
              echo "Повтор отправки $tag через 15 с ($attempt/3)"
              sleep 15
              attempt=$((attempt + 1))
            done
          done

      - name: "Logout from Private Registry"
        if: always()
        run: docker logout docker.barkfluff.com || true

      - name: "Уведомление: сборка готова"
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ✅ *Сборка готова*

            🐳 *${{ inputs.service-name }}*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
            🏷️ Тег: `${{ steps.docker-version.outputs.tag_version }}`
        run: bash .github/scripts/send-telegram.sh

      - name: "Уведомление: сборка провалена"
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TG_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_MESSAGE: |
            ❌ *Сборка провалена*

            🐳 *${{ inputs.service-name }}*
            📌 Ветка: `${{ github.ref_name }}`
            🔗 Коммит: `${{ github.sha }}`
            👤 Автор: *${{ github.actor }}*
        run: bash .github/scripts/send-telegram.sh
