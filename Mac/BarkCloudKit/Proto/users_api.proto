syntax = "proto3";

option csharp_namespace = "BarkCloud.Proto.Users";

import "google/protobuf/timestamp.proto";
import "shared.proto";

package barkcloud.users;

// Client-facing API
service UsersApi {

  // Получить информацию о пользователе
  rpc GetUser(GetUserRequest) returns(GetUserResponse);

  // Установить аватарку
  rpc SetProfilePicture(SetProfilePictureRequest) returns(SetProfilePictureResponse);

  // Проверить существование юзернейма
  rpc CheckExistUsername(CheckExistUsernameRequest) returns(CheckExistResponse);

  // Проверить существование емейла
  rpc CheckExistEmail(CheckExistEmailRequest) returns(CheckExistResponse);

  // Изменить имя или фамилию
  rpc ChangeName(ChangeNameRequest) returns(ChangeNameResponse);

  // Изменить юзернейм
  rpc ChangeUsername(ChangeUsernameRequest) returns(ChangeUsernameResponse);

  // Изменить описание (bio)
  rpc ChangeBio(ChangeBioRequest) returns(ChangeBioResponse);

  // Найти пользователей по юзернейму/имени
  rpc SearchUsers(SearchUsersRequest) returns(SearchUsersResponse);

  // Удалить (деактивировать) собственный аккаунт
  rpc DeleteAccount(DeleteAccountRequest) returns(DeleteAccountResponse);

  // Получить настройки приватности
  rpc GetPrivacySettings(GetPrivacySettingsRequest) returns(GetPrivacySettingsResponse);

  // Обновить настройки приватности
  rpc UpdatePrivacySettings(UpdatePrivacySettingsRequest) returns(UpdatePrivacySettingsResponse);

  // Получить список устройств текущего пользователя
  rpc GetDevices(GetDevicesRequest) returns(GetDevicesResponse);

  // Получить текущее устройство
  rpc GetCurrentDevice(GetCurrentDeviceRequest) returns(GetCurrentDeviceResponse);

  // Переименовать устройство
  rpc RenameDevice(RenameDeviceRequest) returns(RenameDeviceResponse);

  // Удалить собственное устройство (отвязать)
  rpc DeleteDevice(DeleteDeviceRequest) returns(DeleteDeviceResponse);

  // Сохранить push-токен (Firebase) для текущего устройства
  rpc SetFirebaseToken(SetFirebaseTokenRequest) returns(SetFirebaseTokenResponse);
}

// Inter-service API
service UsersServerApi {

  // Найти по логину
  rpc FindByLogin(FindByLoginRequest) returns(FindByLoginResponse);

  // Проверить существование юзернейма
  rpc CheckExistUsername(CheckExistUsernameRequest) returns(CheckExistResponse);

  // Проверить существование емейла
  rpc CheckExistEmail(CheckExistEmailRequest) returns(CheckExistResponse);

  // Добавить черновик юзера
  rpc AddDraftUser(AddDraftUserRequest) returns(AddDraftUserResponse);

  // Переопределить черновик пользователя
  rpc OverrideDraftUser(AddDraftUserRequest) returns(AddDraftUserResponse);

  // Подтвердить пользователя
  rpc ConfirmUser(ConfirmUserRequest) returns(ConfirmUserResponse);

  // Получить пользователя по id
  rpc GetById(GetByIdRequest) returns(GetByIdResponse);

  // Получить контакты пользователя по id
  rpc GetUserContacts(GetUserContactsRequest) returns(GetUserContactsResponse);

  // Получить пользователей по id
  rpc ListByIds(ListByIdsRequest) returns(ListByIdsResponse);

  // Зарегистрировать устройство (вызывается Identity при авторизации)
  rpc RegisterDevice(RegisterDeviceRequest) returns(RegisterDeviceResponse);

  // Получить устройства пользователя по userId
  rpc GetUserDevices(GetUserDevicesRequest) returns(GetUserDevicesResponse);

  // Удалить устройство пользователя
  rpc DeleteUserDevice(DeleteUserDeviceRequest) returns(DeleteUserDeviceResponse);

  // Обновить лимит хранилища пользователя
  rpc UpdateStorageLimit(UpdateStorageLimitRequest) returns(UpdateStorageLimitResponse);

  // Установить аватарку пользователю (для админ-панели)
  rpc SetProfilePictureServer(SetProfilePictureServerRequest) returns(SetProfilePictureServerResponse);

  // Обновить профиль пользователя (для админ-панели)
  rpc UpdateProfileServer(UpdateProfileServerRequest) returns(UpdateProfileServerResponse);
}

// Установить аватарку (серверный)
message SetProfilePictureServerRequest {
  int64 user_id = 1;
  string profile_picture_url = 2;         // ссылка на полное изображение
  string profile_picture_preview_url = 3; // ссылка на превью
}

message SetProfilePictureServerResponse { }

// Обновить профиль пользователя (серверный, для админ-панели)
message UpdateProfileServerRequest {
  int64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string username = 4;
}

message UpdateProfileServerResponse { }

// Обновление лимита хранилища
message UpdateStorageLimitRequest {
  int64 user_id = 1;
  int32 storage_limit_gb = 2; // 0 = весь диск, иначе лимит в ГБ
}

message UpdateStorageLimitResponse {
  User user = 1;
}

message ChangeUsernameRequest {
  string username = 1; // Имя пользователя
}

message ChangeUsernameResponse { }

message ChangeNameRequest {
  string first_name = 1; // Имя
  string last_name = 2; // Фамилия
}

message ChangeNameResponse { }

message ChangeBioRequest {
  string bio = 1; // Описание профиля (до 200 символов), пустая строка — очистить
}

message ChangeBioResponse { }

message SearchUsersRequest {
  string query = 1; // Поисковая строка (юзернейм/имя/фамилия), минимум 2 символа
  int32 limit = 2; // Максимум результатов (1-50, по умолчанию 20)
}

message SearchUsersResponse {
  repeated User users = 1; // Найденные пользователи
}

message DeleteAccountRequest { }

message DeleteAccountResponse { }

message DeleteDeviceRequest {
  string device_id = 1; // Идентификатор устройства (GUID)
}

message DeleteDeviceResponse { }

message SetFirebaseTokenRequest {
  string firebase_token = 1; // Push-токен Firebase для текущего устройства, пустая строка — сброс
}

message SetFirebaseTokenResponse { }

// Кому доступно поле/действие
enum PrivacyVisibility {
  PRIVACY_VISIBILITY_EVERYONE = 0; // Всем
  PRIVACY_VISIBILITY_CONTACTS = 1; // Только контактам
  PRIVACY_VISIBILITY_NOBODY = 2;   // Никому
}

message PrivacySettings {
  PrivacyVisibility profile_visibility = 1;   // Кто видит профиль (аватар/имя/bio)
  PrivacyVisibility email_visibility = 2;     // Кто видит email
  PrivacyVisibility last_seen_visibility = 3; // Кто видит время последнего захода
  bool searchable_by_username = 4;            // Находится ли пользователь через SearchUsers
}

message GetPrivacySettingsRequest { }

message GetPrivacySettingsResponse {
  PrivacySettings settings = 1; // Текущие настройки приватности
}

message UpdatePrivacySettingsRequest {
  PrivacySettings settings = 1; // Новые настройки приватности (передаются целиком)
}

message UpdatePrivacySettingsResponse {
  PrivacySettings settings = 1; // Актуальные настройки после обновления
}

message ListByIdsRequest {
  repeated int64 ids = 1; // айдишники
}

message ListByIdsResponse {
  repeated User users = 1; // пользователи
}

message SetProfilePictureRequest {
  string file_id = 1; // идентификатор файла
}

message SetProfilePictureResponse { }

message GetUserContactsRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message GetUserContactsResponse {
  User user = 1; // пользователь
  UserContact contact = 2; // контакты пользователя
}

message UserContact {
  string email = 1; // эл. почта
}

message GetByIdRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message GetByIdResponse {
  User user = 1; // пользователь
}

message GetUserRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message GetUserResponse {
  User user = 1; // пользователь
}

message ConfirmUserRequest {
  int64 user_id = 1; // идентификатор пользователя
}

message ConfirmUserResponse { }

message AddDraftUserRequest {
  string first_name = 1; // имя
  string last_name = 2; // фамилия
  string username = 3; // имя пользователя
  string email = 4; // почта
}

message AddDraftUserResponse {
  int64 user_id = 1; // идентификатор пользователя
}

message CheckExistEmailRequest {
  string email = 1; // эл. почта
}

message CheckExistUsernameRequest {
  string username = 1; // имя пользователя
}

message CheckExistResponse {
  bool exist = 1; // существует или нет
}

message FindByLoginRequest {
  oneof login {
    string username = 1; // имя пользователя
    string email = 2; // почта
  }
}

message FindByLoginResponse {
  User user = 1; // пользователь
}

message User {
  int64 id = 1; // идентификатор пользователя
  string first_name = 2; // имя
  string last_name = 3; // фамилия
  string username = 4; // юзернейм
  google.protobuf.Timestamp registration_date = 5; // дата регистрации
  string profile_picture = 6; // ссылка на аватарку пользователя
  string profile_picture_preview = 7; // ссылка на превью аватарки
  int32 storage_limit_gb = 8; // лимит хранилища в гигабайтах; 0 = весь диск
  string bio = 9; // описание профиля (о себе)
}

// Сообщения для работы с устройствами

message Device {
  string device_id = 1; // Уникальный идентификатор устройства (GUID)
  int64 user_id = 2; // Идентификатор пользователя
  string original_name = 3; // Оригинальное имя устройства
  string custom_name = 4; // Кастомное имя устройства (задается пользователем)
  google.protobuf.Timestamp authorized_at = 5; // Дата и время авторизации
  string app_name = 6; // Имя приложения
  string operation_system = 7; // Операционная система
  string location = 8; // Страна/город
}

// Запросы и ответы для получения списка устройств
message GetDevicesRequest { }

message GetDevicesResponse {
  repeated Device devices = 1; // Список устройств пользователя
}

// Запросы и ответы для получения текущего устройства
message GetCurrentDeviceRequest { }

message GetCurrentDeviceResponse {
  Device device = 1; // Текущее устройство
}

// Запросы и ответы для переименования устройства
message RenameDeviceRequest {
  string device_id = 1; // Идентификатор устройства
  string custom_name = 2; // Новое кастомное имя
}

message RenameDeviceResponse { }

// Запросы и ответы для регистрации устройства (внутренний эндпоинт)
message RegisterDeviceRequest {
  string device_id = 1; // Уникальный идентификатор устройства (GUID)
  int64 user_id = 2; // Идентификатор пользователя
  string original_name = 3; // Оригинальное имя устройства
  string app_name = 4; // Имя приложения
  string operation_system = 5; // Операционная система
  string location = 6; // Страна/город
}

message RegisterDeviceResponse {
  Device device = 1; // Зарегистрированное устройство
}

// Запросы и ответы для получения устройств пользователя (внутренний эндпоинт)
message GetUserDevicesRequest {
  int64 user_id = 1; // Идентификатор пользователя
}

message GetUserDevicesResponse {
  repeated Device devices = 1; // Список устройств
}

// Запросы и ответы для удаления устройства пользователя (внутренний эндпоинт)
message DeleteUserDeviceRequest {
  string device_id = 1; // Идентификатор устройства
  int64 user_id = 2; // Идентификатор пользователя
}

message DeleteUserDeviceResponse { }
