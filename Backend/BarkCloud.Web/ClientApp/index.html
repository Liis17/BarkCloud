<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BarkCloud</title>
    <script>
      /* Тема применяется до рендера, чтобы не было мигания.
         Источник — localStorage (bark_theme: light|dark|auto). */
      (function () {
        try {
          var t = localStorage.getItem('bark_theme') || 'auto';
          var d = t === 'dark' ||
            (t === 'auto' && window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
