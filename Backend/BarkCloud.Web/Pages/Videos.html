<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarkCloud — Видео</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600;8..144,700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css"/>
  <script>
    /* Тема применяется до рендера, чтобы не было мигания. Источник — localStorage (bark_theme: light|dark|auto). */
    (function(){try{var t=localStorage.getItem('bark_theme')||'auto';var d=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <style>
    .vid-toolbar { display:flex; align-items:center; gap:14px; margin-bottom: 24px; flex-wrap: wrap; }
    .vid-toolbar .right { margin-left:auto; display:flex; gap:8px; align-items:center; }

    /* Featured */
    .featured-vid {
      position: relative;
      aspect-ratio: 21/9;
      border-radius: var(--r-xl);
      overflow: hidden;
      cursor: pointer;
      margin-bottom: 32px;
    }
    .featured-vid .thumb { width:100%; height:100%; border-radius: 0; }
    .featured-vid .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.75) 100%);
      padding: 32px;
      display:flex; flex-direction:column; justify-content:flex-end;
      color: #fff;
    }
    .featured-vid .play-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 96px; height: 96px;
      border-radius: var(--r-xl);
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      display:flex; align-items:center; justify-content:center;
      transition: transform var(--d-med) var(--m-emph), border-radius var(--d-med) var(--m-emph);
      border: none;
      cursor: pointer;
    }
    .featured-vid:hover .play-btn {
      transform: translate(-50%, -50%) scale(1.06);
      border-radius: var(--r-full);
    }
    .featured-vid .play-btn svg { margin-left: 6px; }
    .featured-vid .kicker {
      font-size: 13px;
      color: rgba(255,255,255,.85);
      margin-bottom: 12px;
      display: inline-flex; align-items: center; gap: 10px;
    }
    .featured-vid .kicker .pin {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      padding: 4px 12px;
      border-radius: var(--r-full);
      font-weight: 500;
      font-size: 12px;
    }
    .featured-vid .title {
      font-size: 36px;
      font-weight: 500;
      line-height: 44px;
      max-width: 60%;
      letter-spacing: 0;
    }
    .featured-vid .meta-row {
      margin-top: 16px;
      display:flex; gap: 24px; flex-wrap: wrap;
      font-size: 13px;
      color: rgba(255,255,255,.85);
    }
    .featured-vid .meta-row .key { color: rgba(255,255,255,.55); margin-right: 6px; }
    .featured-vid .duration {
      position: absolute; top: 20px; right: 20px;
      font-size: 13px;
      background: rgba(0,0,0,.55); color: white;
      padding: 6px 12px; border-radius: var(--r-full);
      font-weight: 500;
    }
    .featured-vid .res-badge {
      position: absolute; top: 20px; left: 20px;
      font-size: 12px;
      background: var(--md-primary); color: var(--md-on-primary);
      padding: 6px 14px; border-radius: var(--r-full);
      font-weight: 500;
    }

    /* Video grid */
    .vid-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }
    .vcard { display:flex; flex-direction:column; gap: 12px; cursor: pointer; }
    .vcard .vthumb {
      position: relative;
      aspect-ratio: 16/9;
      border-radius: var(--r-lg);
      overflow: hidden;
      transition: transform var(--d-short);
    }
    .vcard:hover .vthumb { transform: translateY(-3px); }
    .vcard .vthumb .thumb { width:100%; height:100%; border-radius: var(--r-lg); }
    .vcard .vthumb .play {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 56px; height: 56px;
      border-radius: var(--r-lg);
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      display:flex; align-items:center; justify-content:center;
      border: none;
      opacity: 0;
      transition: opacity var(--d-short), border-radius var(--d-med) var(--m-emph);
    }
    .vcard:hover .vthumb .play { opacity: 1; border-radius: var(--r-full); }
    .vcard .vthumb .play svg { margin-left: 4px; }
    .vcard .dur {
      position: absolute; bottom: 10px; right: 10px;
      font-size: 11px;
      background: rgba(0,0,0,.65); color: white;
      padding: 4px 8px; border-radius: var(--r-sm);
      font-weight: 500;
    }
    .vcard .res {
      position: absolute; top: 10px; left: 10px;
      font-size: 11px;
      background: rgba(255,255,255,.95); color: var(--md-on-surface);
      padding: 4px 10px; border-radius: var(--r-full);
      font-weight: 500;
    }
    .vcard .vt {
      font-size: 15px; font-weight: 500;
      color: var(--md-on-surface);
      line-height: 22px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .vcard .vmeta {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      display: flex; gap: 12px;
    }
    .vcard .vmeta .dot { color: var(--md-outline); }

    /* Stat strip — M3 cards */
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat {
      background: var(--md-surface-container-low);
      padding: 20px 22px;
      border-radius: var(--r-lg);
      display:flex; flex-direction:column; gap: 6px;
    }
    .stat .k {
      font-size: 13px;
      color: var(--md-on-surface-variant);
      font-weight: 500;
    }
    .stat .v {
      font-size: 32px;
      font-weight: 500;
      line-height: 40px;
      color: var(--md-on-surface);
    }
    .stat .delta {
      font-size: 12px;
      color: var(--md-success);
      font-weight: 500;
    }
  </style>
</head>
<body>
<div id="root"></div>

<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║ SERVER PAYLOAD (Videos.html)                                     ║
  ╠══════════════════════════════════════════════════════════════════╣
  ║ JSON-схема:                                                      ║
  ║   {                                                              ║
  ║     "stats":    [{ k, v, d? }, ...],                             ║
  ║     "filters":  [{ key, label, count? }, ...],                   ║
  ║     "featured": { title, kicker, uploadedAt, dur, quality,       ║
  ║                   size, codec, gps, resBadge, tint:[a,b] },      ║
  ║     "videos":   [{ title, dur, res, date, size, t }, ...],       ║
  ║     "sectionMeta": "12 из 186 · сортировка по дате",             ║
  ║     "sort": "Новые сначала"                                      ║
  ║   }                                                              ║
  ╚══════════════════════════════════════════════════════════════════╝
-->
<script type="application/json" id="server-data">
{{{ page_data_json }}}
</script>

<script type="text/babel">
const { AppShell, Icon, apiGet, apiPost, pickFiles, uploadFile,
        MediaThumb, Lightbox, Modal, useToast, EmptyState, Loading,
        plural, dateLabel, AlbumCard, AlbumFormModal, AlbumDetail } = window;

function fmtSize(bytes) {
  if (!bytes) return '0 Б';
  const u = ['Б', 'КБ', 'МБ', 'ГБ', 'ТБ'];
  let i = 0, v = bytes;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v.toFixed(0) : v.toFixed(v < 10 ? 1 : 0)).replace('.', ',') + ' ' + u[i];
}
function resLabel(m) {
  const h = m.height || 0;
  if (h >= 2160) return '4K';
  if (h >= 1440) return '1440p';
  if (h >= 1080) return '1080p';
  if (h >= 720) return '720p';
  if (h > 0) return 'SD';
  return '';
}
function shortDate(iso) { return iso ? dateLabel(new Date(iso)) : ''; }

function VideoCard({ m, onOpen }) {
  const res = resLabel(m);
  return (
    <div className="vcard" onClick={() => onOpen(m)}>
      <div className="vthumb">
        <MediaThumb media={m} sizes="(max-width: 700px) 100vw, 320px"/>
        <button className="play"><Icon.play size={22}/></button>
        {res && <div className="res">{res}</div>}
      </div>
      <div className="vt">{m.name}</div>
      <div className="vmeta">
        <span>{shortDate(m.createdAt)}</span><span className="dot">·</span>
        <span>{m.sizeLabel || fmtSize(m.size)}</span>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = React.useState('videos');     // videos | albums
  const [videos, setVideos] = React.useState(null);
  const [albums, setAlbums] = React.useState(null);
  const [openAlbum, setOpenAlbum] = React.useState(null);
  const [lightbox, setLightbox] = React.useState(null);
  const [creating, setCreating] = React.useState(false);
  const [upload, setUpload] = React.useState(null);
  const [toastNode, toast] = useToast();

  const loadVideos = React.useCallback(() => {
    apiGet('/api/cloud/media?kind=video')
      .then(d => setVideos(d.items || []))
      .catch(e => { toast(e.message, 'err'); setVideos([]); });
  }, [toast]);
  const loadAlbums = React.useCallback(() => {
    apiGet('/api/albums')
      .then(d => setAlbums(d.albums || []))
      .catch(e => { toast(e.message, 'err'); setAlbums([]); });
  }, [toast]);

  React.useEffect(() => { loadVideos(); loadAlbums(); }, [loadVideos, loadAlbums]);

  async function doUpload() {
    const files = await pickFiles({ accept: 'video/*' });
    if (!files.length) return;
    let done = 0;
    for (const f of files) {
      setUpload({ current: done + 1, total: files.length, pct: 0 });
      try { await uploadFile(f, p => setUpload({ current: done + 1, total: files.length, pct: Math.round(p * 100) })); }
      catch (e) { toast(`«${f.name}»: ${e.message}`, 'err'); }
      done++;
    }
    setUpload(null);
    toast(`Загружено: ${done} ${plural(done,'видео','видео','видео')}`);
    loadVideos();
  }

  const featured = videos && videos.length ? videos[0] : null;
  const totalSize = videos ? videos.reduce((s, v) => s + (v.size || 0), 0) : 0;
  const stats = [
    { k: 'Всего видео', v: videos ? String(videos.length) : '—' },
    { k: 'Занято видео', v: fmtSize(totalSize) },
    { k: 'Альбомов', v: albums ? String(albums.length) : '—' },
  ];

  const actions = (
    <>
      {tab === 'albums' && <button className="btn outlined" onClick={() => setCreating(true)}><Icon.plus size={16}/> Альбом</button>}
      <button className="btn primary" onClick={doUpload}><Icon.upload size={16}/> Загрузить видео</button>
    </>
  );

  return (
    <AppShell
      page="videos"
      kicker={<><span>Библиотека</span><span className="sep">/</span><span className="cur">Видео</span></>}
      title="Видео"
      actions={actions}
    >
      {toastNode}

      {/* Stats */}
      <div className="stat-strip">
        {stats.map((s, i) => (
          <div key={i} className="stat">
            <div className="k">{s.k}</div>
            <div className="v">{s.v}</div>
          </div>
        ))}
      </div>

      {/* Toolbar */}
      <div className="vid-toolbar">
        <div className="chip-row">
          <button className={"chip" + (tab==='videos'?' active':'')} onClick={() => { setTab('videos'); setOpenAlbum(null); }}>
            {tab==='videos' && <Icon.check size={16}/>} Все видео
            {videos && <span className="count">{videos.length}</span>}
          </button>
          <button className={"chip" + (tab==='albums'?' active':'')} onClick={() => setTab('albums')}>
            {tab==='albums' && <Icon.check size={16}/>} Альбомы
            {albums && <span className="count">{albums.length}</span>}
          </button>
        </div>
      </div>

      {upload && (
        <div className="upload-banner">
          <span className="spinner"/>
          Загрузка {upload.current}/{upload.total}…
          <div className="bar"><div className="bar-fill" style={{width: upload.pct + '%'}}/></div>
        </div>
      )}

      {/* ── Вкладка АЛЬБОМЫ ── */}
      {tab === 'albums' && (
        openAlbum
          ? <AlbumDetail album={openAlbum} candidates={videos || []} toast={toast}
              onBack={() => setOpenAlbum(null)} onChanged={() => loadAlbums()}/>
          : albums === null ? <Loading/> :
            <div className="album-grid">
              {albums.map(a => <AlbumCard key={a.id} album={a} onOpen={(al) => setOpenAlbum(al)}/>)}
              <div className="album-card new-album" onClick={() => setCreating(true)}>
                <Icon.plus size={28}/>
                <span>Создать альбом</span>
              </div>
            </div>
      )}

      {/* ── Вкладка ВСЕ ВИДЕО ── */}
      {tab === 'videos' && (
        videos === null ? <Loading/> :
        videos.length === 0
          ? <EmptyState icon="video" title="Пока нет видео" hint="Загрузите ролики — обложкой станет кадр из видео."
              action={<button className="btn primary" onClick={doUpload}><Icon.upload size={16}/> Загрузить видео</button>}/>
          : <>
              {featured && (
                <div className="featured-vid" onClick={() => setLightbox(featured)}>
                  <MediaThumb media={featured} sizes="100vw"/>
                  <div className="overlay">
                    <div className="kicker">
                      <span className="pin">★ Последнее</span>
                      <span>{shortDate(featured.createdAt)}</span>
                    </div>
                    <div className="title">{featured.name}</div>
                    <div className="meta-row">
                      {resLabel(featured) && <span><span className="key">Качество</span> {resLabel(featured)}</span>}
                      <span><span className="key">Размер</span> {featured.sizeLabel || fmtSize(featured.size)}</span>
                      {featured.width > 0 && <span><span className="key">Кадр</span> {featured.width}×{featured.height}</span>}
                    </div>
                  </div>
                  <button className="play-btn"><Icon.play size={36}/></button>
                  {resLabel(featured) && <div className="res-badge">{resLabel(featured)}</div>}
                </div>
              )}

              <div className="section-head">
                <h2>Все видео</h2>
                <div className="meta">{videos.length} {plural(videos.length,'ролик','ролика','роликов')}</div>
              </div>

              <div className="vid-grid">
                {videos.map(m => <VideoCard key={m.id} m={m} onOpen={setLightbox}/>)}
              </div>
            </>
      )}

      {creating && <AlbumFormModal onClose={() => setCreating(false)}
        onSaved={() => { setCreating(false); setTab('albums'); loadAlbums(); toast('Альбом создан'); }} toast={toast}/>}
      {lightbox && <Lightbox media={lightbox} onClose={() => setLightbox(null)}/>}
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
